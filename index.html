/* =====================================================
GAME
===================================================== */

(()=>{

const canvas=
  document.getElementById("game");

const ctx=
  canvas.getContext("2d");

ctx.imageSmoothingEnabled=false;

let W=0;
let H=0;
let DPR=1;

function resize(){

  DPR=
    Math.min(
      window.devicePixelRatio||1,
      2
    );

  W=
    window.innerWidth;

  H=
    window.innerHeight;

  canvas.width=
    Math.floor(W*DPR);

  canvas.height=
    Math.floor(H*DPR);

  ctx.setTransform(
    DPR,
    0,
    0,
    DPR,
    0,
    0
  );

  ctx.imageSmoothingEnabled=false;

  positionBossHud();

}

resize();

window.addEventListener(
  "resize",
  resize
);

/* =====================================================
HELPERS
===================================================== */

const clamp=
(value,min,max)=>
Math.max(
  min,
  Math.min(max,value)
);

const random=
(min,max)=>
min+
Math.random()*
(max-min);

const distance=
(a,b)=>
Math.hypot(
  a.x-b.x,
  a.y-b.y
);

function lerp(a,b,t){
  return a+(b-a)*t;
}

/* =====================================================
DYNAMIC BOSS HUD
===================================================== */

function positionBossHud(){

  const topHud=
    document.getElementById(
      "topHud"
    );

  const bossHud=
    document.getElementById(
      "bossHud"
    );

  if(
    !topHud ||
    !bossHud
  ){
    return;
  }

  const bounds=
    topHud.getBoundingClientRect();

  bossHud.style.top=
    Math.ceil(
      bounds.bottom+7
    )+
    "px";

}

/* =====================================================
LOCAL STORAGE
===================================================== */

function readNumber(
key,
fallback
){

  try{

    const raw=
      localStorage.getItem(key);

    if(raw===null){
      return fallback;
    }

    const value=
      Number(raw);

    return Number.isFinite(value)
      ? value
      : fallback;

  }catch(error){

    return fallback;

  }

}

function writeNumber(
key,
value
){

  try{

    localStorage.setItem(
      key,
      String(value)
    );

  }catch(error){}

}

/* =====================================================
MUSIC
===================================================== */

const musicTrack=
  document.getElementById(
    "musicTrack"
  );

let musicVolume=
  clamp(
    readNumber(
      "powerSurgeMusicVolume",
      .35
    ),
    0,
    1
  );

let sfxVolume=
  clamp(
    readNumber(
      "powerSurgeSfxVolume",
      .35
    ),
    0,
    1
  );

let musicMuted=
  !!readNumber(
    "powerSurgeMusicMuted",
    0
  );

let sfxMuted=
  !!readNumber(
    "powerSurgeSfxMuted",
    0
  );

let quickMuted=
  !!readNumber(
    "powerSurgeQuickMuted",
    0
  );

let musicStarted=false;
let wasPlayingBeforeHidden=false;

let audioContext=null;
let sfxGain=null;
let musicGain=null;
let musicSource=null;

function effectiveMusicVolume(){

  if(
    quickMuted ||
    musicMuted
  ){
    return 0;
  }

  return musicVolume*
  (
    pauseOpen
      ? .28
      : 1
  );

}

function setupMusicGraph(){

  if(
    !audioContext ||
    musicGain
  ){
    return;
  }

  try{

    musicGain=
      audioContext.createGain();

    musicSource=
      audioContext.createMediaElementSource(
        musicTrack
      );

    musicSource.connect(
      musicGain
    );

    musicGain.connect(
      audioContext.destination
    );

    musicTrack.volume=1;

  }catch(error){

    musicGain=null;
    musicSource=null;

  }

}

function refreshMusicVolume(
immediate=false
){

  const target=
    clamp(
      effectiveMusicVolume(),
      0,
      1
    );

  if(
    musicGain &&
    audioContext
  ){

    const now=
      audioContext.currentTime;

    musicGain.gain.cancelScheduledValues(
      now
    );

    if(immediate){

      musicGain.gain.setValueAtTime(
        target,
        now
      );

    }else{

      musicGain.gain.setTargetAtTime(
        target,
        now,
        .025
      );

    }

    musicTrack.volume=1;

  }else{

    musicTrack.volume=
      target;

  }

}

function refreshSfxVolume(){

  if(
    !sfxGain ||
    !audioContext
  ){
    return;
  }

  sfxGain.gain.setTargetAtTime(
    (
      quickMuted ||
      sfxMuted
    )
      ? 0
      : sfxVolume,
    audioContext.currentTime,
    .025
  );

}

function ensureAudio(){

  if(!audioContext){

    const AudioCtx=
      window.AudioContext||
      window.webkitAudioContext;

    if(AudioCtx){

      audioContext=
        new AudioCtx();

      sfxGain=
        audioContext.createGain();

      sfxGain.connect(
        audioContext.destination
      );

      setupMusicGraph();

      refreshSfxVolume();

      refreshMusicVolume(
        true
      );

    }

  }

  if(
    audioContext &&
    audioContext.state==="suspended"
  ){

    audioContext.resume();

  }

  if(!document.hidden){
    startRealMusic();
  }

}

function startRealMusic(){

  if(
    document.hidden ||
    gameIsOver
  ){
    return;
  }

  musicStarted=true;

  musicTrack.loop=true;

  refreshMusicVolume(true);

  if(
    !quickMuted &&
    !musicMuted
  ){

    const promise=
      musicTrack.play();

    if(
      promise &&
      typeof promise.catch==="function"
    ){
      promise.catch(()=>{});
    }

  }

}

function fadeMusicTo(
target,
milliseconds=400
){

  target=
    clamp(target,0,1);

  if(quickMuted){
    target=0;
  }

  if(
    musicGain &&
    audioContext
  ){

    const now=
      audioContext.currentTime;

    musicGain.gain.cancelScheduledValues(
      now
    );

    musicGain.gain.setValueAtTime(
      musicGain.gain.value,
      now
    );

    musicGain.gain.linearRampToValueAtTime(
      target,
      now+
      milliseconds/1000
    );

    return;

  }

  const start=
    musicTrack.volume;

  const started=
    performance.now();

  function step(now){

    const progress=
      clamp(
        (now-started)/
        milliseconds,
        0,
        1
      );

    musicTrack.volume=
      lerp(
        start,
        target,
        progress
      );

    if(progress<1){
      requestAnimationFrame(step);
    }

  }

  requestAnimationFrame(step);

}

/* =====================================================
SFX
===================================================== */

function tone({
  frequency=440,
  endFrequency=null,
  duration=.12,
  type="sine",
  volume=.12,
  delay=0
}={}){

  if(
    !audioContext ||
    !sfxGain
  ){
    return;
  }

  const start=
    audioContext.currentTime+
    delay;

  const oscillator=
    audioContext.createOscillator();

  const gain=
    audioContext.createGain();

  oscillator.type=
    type;

  oscillator.frequency.setValueAtTime(
    frequency,
    start
  );

  if(endFrequency){

    oscillator.frequency.exponentialRampToValueAtTime(
      Math.max(
        20,
        endFrequency
      ),
      start+duration
    );

  }

  gain.gain.setValueAtTime(
    .0001,
    start
  );

  gain.gain.exponentialRampToValueAtTime(
    Math.max(
      .001,
      volume
    ),
    start+.01
  );

  gain.gain.exponentialRampToValueAtTime(
    .0001,
    start+duration
  );

  oscillator.connect(gain);

  gain.connect(sfxGain);

  oscillator.start(start);

  oscillator.stop(
    start+
    duration+
    .03
  );

}

function noise({
  duration=.1,
  volume=.08,
  delay=0
}={}){

  if(
    !audioContext ||
    !sfxGain
  ){
    return;
  }

  const length=
    Math.floor(
      audioContext.sampleRate*
      duration
    );

  const buffer=
    audioContext.createBuffer(
      1,
      length,
      audioContext.sampleRate
    );

  const data=
    buffer.getChannelData(0);

  for(
    let i=0;
    i<length;
    i++
  ){
    data[i]=
      Math.random()*2-1;
  }

  const source=
    audioContext.createBufferSource();

  source.buffer=
    buffer;

  const gain=
    audioContext.createGain();

  const start=
    audioContext.currentTime+
    delay;

  gain.gain.setValueAtTime(
    volume,
    start
  );

  gain.gain.exponentialRampToValueAtTime(
    .0001,
    start+duration
  );

  source.connect(gain);

  gain.connect(sfxGain);

  source.start(start);

}

function lightningPitch(level){

  return[
    0,
    720,
    820,
    900,
    620,
    520,
    390,
    260
  ][clamp(level,1,7)];

}

    );

  musicValue.textContent=

    musicMuted
      ? "UNMUTE"
      : "MUTE";

  "input",
  ()=>{

    musicVolume=
      Number(
        musicSlider.value
      )/100;

    writeNumber(
      "powerSurgeMusicVolume",
      musicVolume
    );

    refreshMusicVolume(true);

    if(
      musicVolume>0 &&
      !musicMuted &&
      !quickMuted &&
      !document.hidden &&
      !gameIsOver &&
      !paused
    ){
      startRealMusic();
    }

    updateAudioUI();

  }

/* =====================================================
BACKGROUND AUDIO
===================================================== */

document.addEventListener(
  "visibilitychange",
  ()=>{

    if(document.hidden){

      wasPlayingBeforeHidden=
        !musicTrack.paused;

      musicTrack.pause();

      if(
        audioContext &&
        audioContext.state==="running"
      ){

        audioContext
          .suspend()
          .catch(()=>{});

      }

    }else{

      if(
        audioContext &&
        audioContext.state==="suspended"
      ){

        audioContext
          .resume()
          .catch(()=>{});

      }

      refreshMusicVolume(true);

      if(
        wasPlayingBeforeHidden &&
        !paused &&
        !gameIsOver &&
        !musicMuted &&
        !quickMuted
      ){
        startRealMusic();
      }

      wasPlayingBeforeHidden=false;

    }

  }
);

window.addEventListener(
  "pagehide",
  ()=>{

    wasPlayingBeforeHidden=
      !musicTrack.paused;

    musicTrack.pause();

  }
);

/* =====================================================
ROAD
===================================================== */

function roadTop(){
  return H*.55;
}

function roadBottom(){
  return H*.86;
}

function roadLeftAt(){
  return W*.025;
}

function roadRightAt(){
  return W*.975;
}

function constrainToRoad(entity){

  entity.y=
    clamp(
      entity.y,
      roadTop(),
      roadBottom()
    );

  entity.x=
    clamp(
      entity.x,
      roadLeftAt(),
      roadRightAt()
    );

}

function constrainEnteringEntity(
entity
){

  entity.y=
    clamp(
      entity.y,
      roadTop(),
      roadBottom()
    );

  if(
    entity.x>=0 &&
    entity.x<=W
  ){

    entity.entering=false;

    constrainToRoad(entity);

  }

}

function depthScale(y){

  const t=
    clamp(
      (
        y-roadTop()
      )/
      (
        roadBottom()-
        roadTop()
      ),
      0,
      1
    );

  return .67+t*.37;

}

let joystickPointer=null;

function clearInput(){

  input.x=0;
  input.y=0;

  input.light=false;
  input.heavy=false;
  input.special=false;
  input.dash=false;

  stick.style.transform=
    "translate(-50%,-50%)";

}

function updateJoystick(
clientX,
clientY
){

  ensureAudio();

  if(
    gameIsOver ||
    respawning ||
    tripleSurgeActive ||
    pauseOpen ||
    bossIntroActive
  ){
    return;
  }

  const rect=
    joystick.getBoundingClientRect();

  const centerX=
    rect.left+
    rect.width/2;

  const centerY=
    rect.top+
    rect.height/2;

  let dx=
    clientX-centerX;

  let dy=
    clientY-centerY;

  const maxDistance=
    rect.width*.31;

  const magnitude=
    Math.hypot(dx,dy);

  if(magnitude>maxDistance){

    dx=
      dx/magnitude*
      maxDistance;

    dy=
      dy/magnitude*
      maxDistance;

  }

  let nx=
    dx/maxDistance;

  let ny=
    dy/maxDistance;

  if(Math.abs(nx)<.09){
    nx=0;
  }

  if(Math.abs(ny)<.09){
    ny=0;
  }

  input.x=nx;
  input.y=ny;

  stick.style.transform=
    `translate(
      calc(-50% + ${dx}px),
      calc(-50% + ${dy}px)
    )`;

}

joystick.addEventListener(
  "pointerdown",
  event=>{

    event.preventDefault();

    joystickPointer=
      event.pointerId;

    joystick.setPointerCapture(
      event.pointerId
    );

    updateJoystick(
      event.clientX,
      event.clientY
    );

  }
);

joystick.addEventListener(
  "pointermove",
  event=>{

    if(
      event.pointerId===
      joystickPointer
    ){

      event.preventDefault();

      updateJoystick(
        event.clientX,
        event.clientY
      );

    }

  }
);

function releaseJoystick(event){

  if(
    joystickPointer===null ||
    event.pointerId===
    joystickPointer
  ){

    joystickPointer=null;

    input.x=0;
    input.y=0;

    stick.style.transform=
      "translate(-50%,-50%)";

  }

}

joystick.addEventListener(
  "pointerup",
  releaseJoystick
);

joystick.addEventListener(
  "pointercancel",
  releaseJoystick
);

/* =====================================================
ANIMATION HELPERS
===================================================== */

function changeState(
entity,
state
){

  if(entity.state===state){
    return;
  }

  entity.state=state;

  entity.frame=0;
  entity.frameTimer=0;

  if(state==="walk"){
    entity.walkDistance=0;
  }

}

function updateAnimation(
entity,
animations
){

  const animation=
    animations[
      entity.state
    ];

  if(
    !animation ||
    entity.state==="walk"
  ){
    return;
  }

  entity.frameTimer++;

  if(
    entity.frameTimer>=
    animation.speed
  ){

    entity.frameTimer=0;

    entity.frame++;

    if(
      entity.frame>=
      animation.frames
    ){

      if(animation.loop){

        entity.frame=0;

      }else{

        entity.frame=
          animation.frames-1;

      }

    }

  }

}

function getEnemyAnimations(enemy){

  if(
    enemy.boss &&
    enemy.name==="MARDI GRAS"
  ){
    return mardiGrasAnimations;
  }

  return voodooAnimations;

}

function updateEnemyAnimation(enemy){

  updateAnimation(
    enemy,
    getEnemyAnimations(enemy)
  );

}

function updateWalkAnimation(
entity,
stepDistance=8
){

  if(entity.state!=="walk"){
    return;
  }

  const moved=
    Math.hypot(
      entity.x-
      entity.previousX,
      entity.y-
      entity.previousY
    );

  entity.previousX=
    entity.x;

  entity.previousY=
    entity.y;

  entity.walkDistance+=
    moved;

  if(
    entity.walkDistance>=
    stepDistance
  ){

    entity.walkDistance-=
      stepDistance;

    entity.frame=
      (
        entity.frame+1
      )%8;

    if(
      entity.frame===1 ||
      entity.frame===5
    ){

      createFootstep(entity);

    }

  }

}

function createFootstep(entity){

  if(entity.entering){
    return;
  }

  const scale=
    depthScale(entity.y);

  const side=
    entity.frame===1
      ? -1
      : 1;

  effects.push({

    type:"footstep",

    x:
      entity.x+
      side*
      7*
      scale,

    y:
      entity.y+2,

    life:14,
    maxLife:14,

    size:
      11*
      scale

  });

}

/* =====================================================
SPRITE DRAWING
===================================================== */

function drawSprite(
image,
entity,
animations,
extraScale=1,
cellWidth=SPRITE_WIDTH,
cellHeight=SPRITE_HEIGHT
){

  if(
    !image.complete ||
    !image.naturalWidth
  ){
    return;
  }

  const animation=
    animations[
      entity.state
    ]||
    animations.idle;

  const frame=
    Math.min(
      entity.frame,
      animation.frames-1
    );

  const sourceX=
    frame*
    cellWidth;

  const sourceY=
    animation.row*
    cellHeight;

  const scale=
    depthScale(entity.y)*
    extraScale;

  const drawWidth=
    cellWidth*
    scale;

  const drawHeight=
    cellHeight*
    scale;

  const walkBob=
    entity.state==="walk"
      ?
      Math.sin(
        (
          entity.frame/8
        )*
        Math.PI*
        2
      )*
      2.2*
      scale
      :
      0;

  ctx.save();

  ctx.translate(
    entity.x,
    entity.y+
    6*
    scale+
    walkBob
  );

  if(entity.facing<0){

    ctx.scale(
      -1,
      1
    );

  }

  ctx.drawImage(
    image,

    sourceX,
    sourceY,

    cellWidth,
    cellHeight,

    -drawWidth/2,
    -drawHeight,

    drawWidth,
    drawHeight
  );

  ctx.restore();

}

function drawMardiSprite(
enemy,
scale
){

  if(
    !images.mardiGras.complete ||
    !images.mardiGras.naturalWidth
  ){

    /*
    Safe fallback:
    If the new image failed to load,
    the boss still appears as a Voodoo sprite
    instead of becoming invisible.
    */

    drawSprite(
      images.voodoo,
      enemy,
      voodooAnimations,
      scale
    );

    return;

  }

  const cellWidth=
    images.mardiGras.naturalWidth/
    MARDI_COLS;

  const cellHeight=
    images.mardiGras.naturalHeight/
    MARDI_ROWS;

  drawSprite(
    images.mardiGras,
    enemy,
    mardiGrasAnimations,
    scale,
    cellWidth,
    cellHeight
  );

}

function updateBossIntro(){

  if(
    !bossIntroActive ||
    !bossIntroBoss
  ){
    return;
  }

  const boss=
    bossIntroBoss;

  bossIntroTimer--;

  /*
  First half:
  Mardi Gras walks/flourishes into view.
  */

  if(
    bossIntroTimer>
    78
  ){

    const targetX=
      W*.72;

    boss.x=
      lerp(
        boss.x,
        targetX,
        .045
      );

    boss.facing=-1;

    if(
      bossIntroTimer<
      120
    ){

      changeState(
        boss,
        "entrance"
      );

    }

  }

  /*
  Midpoint:
  Big name reveal.
  */

  if(
    bossIntroTimer===76
  ){

    playMardiFlourish();

    showMessage(
      "🎭 MARDI GRAS 🎭"
    );

    addShake(
      4,
      10
    );

    for(
      let i=0;
      i<32;
      i++
    ){

      effects.push({

        type:"mardiConfetti",

        x:
          boss.x+
          random(
            -75,
            75
          ),

        y:
          boss.y-
          random(
            35,
            115
          ),

        vx:
          random(
            -2.4,
            2.4
          ),

        vy:
          random(
            -.5,
            2.7
          ),

        rotation:
          random(
            0,
            Math.PI*2
          ),

        spin:
          random(
            -.22,
            .22
          ),

        color:
          [
            "#7b39c8",
            "#2cba62",
            "#f5c842"
          ][
            Math.floor(
              Math.random()*3
            )
          ],

        life:
          random(
            70,
            110
          ),

        maxLife:110,

        size:
          random(
            3,
            6
          )

      });

    }

  }

  updateEnemyAnimation(
    boss
  );

  if(
    bossIntroTimer<=0
  ){

    bossIntroActive=false;

    bossIntroBoss=null;

    boss.entering=false;

    boss.x=
      clamp(
        boss.x,
        roadLeftAt(),
        roadRightAt()
      );

    boss.previousX=
      boss.x;

    boss.previousY=

    boss.attackCooldown=

      Math.max(
        boss.specialCooldown,
        95
      );

    changeState(
      boss,
      "idle"
    );

    clearInput();

    showMessage(
      "LET THE GOOD TIMES ROLL!"
    );

    if(
      !document.hidden &&
      !quickMuted &&
      !musicMuted
    ){
      startRealMusic();
    }

    fadeMusicTo(
      (
        quickMuted ||
        musicMuted
      )
        ? 0
        : musicVolume,
      400
    );

  }

}

/* =====================================================
BOSS SPAWNING
===================================================== */

function spawnBossWave(){

  const primaryIndex=
    (
      Math.floor(
        wave/5
      )-1
    )%3;

  const primaryName=
    bossNames[
      primaryIndex
    ];

  if(wave>=50){

    let secondIndex=
      (
        primaryIndex+
        1+
        Math.floor(
          Math.random()*2
        )
      )%3;

    if(
      secondIndex===
      primaryIndex
    ){

      secondIndex=
        (
          primaryIndex+1
        )%3;

    }

    enemies.push(
      buildBoss(
        primaryName,
        true,
        -1
      )
    );

    enemies.push(
      buildBoss(
        bossNames[
          secondIndex
        ],
        true,
        1
      )
    );

    document.getElementById(
      "enemyText"
    ).textContent=
      "DOUBLE BOSS";

    showMessage(
      "⚠ DOUBLE BOSS WAVE ⚠"
    );

    playBossEntrance();

    setTimeout(
      playBossEntrance,
      200
    );

  }else{

    const boss=
      buildBoss(
        primaryName,
        false,
        1
      );

    enemies.push(boss);

    document.getElementById(
      "enemyText"
    ).textContent=
      "BOSS WAVE";

    /*
    Mardi Gras now gets his unique cinematic.
    Kooshma and Rougaroux retain their current
    standard entrances until their atlases are created.
    */

    if(
      primaryName===
      "MARDI GRAS"
    ){

      startMardiGrasIntro(
        boss
      );

    }else{

      showMessage(
        primaryName+
        " APPROACHES"
      );

      playBossEntrance();

    }

  }

}

function spawnWave(){

  enemies=[];

  pendingSpawns=0;

  if(isBossWave()){

    spawnBossWave();

    return;

  }

  document.getElementById(
    "enemyText"
  ).textContent=
    "VOODOO CLAN";

  const count=
    Math.min(
      3+
      Math.floor(
        wave*.95
      ),
      12
    );

  pendingSpawns=count;

  for(
    let i=0;
    i<count;
    i++
  ){

    setTimeout(
      ()=>{

        if(gameIsOver){
          return;
        }

        enemies.push(
          createVoodoo(
            wave>=4 &&
            i%5===0
          )
        );

        pendingSpawns--;

      },
      i*210
    );

  }

  showMessage(
    "VOODOO CLAN APPROACHING"
  );

}

/* =====================================================
HEALTH DROPS
===================================================== */

function healthDropMultiplier(){

  if(wave<=30){
    return 1;
  }

  if(wave<=40){
    return .70;
  }

  if(wave<=50){
    return .50;
  }

  if(wave<=60){
    return .35;
  }

  return .25;

}

function dropPickup(enemy){

  const beadChance=
    enemy.boss
      ? .24
      : .038;

  if(
    Math.random()<
    beadChance
  ){

    pickups.push({

      type:"beads",

      x:
        clamp(
          enemy.x,
          40,
          W-40
        ),

      y:enemy.y,

      bob:
        random(
          0,
          Math.PI*2
        ),

      life:1000

    });

    return;

  }

  const multiplier=
    healthDropMultiplier();

  const roll=
    Math.random();

  let type=null;

  if(enemy.boss){

    if(
      roll<
      .07*
      multiplier
    ){
      type="handGrenade";
    }

    else if(
      roll<
      .19*
      multiplier
    ){
      type="kingCake";
    }

    else if(
      roll<
      .29*
      multiplier
    ){
      type="crawfish";
    }

  }else{

    if(
      roll<
      .005*
      multiplier
    ){
      type="handGrenade";
    }

    else if(
      roll<
      .018*
      multiplier
    ){
      type="kingCake";
    }

    else if(
      roll<
      .038*
      multiplier
    ){
      type="crawfish";
    }

    else if(
      roll<
      .058*
      multiplier
    ){
      type="boudin";
    }

    else if(
      roll<
      .083*
      multiplier
    ){
      type="daiquiri";
    }

    else if(
      roll<
      .112*
      multiplier
    ){
      type="beignets";
    }

  }

  if(!type){
    return;
  }

  pickups.push({

    type,

    x:
      clamp(
        enemy.x,
        40,
        W-40
      ),

    y:enemy.y,

    bob:
      random(
        0,
        Math.PI*2
      ),

    life:1000

  });

}

/* =====================================================
TRIPLE SURGE
===================================================== */

function attemptTripleSurge(
defeatedEnemy
){

  if(
    upgrades.lightningDash!==7 ||
    tripleSurgeActive ||
    gameIsOver ||
    respawning ||
    bossIntroActive ||
    Math.random()>.25
  ){
    return;
  }

  const targets=
    enemies
      .filter(
        enemy=>
        !enemy.dead &&
        !enemy.dying &&
        !enemy.entering &&
        enemy!==defeatedEnemy
      )
      .sort(
        (a,b)=>
        distance(a,player)-
        distance(b,player)
      )
      .slice(
        0,
        3
      );

  if(targets.length===0){
    return;
  }

  startTripleSurge(targets);

}

function startTripleSurge(
targets
){

  tripleSurgeActive=true;

  clearInput();

  const originX=
    player.x;

  const originY=
    player.y;

  player.invincible=180;

  player.vx=0;
  player.vy=0;

  player.actionLocked=true;

  player.electric=150;
  player.electricLevel=7;

  showMessage(
    "⚡ TRIPLE SURGE ⚡"
  );

  addShake(
    5,
    10
  );

  playTeleport();

  effects.push({

    type:"teleportBurst",

    x:player.x,
    y:player.y-40,

    life:18,
    maxLife:18,

    level:7

  });

  targets.forEach(
    (target,index)=>{

      setTimeout(
        ()=>{

          if(
            gameIsOver ||
            respawning
          ){

            tripleSurgeActive=false;

            return;

          }

          if(
            !target ||
            target.dead ||
            target.dying
          ){
            return;
          }

          effects.push({

            type:"teleportBurst",

            x:player.x,
            y:player.y-40,

            life:16,
            maxLife:16,

            level:7

          });

          playTeleport();

          const side=
            target.x>
            W*.5
              ? -1
              : 1;

          player.x=
            clamp(
              target.x+
              side*45,
              roadLeftAt(),
              roadRightAt()
            );

          player.y=
            clamp(
              target.y,
              roadTop(),
              roadBottom()
            );

          player.facing=
            Math.sign(
              target.x-
              player.x
            )||1;

          changeState(
            player,
            "heavy"
          );

          effects.push({

            type:"tripleSlash",

            x:target.x,
            y:target.y-45,

            facing:
              player.facing,

            life:18,
            maxLife:18,

            level:7

          });

          target.hp-=
            46*
            attackMultiplier();

          target.hitTimer=10;

          target.stun=
            target.boss
              ? 18
              : 30;

          target.hitRecovery=
            target.boss
              ? 22
              : 0;

          target.vx+=
            (
              Math.sign(
                target.x-
                player.x
              )||1
            )*
            (
              target.boss
                ? 7
                : 15
            );

          if(
            target.boss &&
            target.name===
            "MARDI GRAS"
          ){

            changeState(
              target,
              "knockback"
            );

          }

          addHitStop(3);

          addShake(
            6,
            8
          );

          playComboFinisher(
            7,
            "volt"
          );

          if(target.hp<=0){

            killEnemy(
              target,
              "lightningDash",
              true
            );

          }

        },
        120+
        index*145
      );

    }
  );

  const finishDelay=
    170+
    targets.length*
    145;

  setTimeout(
    ()=>{

      if(gameIsOver){

        tripleSurgeActive=false;

        return;

      }

      effects.push({

        type:"teleportBurst",

        x:player.x,
        y:player.y-40,

        life:20,
        maxLife:20,

        level:7

      });

      playTeleport();

      const escapeDirection=
        originX<
        W*.5
          ? -1
          : 1;

      player.x=
        clamp(
          originX+
          escapeDirection*55,
          roadLeftAt(),
          roadRightAt()
        );

      player.y=
        clamp(
          originY+
          random(-18,18),
          roadTop(),
          roadBottom()
        );

      player.previousX=
        player.x;

      player.previousY=
        player.y;

      player.vx=0;
      player.vy=0;

      player.actionLocked=false;

      player.invincible=45;

      player.electric=55;
      player.electricLevel=7;

      changeState(
        player,
        "idle"
      );

      effects.push({

        type:"teleportBurst",

        x:player.x,
        y:player.y-40,

        life:22,
        maxLife:22,

        level:7

      });

      tripleSurgeActive=false;

    },
    finishDelay
  );

}

/* =====================================================
KILL
===================================================== */

function killEnemy(
enemy,
abilityKey=null,
suppressTriple=false
){

  if(
    enemy.dead ||
    enemy.dying
  ){
    return;
  }

  /*
  Mardi Gras gets his actual defeat animation
  instead of instantly disappearing.
  */

  if(
    enemy.boss &&
    enemy.name==="MARDI GRAS" &&
    images.mardiGras.complete &&
    images.mardiGras.naturalWidth
  ){

    enemy.dying=true;

    enemy.deathTimer=58;

    enemy.vx=0;
    enemy.vy=0;

    enemy.stun=0;

    enemy.bossActionTimer=0;

    changeState(
      enemy,
      "defeat"
    );

  }else{

    enemy.dead=true;

  }

  kills++;

  dropPickup(enemy);

  attemptSkyJudgment(
    enemy,
    abilityKey
  );

  if(!suppressTriple){

    attemptTripleSurge(enemy);

  }

  if(enemy.boss){

    const baseReward=
      enemy.name==="MARDI GRAS"
        ? 650
        :
        enemy.name==="ROUXGAROUX"
          ? 800
          : 750;

    const reward=
      Math.floor(
        baseReward*
        (
          1+
          (
            enemy.tier-1
          )*.55
        )
      );

    voltage+=reward;

    runVoltageEarned+=reward;

    score+=
      reward*2;

    showMessage(
      enemy.name+
      " DEFEATED!"
    );

  }else{

    const reward=
      enemy.elite
        ? 60
        : 25;

    voltage+=reward;

    runVoltageEarned+=reward;

    score+=
      enemy.elite
        ? 220
        : 100;

  }

}

/* =====================================================
HIT ENEMIES
===================================================== */

function hitEnemies(
range,
damage,
knockback,
electric=false,
abilityKey=null,
verticalScale=.42
){

  let hits=0;

  enemies.forEach(
    enemy=>{

      if(
        enemy.dead ||
        enemy.dying ||
        enemy.entering
      ){
        return;
      }

      const dx=
        enemy.x-
        player.x;

      const dy=
        enemy.y-
        player.y;

      if(
        Math.abs(dx)<range &&
        Math.abs(dy)<
        range*
        verticalScale
      ){

        enemy.hp-=
          damage*
          attackMultiplier();

        enemy.hitTimer=8;

        const direction=
          Math.sign(dx)||
          player.facing;

        if(!enemy.boss){

          enemy.stun=
            electric
              ? 22
              : 16;

          enemy.vx+=
            direction*
            knockback;

        }else{

          enemy.stun=
            electric
              ? 18
              : 12;

          enemy.hitRecovery=
            electric
              ? 24
              : 17;

          enemy.attackCooldown=
            Math.max(
              enemy.attackCooldown,
              25
            );

          enemy.vx+=
            direction*
            knockback*
            .62;

          /*
          Mardi Gras uses his dedicated
          hit and knockback animation rows.
          */

          if(
            enemy.name===
            "MARDI GRAS"
          ){

            enemy.bossActionTimer=0;

            changeState(
              enemy,
              (
                electric ||
                damage>=35
              )
                ? "knockback"
                : "hit"
            );

          }

        }

        enemy.vy+=
          random(
            -1.2,
            1.2
          );

        const fxLevel=
          abilityKey
            ? upgrades[
                abilityKey
              ]
            : 1;

        effects.push({

          type:
            electric
              ? "electricHit"
              : "hit",

          x:enemy.x,

          y:
            enemy.y-
            45*
            depthScale(enemy.y),

          life:14,
          maxLife:14,

          level:fxLevel

        });

        hits++;

        playImpact(
          fxLevel,
          damage>=35
        );

        if(enemy.hp<=0){

          killEnemy(
            enemy,
            abilityKey
          );

        }

      }

    }
  );

  if(hits>0){

    combo+=hits;

    comboTimer=110;

    score+=
      hits*
      combo*
      5;

  }

  return hits;

}

/* =====================================================
SKY STRIKE DAMAGE
===================================================== */

function applySkyStrikeDamage(
effect
){

  if(effect.damageDone){
    return;
  }

  effect.damageDone=true;

  enemies.forEach(
    enemy=>{

      if(
        enemy.dead ||
        enemy.dying ||
        enemy.entering
      ){
        return;
      }

      if(
        Math.hypot(
          enemy.x-effect.x,
          enemy.y-effect.y
        )<115
      ){

        enemy.hp-=55;

        enemy.stun=
          enemy.boss
            ? 20
            : 32;

        enemy.vx+=
          (
            Math.sign(
              enemy.x-
              effect.x
            )||1
          )*
          (
            enemy.boss
              ? 8
              : 18
          );

        if(
          enemy.boss &&
          enemy.name===
          "MARDI GRAS"
        ){

          changeState(
            enemy,
            "knockback"
          );

        }

        effects.push({

          type:"electricHit",

          x:enemy.x,
          y:enemy.y-40,

          life:16,
          maxLife:16,

          level:7

        });

        if(enemy.hp<=0){

          killEnemy(
            enemy,
            null
          );

        }

      }

    }
  );

}

function createAbilityBurst(level){

  effects.push({

    type:"burst",

    x:player.x,
    y:player.y-35,

    life:32,
    maxLife:32,

    level

  });

  if(level>=3){

    const boltCount=
      level===3
        ? 3
        :
        level===4
          ? 4
          :
          level===5
            ? 5
            :
            level===6
              ? 7
              : 10;

    for(
      let i=0;
      i<boltCount;
      i++
    ){

      const angle=
        (
          Math.PI*2/
          boltCount
        )*
        i;

      const radius=
        80+
        level*12;

      addElectricArc(
        player.x,
        player.y-35,
        player.x+
        Math.cos(angle)*
        radius,
        player.y-35+
        Math.sin(angle)*
        radius*.45,
        14,
        level
      );

    }

  }

}

/* =====================================================
COMBOS
===================================================== */

function resetComboSequence(){

  comboSequence=[];
  comboSequenceTimer=0;

}

function registerComboInput(
letter
){

  comboSequence.push(letter);

  if(comboSequence.length>3){
    comboSequence.shift();
  }

  comboSequenceTimer=46;
  comboFlowTimer=34;

  player.actionTimer=
    Math.min(
      player.actionTimer,
      11
    );

  const code=
    comboSequence.join("");

  if(code==="AAH"){

    activateComboFinisher(
      "volt",
      "voltRush",
      "VOLT RUSH"
    );

    resetComboSequence();

  }

  else if(code==="AHA"){

    activateComboFinisher(
      "cross",
      "electricCross",
      "ELECTRIC CROSS"
    );

    resetComboSequence();

  }

  else if(code==="HAH"){

    activateComboFinisher(
      "twin",
      "twinThunder",
      "TWIN THUNDER"
    );

    resetComboSequence();

  }

}

function activateComboFinisher(
visualType,
abilityKey,
displayName
){

  const lvl=
    upgrades[
      abilityKey
    ];

  player.electric=
    35+
    lvl*12;

  player.electricLevel=
    lvl;

  player.actionLocked=true;

  player.actionTimer=
    Math.max(
      14,
      Math.floor(
        (
          26-
          lvl
        )*
        cooldownMultiplier()
      )
    );

  const range=
    visualType==="volt"
      ?
      108+
      lvl*11
      :
      visualType==="cross"
        ?
        120+
        lvl*13
        :
        135+
        lvl*15;

  const damage=
    visualType==="volt"
      ?
      comboDamage(
        34,
        lvl
      )
      :
      visualType==="cross"
        ?
        comboDamage(
          42,
          lvl
        )
        :
        comboDamage(
          53,
          lvl
        );

  const knockback=
    visualType==="volt"
      ?
      17+
      lvl*2.3
      :
      visualType==="cross"
        ?
        20+
        lvl*2.8
        :
        24+
        lvl*3.3;

  playComboFinisher(
    lvl,
    visualType
  );

  createComboVisual(
    visualType,
    lvl
  );

  const hits=
    hitEnemies(
      range,
      damage,
      knockback,
      true,
      abilityKey,
      .50+
      lvl*.008
    );

  if(hits>0){

    addHitStop(
      Math.min(
        7,
        2+
        Math.floor(
          lvl*.75
        )
      )
    );

    addShake(
      2+
      lvl*1.15,
      5+
      lvl
    );

  }

  showMessage(
    displayName+
    " LV."+
    lvl
  );

}

/* =====================================================
PLAYER UPDATE
===================================================== */

function updatePlayer(){

  if(
    respawning ||
    gameIsOver ||
    tripleSurgeActive ||
    bossIntroActive
  ){

    player.vx*=.8;
    player.vy*=.8;

    return;

  }

  let inputX=input.x;
  let inputY=input.y;

  const magnitude=
    Math.hypot(
      inputX,
      inputY
    );

  if(magnitude>1){

    inputX/=magnitude;
    inputY/=magnitude;

  }

  player.targetVx=
    inputX*
    player.maxSpeed;

  player.targetVy=
    inputY*
    player.maxSpeed*
    .67;

  if(player.actionLocked){

    const movementMultiplier=
      comboFlowTimer>0
        ? .32
        : .15;

    player.targetVx*=
      movementMultiplier;

    player.targetVy*=
      movementMultiplier;

  }

  player.vx=
    lerp(
      player.vx,
      player.targetVx,
      player.acceleration
    );

  player.vy=
    lerp(
      player.vy,
      player.targetVy,
      player.acceleration
    );

  if(Math.abs(inputX)<.05){
    player.vx*=player.friction;
  }

  if(Math.abs(inputY)<.05){
    player.vy*=player.friction;
  }

  player.x+=player.vx;
  player.y+=player.vy;

  constrainToRoad(player);

  if(Math.abs(player.vx)>.15){

    player.facing=
      Math.sign(
        player.vx
      );

  }

  if(player.actionTimer>0){
    player.actionTimer--;
  }

  if(comboFlowTimer>0){
    comboFlowTimer--;
  }

  if(
    player.actionTimer<=0 &&
    player.actionLocked
  ){
    player.actionLocked=false;
  }

  if(!player.actionLocked){

    const moving=
      Math.abs(player.vx)>.3 ||
      Math.abs(player.vy)>.25;

    changeState(
      player,
      moving
        ? "walk"
        : "idle"
    );

  }

  /* LIGHT */

  if(
    input.light &&
    !lightPressed &&
    player.lightCooldown<=0
  ){

    lightPressed=true;

    player.actionLocked=true;

    player.actionTimer=
      comboFlowTimer>0
        ? 13
        : 20;

    changeState(
      player,
      "light"
    );

    playSword();

    effects.push({

      type:"basicSlash",

      x:
        player.x+
        player.facing*28,

      y:
        player.y-42,

      facing:
        player.facing,

      life:9,
      maxLife:9,

      level:1

    });

    player.lightCooldown=
      Math.max(
        8,
        Math.floor(
          19*
          cooldownMultiplier()
        )
      );

    setTimeout(
      ()=>{

        if(
          gameIsOver ||
          respawning ||
          pauseOpen ||
          bossIntroActive
        ){
          return;
        }

        hitEnemies(
          86,
          15,
          9,
          false,
          null
        );

      },
      55
    );

    registerComboInput("A");

  }

  if(!input.light){
    lightPressed=false;
  }

  /* HEAVY */

  if(
    input.heavy &&
    !heavyPressed &&
    player.heavyCooldown<=0
  ){

    heavyPressed=true;

    player.actionLocked=true;

    player.actionTimer=
      comboFlowTimer>0
        ? 17
        : 27;

    player.electric=18;
    player.electricLevel=1;

    changeState(
      player,
      "heavy"
    );

    playHeavy();

    effects.push({

      type:"heavySlash",

      x:
        player.x+
        player.facing*32,

      y:
        player.y-44,

      facing:
        player.facing,

      life:13,
      maxLife:13,

      level:1

    });

    player.heavyCooldown=
      Math.max(
        14,
        Math.floor(
          38*
          cooldownMultiplier()
        )
      );

    setTimeout(
      ()=>{

        if(
          gameIsOver ||
          respawning ||
          pauseOpen ||
          bossIntroActive
        ){
          return;
        }

        const hits=
          hitEnemies(
            105,
            29,
            18,
            true,
            null
          );

        if(hits){

          addHitStop(2);

          addShake(
            2.5,
            5
          );

        }

      },
      75
    );

    registerComboInput("H");

  }

  if(!input.heavy){
    heavyPressed=false;
  }

  /* SPECIAL */

  if(
    input.special &&
    !specialPressed &&
    player.specialCooldown<=0 &&
    player.energy>=35
  ){

    specialPressed=true;

    const lvl=
      upgrades.thunderBurst;

    const energyCost=
      Math.max(
        21,
        35-
        (
          lvl-1
        )*2
      );

    player.energy-=
      energyCost;

    player.actionLocked=true;

    player.actionTimer=
      29+lvl;

    player.electric=
      40+
      lvl*12;

    player.electricLevel=
      lvl;

    changeState(
      player,
      "special"
    );

    playBurst(lvl);

    player.specialCooldown=
      Math.max(
        40,
        90-
        lvl*5
      );

    createAbilityBurst(lvl);

    setTimeout(
      ()=>{

        if(
          gameIsOver ||
          respawning ||
          pauseOpen ||
          bossIntroActive
        ){
          return;
        }

        const hits=
          hitEnemies(
            thunderRange(),
            thunderDamage(),
            18+
            lvl*3,
            true,
            "thunderBurst"
          );

        if(hits){

          addHitStop(
            2+
            Math.floor(
              lvl/2
            )
          );

          addShake(
            2+
            lvl*.7,
            5+
            lvl
          );

        }

      },
      85
    );

    showMessage(
      "THUNDER BURST LV."+
      lvl
    );

  }

  if(!input.special){
    specialPressed=false;
  }

  /* DASH */

  if(
    input.dash &&
    !dashPressed &&
    player.dashCooldown<=0
  ){

    dashPressed=true;

    const lvl=
      upgrades.lightningDash;

    player.dashCooldown=
      Math.max(
        18,
        48-
        lvl*4
      );

    player.invincible=
      18+
      lvl*2;

    player.electric=
      25+
      lvl*8;

    player.electricLevel=
      lvl;

    let dx=inputX;
    let dy=inputY;

    if(
      Math.hypot(dx,dy)<.2
    ){

      dx=
        player.facing;

      dy=0;

    }

    player.vx+=
      dx*
      dashDistance();

    player.vy+=
      dy*
      (
        6+
        lvl*.8
      );

    playDash(lvl);

    createDashVisual(lvl);

    const hits=
      hitEnemies(
        80+
        lvl*6,
        dashDamage(),
        12+
        lvl*2,
        true,
        "lightningDash"
      );

    if(hits){

      addShake(
        1+
        lvl*.5,
        4+
        lvl
      );

    }

  }

  if(!input.dash){
    dashPressed=false;
  }

  [
    "lightCooldown",
    "heavyCooldown",
    "specialCooldown",
    "dashCooldown",
    "invincible",
    "electric"
  ].forEach(
    key=>{

      if(player[key]>0){
        player[key]--;
      }

    }
  );

  player.energy=
    Math.min(
      player.maxEnergy,
      player.energy+.15
    );

  updateWalkAnimation(
    player,
    7
  );

  updateAnimation(
    player,
    chosenAnimations
  );

}

/* =====================================================
PLAYER LIVES
===================================================== */

function handlePlayerDown(){

  if(
    respawning ||
    gameIsOver
  ){
    return;
  }

  lives--;

  clearInput();

  resetComboSequence();

  player.hp=0;

  player.vx=0;
  player.vy=0;

  player.actionLocked=false;

  changeState(
    player,
    "idle"
  );

  playPlayerDown();

  fadeMusicTo(
    (
      quickMuted ||
      musicMuted
    )
      ? 0
      : musicVolume*.15,
    180
  );

  if(lives<=0){

    endGame();

    return;

  }

  respawning=true;
  respawnTimer=100;

  showMessage(
    "CHOSEN DOWN — "+
    lives+
    (
      lives===1
        ? " LIFE REMAINING"
        : " LIVES REMAINING"
    )
  );

}

function updateRespawn(){

  if(!respawning){
    return;
  }

  respawnTimer--;

  if(respawnTimer<=0){

    player.x=W*.5;
    player.y=H*.73;

    constrainToRoad(player);

    player.previousX=
      player.x;

    player.previousY=
      player.y;

    player.vx=0;
    player.vy=0;

    player.hp=
      player.maxHp;

    player.energy=
      player.maxEnergy;

    player.invincible=180;

    player.actionLocked=false;
    player.actionTimer=0;

    player.lightCooldown=0;
    player.heavyCooldown=0;
    player.specialCooldown=0;
    player.dashCooldown=0;

    respawning=false;

    showMessage(
      "⚡ CHOSEN RISES ⚡"
    );

    playElectricZap(1);

    if(
      !document.hidden &&
      !quickMuted &&
      !musicMuted
    ){
      startRealMusic();
    }

    fadeMusicTo(
      (
        quickMuted ||
        musicMuted
      )
        ? 0
        : musicVolume,
      350
    );

  }

}

/* =====================================================
GAME OVER
===================================================== */

function endGame(){

  gameIsOver=true;
  paused=true;
  pauseOpen=false;

  bossIntroActive=false;

  tripleSurgeActive=false;

  clearInput();

  pauseMenu.style.display=
    "none";

  if(wave>bestWaveRecord){

    bestWaveRecord=wave;

    writeNumber(
      "chosenPowerSurgeBestWave",
      bestWaveRecord
    );

  }

  if(score>highScoreRecord){

    highScoreRecord=score;

    writeNumber(
      "chosenPowerSurgeHighScore",
      highScoreRecord
    );

  }

  document.getElementById(
    "overWave"
  ).textContent=
    wave;

  document.getElementById(
    "overScore"
  ).textContent=
    score.toLocaleString();

  document.getElementById(
    "overKills"
  ).textContent=
    kills;

  document.getElementById(
    "overVoltage"
  ).textContent=
    runVoltageEarned.toLocaleString();

  document.getElementById(
    "bestWave"
  ).textContent=
    bestWaveRecord;

  document.getElementById(
    "highScore"
  ).textContent=
    highScoreRecord.toLocaleString();

  document.getElementById(
    "gameOver"
  ).style.display=
    "flex";

  playGameOver();

  fadeMusicTo(
    0,
    700
  );

}

/* =====================================================
ENEMY AI
===================================================== */

function updateEnemies(){

  enemies.forEach(
    enemy=>{

      if(enemy.dead){
        return;
      }

      /*
      Mardi Gras defeat animation.
      */

      if(enemy.dying){

        enemy.deathTimer--;

        enemy.vx*=.8;
        enemy.vy*=.8;

        updateEnemyAnimation(enemy);

        if(enemy.deathTimer<=0){
          enemy.dead=true;
        }

        return;

      }

      if(enemy.hitTimer>0){
        enemy.hitTimer--;
      }

      if(enemy.attackCooldown>0){
        enemy.attackCooldown--;
      }

      if(enemy.specialCooldown>0){
        enemy.specialCooldown--;
      }

      if(enemy.hitRecovery>0){
        enemy.hitRecovery--;
      }

      /*
      Unique Mardi Gras special animation lock.
      */

      if(
        enemy.boss &&
        enemy.name==="MARDI GRAS" &&
        enemy.bossActionTimer>0
      ){

        enemy.bossActionTimer--;

        if(
          enemy.bossSpecialType===
          "spin"
        ){

          enemy.x+=enemy.vx;
          enemy.y+=enemy.vy;

          enemy.vx*=.965;
          enemy.vy*=.965;

          constrainToRoad(enemy);

          if(
            !enemy.specialHitDone &&
            distance(
              enemy,
              player
            )<78
          ){

            enemy.specialHitDone=true;

            if(player.invincible<=0){

              player.hp-=
                enemy.damage+5;

              player.invincible=30;

              player.vx+=
                (
                  Math.sign(
                    player.x-
                    enemy.x
                  )||1
                )*
                8;

              player.vy+=
                random(
                  -3,
                  3
                );

              playImpact(
                1,
                true
              );

              addShake(
                5,
                10
              );

            }

          }

        }

        if(
          enemy.bossSpecialType===
          "confetti"
        ){

          enemy.vx*=.8;
          enemy.vy*=.8;

          /*
          Confetti attack lands around mid animation.
          */

          if(
            enemy.bossActionTimer===34 &&
            !enemy.specialHitDone
          ){

            enemy.specialHitDone=true;

            const d=
              distance(
                enemy,
                player
              );

            if(
              d<185 &&
              player.invincible<=0
            ){

              player.hp-=
                enemy.damage+3;

              player.invincible=28;

              player.vx+=
                (
                  Math.sign(
                    player.x-
                    enemy.x
                  )||1
                )*
                5;

              effects.push({

                type:"hit",

                x:player.x,
                y:player.y-45,

                life:14,
                maxLife:14,

                level:1

              });

              playImpact(
                1,
                true
              );

              addShake(
                3.5,
                7
              );

            }

          }

        }

        updateEnemyAnimation(
          enemy
        );

        if(
          enemy.bossActionTimer<=0
        ){

          enemy.bossSpecialType=null;

          enemy.specialHitDone=false;

          changeState(
            enemy,
            "idle"
          );

        }

        return;

      }

      if(enemy.entering){

        /*
        Intro cinematic controls Mardi Gras separately.
        */

        if(
          enemy.boss &&
          enemy.name==="MARDI GRAS" &&
          bossIntroActive
        ){
          return;
        }

        const targetX=
          enemy.x<0
            ? 65
            : W-65;

        const dx=
          targetX-
          enemy.x;

        enemy.facing=
          Math.sign(dx);

        enemy.vx=
          lerp(
            enemy.vx,
            Math.sign(dx)*
            enemy.speed*
            1.45,
            .14
          );

        enemy.x+=enemy.vx;

        constrainEnteringEntity(
          enemy
        );

        changeState(
          enemy,
          "walk"
        );

        updateWalkAnimation(
          enemy,
          8
        );

        return;

      }

      if(enemy.stun>0){

        enemy.stun--;

        enemy.vx*=.88;
        enemy.vy*=.88;

        enemy.x+=enemy.vx;
        enemy.y+=enemy.vy;

        constrainToRoad(enemy);

        /*
        Keep Mardi's hit/knockback animation
        while stunned.
        */

        if(
          !(
            enemy.boss &&
            enemy.name==="MARDI GRAS" &&
            (
              enemy.state==="hit" ||
              enemy.state==="knockback"
            )
          )
        ){

          changeState(
            enemy,
            "idle"
          );

        }

        updateEnemyAnimation(
          enemy
        );

        return;

      }

      if(
        respawning ||
        tripleSurgeActive
      ){

        enemy.vx*=.82;
        enemy.vy*=.82;

        changeState(
          enemy,
          "idle"
        );

        updateEnemyAnimation(
          enemy
        );

        return;

      }

      const dx=
        player.x-
        enemy.x;

      const dy=
        player.y-
        enemy.y;

      const d=
        Math.hypot(dx,dy);

      enemy.facing=
        Math.sign(dx)||
        enemy.facing;

      let desiredX=0;
      let desiredY=0;

      if(
        enemy.boss &&
        enemy.hitRecovery>0
      ){

        desiredX=
          -Math.sign(dx)*
          enemy.speed*.45;

      }else{

        if(Math.abs(dy)>16){

          desiredY=
            Math.sign(dy)*
            enemy.speed*.55;

        }

        if(Math.abs(dx)>62){

          desiredX=
            Math.sign(dx)*
            enemy.speed;

        }

      }

      /*
      Mardi Gras erratic movement.
      */

      if(
        enemy.boss &&
        enemy.name==="MARDI GRAS" &&
        enemy.hitRecovery<=0 &&
        Math.random()<.022
      ){

        desiredX+=
          random(
            -3.5,
            3.5
          );

        desiredY+=
          random(
            -2,
            2
          );

      }

      /* BOSS SPECIALS */

      if(
        enemy.boss &&
        enemy.specialCooldown<=0 &&
        enemy.hitRecovery<=0 &&
        d>90
      ){

        if(
          enemy.name===
          "MARDI GRAS"
        ){

          /*
          Mardi now randomly chooses between:
          - Masquerade Spin
          - Confetti Storm
          */

          if(Math.random()<.58){

            startMardiSpin(
              enemy,
              dx,
              dy,
              d
            );

          }else{

            startMardiConfetti(
              enemy
            );

          }

          enemy.specialCooldown=
            enemy.specialCooldownBase;

          return;

        }

        else if(
          enemy.name===
          "ROUXGAROUX"
        ){

          enemy.vx=
            dx/(d||1)*9;

          enemy.vy=
            dy/(d||1)*5;

          showMessage(
            "SWAMP LEAP!"
          );

        }

        else{

          enemy.x=
            clamp(
              player.x+
              random(
                -90,
                90
              ),
              roadLeftAt(),
              roadRightAt()
            );

          enemy.y=
            clamp(
              player.y+
              random(
                -35,
                35
              ),
              roadTop(),
              roadBottom()
            );

          showMessage(
            "NIGHT TERROR!"
          );

        }

        enemy.specialCooldown=
          enemy.specialCooldownBase;

      }

      enemy.vx=
        lerp(
          enemy.vx,
          desiredX,
          .10
        );

      enemy.vy=
        lerp(
          enemy.vy,
          desiredY,
          .10
        );

      /*
      CLOSE-RANGE ATTACK
      */

      if(
        Math.abs(dx)<60 &&
        Math.abs(dy)<27 &&
        enemy.attackCooldown<=0 &&
        enemy.hitRecovery<=0
      ){

        enemy.attackCooldown=
          enemy.boss
            ?
            enemy.attackCooldownBase
            :
            random(
              55,
              80
            );

        changeState(
          enemy,
          "attack"
        );

        enemy.frame=0;

        if(player.invincible<=0){

          player.hp-=
            enemy.damage;

          player.invincible=22;

          player.vx+=
            Math.sign(dx)*
            -3.5;

          effects.push({

            type:"hit",

            x:player.x,
            y:player.y-45,

            life:14,
            maxLife:14,

            level:1

          });

          playImpact(
            1,
            enemy.boss
          );

          if(enemy.boss){

            addShake(
              3.5,
              6
            );

          }

        }

      }else{

        const moving=
          Math.abs(enemy.vx)>.25 ||
          Math.abs(enemy.vy)>.20;

        if(
          enemy.state!=="attack" ||
          enemy.frame>=7
        ){

          changeState(
            enemy,
            moving
              ? "walk"
              : "idle"
          );

        }

      }

      enemy.x+=enemy.vx;
      enemy.y+=enemy.vy;

      constrainToRoad(enemy);

      updateWalkAnimation(
        enemy,
        8
      );

      updateEnemyAnimation(
        enemy
      );

    }
  );

  enemies=
    enemies.filter(
      enemy=>
      !enemy.dead
    );

  if(
    enemies.length===0 &&
    pendingSpawns===0 &&
    !wavePending &&
    !gameIsOver &&
    !tripleSurgeActive &&
    !bossIntroActive
  ){

    wavePending=true;

    if(
      shouldOpenShop(wave)
    ){

      setTimeout(
        ()=>{

          if(!gameIsOver){
            openShop();
          }

        },
        650
      );

    }else{

      setTimeout(
        ()=>{

          if(gameIsOver){
            return;
          }

          wave++;

          wavePending=false;

          spawnWave();

        },
        750
      );

    }

  }

  if(player.hp<=0){
    handlePlayerDown();
  }

}

/* =====================================================
PICKUPS
===================================================== */

function updatePickups(){

  pickups.forEach(
    pickup=>{

      pickup.life--;

      pickup.bob+=.055;

      if(
        !respawning &&
        !tripleSurgeActive &&
        !bossIntroActive &&
        distance(
          player,
          pickup
        )<42
      ){

        const data=
          pickupTypes[
            pickup.type
          ];

        if(data.heal){

          const before=
            player.hp;

          player.hp=
            Math.min(
              player.maxHp,
              player.hp+
              data.heal
            );

          const healed=
            Math.round(
              player.hp-
              before
            );

          showPickup(
            data.name+
            " +"+
            healed+
            " HP"
          );

        }

        if(data.points){

          score+=data.points;

          voltage+=data.voltage;

          runVoltageEarned+=
            data.voltage;

          showPickup(
            data.name+
            " +"+
            data.points+
            " PTS"
          );

        }

        pickup.life=0;

        playPickup();

      }

    }
  );

  pickups=
    pickups.filter(
      pickup=>
      pickup.life>0
    );

}

/* =====================================================
EFFECT UPDATE
===================================================== */

function updateEffects(){

  effects.forEach(
    effect=>{

      if(
        effect.type===
        "skyStrike" &&
        effect.life===22
      ){

        applySkyStrikeDamage(
          effect
        );

        addHitStop(5);

      }

      /*
      Confetti physics.
      */

      if(
        effect.type===
        "mardiConfetti"
      ){

        effect.x+=
          effect.vx||0;

        effect.y+=
          effect.vy||0;

        effect.vy=
          (effect.vy||0)+.015;

        effect.rotation+=
          effect.spin||0;

      }

      effect.life--;

    }
  );

  effects=
    effects.filter(
      effect=>
      effect.life>0
    );

}

/* =====================================================
SHOP
===================================================== */

function shouldOpenShop(
completedWave
){

  if(completedWave<=20){

    return(
      completedWave%5===0
    );

  }

  return(
    completedWave%10===0
  );

}

function coreUpgradeCost(type){

  return Math.floor(
    220*
    Math.pow(
      1.42,
      upgrades[type]-1
    )
  );

}

function abilityUpgradeCost(type){

  return(
    190+
    upgrades[type]*
    105
  );

}

function levelDots(
abilityLevel
){

  let text="";

  for(
    let i=1;
    i<=7;
    i++
  ){

    text+=
      i<=abilityLevel
        ? "●"
        : "○";

  }

  return text;

}

function openShop(){

  paused=true;

  clearInput();

  updateShop();

  document.getElementById(
    "shop"
  ).style.display=
    "flex";

  fadeMusicTo(
    (
      quickMuted ||
      musicMuted
    )
      ? 0
      : musicVolume*.35,
    220
  );

}

function updateAbilityCard(
type,
dotsId,
buttonId
){

  const abilityLevel=
    upgrades[type];

  const dots=
    document.getElementById(
      dotsId
    );

  const button=
    document.getElementById(
      buttonId
    );

  const colors=
    abilityColor(
      abilityLevel
    );

  dots.textContent=
    levelDots(
      abilityLevel
    );

  dots.style.color=
    colors.main;

  dots.style.textShadow=
    `0 0 10px ${colors.glow}`;

  if(abilityLevel>=7){

    button.textContent=
      type==="lightningDash"
        ?
        "👑 ROYAL BLUE — TRIPLE SURGE"
        :
        "👑 ROYAL BLUE — MAX";

    button.disabled=true;

    return;

  }

  const price=
    abilityUpgradeCost(type);

  const nextColor=
    abilityColor(
      abilityLevel+1
    );

  button.textContent=
    "⚡ "+
    price+
    " → "+
    nextColor.name;

  button.disabled=
    voltage<price;

}

function updateVitalityCard(){

  const button=
    document.getElementById(
      "vitalityButton"
    );

  document.getElementById(
    "vitalityLevel"
  ).textContent=
    upgrades.vitality;

  document.getElementById(
    "vitalityHp"
  ).textContent=
    player.maxHp;

  if(upgrades.vitality>=5){

    button.textContent=
      "♥ MAX HP — 200";

    button.disabled=true;

    return;

  }

  const nextLevel=
    upgrades.vitality+1;

  const nextHp=
    vitalityLevels[
      nextLevel
    ];

  const price=
    vitalityCosts[
      nextLevel
    ];

  button.textContent=
    "♥ "+
    price.toLocaleString()+
    " VOLTAGE → "+
    nextHp+
    " HP";

  button.disabled=
    voltage<price;

}

function updateShop(){

  document.getElementById(
    "shopVoltage"
  ).textContent=
    voltage.toLocaleString();

  document.getElementById(
    "powerLevel"
  ).textContent=
    upgrades.power;

  document.getElementById(
    "speedLevel"
  ).textContent=
    upgrades.speed;

  [
    [
      "power",
      "powerButton"
    ],
    [
      "speed",
      "speedButton"
    ]
  ].forEach(
    ([type,id])=>{

      const button=
        document.getElementById(id);

      const price=
        coreUpgradeCost(type);

      button.textContent=
        "⚡ "+
        price+
        " VOLTAGE";

      button.disabled=
        voltage<price;

    }
  );

  updateVitalityCard();

  updateAbilityCard(
    "thunderBurst",
    "thunderDots",
    "thunderButton"
  );

  updateAbilityCard(
    "lightningDash",
    "dashDots",
    "dashUpgradeButton"
  );

  updateAbilityCard(
    "voltRush",
    "voltDots",
    "voltButton"
  );

  updateAbilityCard(
    "electricCross",
    "crossDots",
    "crossButton"
  );

  updateAbilityCard(
    "twinThunder",
    "twinDots",
    "twinButton"
  );

}

function buyCoreUpgrade(type){

  const price=
    coreUpgradeCost(type);

  if(voltage<price){
    return;
  }

  voltage-=price;

  upgrades[type]++;

  playPickup();

  updateShop();

}

function buyVitality(){

  if(upgrades.vitality>=5){
    return;
  }

  const nextLevel=
    upgrades.vitality+1;

  const price=
    vitalityCosts[
      nextLevel
    ];

  if(voltage<price){
    return;
  }

  const oldMax=
    player.maxHp;

  const newMax=
    vitalityLevels[
      nextLevel
    ];

  const gained=
    newMax-
    oldMax;

  voltage-=price;

  upgrades.vitality=
    nextLevel;

  player.maxHp=
    newMax;

  player.hp=
    Math.min(
      player.maxHp,
      player.hp+
      gained
    );

  playPickup();

  showMessage(
    "♥ VITALITY UPGRADED — "+
    newMax+
    " MAX HP"
  );

  updateShop();

}

function buyAbilityUpgrade(type){

  if(upgrades[type]>=7){
    return;
  }

  const price=
    abilityUpgradeCost(type);

  if(voltage<price){
    return;
  }

  voltage-=price;

  upgrades[type]++;

  const newLevel=
    upgrades[type];

  const color=
    abilityColor(newLevel);

  playElectricZap(newLevel);

  addShake(
    2+
    newLevel*.5,
    8
  );

  if(newLevel===7){

    showMessage(
      type==="lightningDash"
        ?
        "👑 TRIPLE SURGE UNLOCKED 👑"
        :
        "👑 ROYAL BLUE UNLEASHED 👑"
    );

  }else{

    showMessage(
      color.name+
      " LIGHTNING!"
    );

  }

  updateShop();

}

document.getElementById(

document.getElementById(

document.getElementById(

document.getElementById(
  "continueButton"
).onclick=
()=>{

  document.getElementById(
    "shop"
  ).style.display=

  paused=false;

  wave++;

  wavePending=false;

  player.hp=
    Math.min(
      player.maxHp,
      player.hp+

    );

    !quickMuted &&
    !musicMuted

  );
