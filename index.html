===================================================== */

let W=0;
let H=0;
let DPR=1;


/* =====================================================
RESIZE
===================================================== */

function resize(){

  DPR=
    Math.min(
      window.devicePixelRatio || 1,
      2
    );


  W=
    window.innerWidth;


  H=
    window.innerHeight;


  canvas.width=
    Math.floor(
      W*DPR
    );


  canvas.height=
    Math.floor(
      H*DPR
    );


  ctx.setTransform(
    DPR,
    0,
    0,
    DPR,
    0,
    0
  );

    false;

}


resize();

  "resize",

);

HELPERS
===================================================== */

(value,min,max)=>
Math.max(

  Math.min(

);


const random=
(min,max)=>
min+
Math.random()*

(a,b)=>

);


function lerp(
a,
b,
amount
){

    (b-a)*

  );

}

/* =====================================================
HORIZONTAL ROAD

The road now runs LEFT → RIGHT.

Up/down is only depth movement.
===================================================== */

function roadTop(){

  return(
    H*.55
  );

}


function roadBottom(){

  return(
    H*.86
  );

}


function roadLeftAt(){

  return(
    W*.025
  );

}


function roadRightAt(){

  return(
    W*.975
  );

}


function constrainToRoad(
entity
){

  entity.y=
    clamp(
      entity.y,
      roadTop(),
      roadBottom()
    );


  entity.x=
    clamp(
      entity.x,
      roadLeftAt(),
      roadRightAt()
    );

}


/*
Used while characters are still
entering from off-screen.
*/

function constrainEnteringEntity(
entity
){

  entity.y=
    clamp(
      entity.y,
      roadTop(),
      roadBottom()
    );


  if(
    entity.x>=0 &&
    entity.x<=W
  ){

    entity.entering=
      false;


    constrainToRoad(
      entity
    );

  }

}


/* =====================================================
DEPTH SCALE
===================================================== */

function depthScale(y){

  const t=
    clamp(

      (
        y-
        roadTop()
      )

      /

      (
        roadBottom()-
        roadTop()
      ),

      0,
      1

    );


  return(
    .67+
    t*.37
  );

}

/* =====================================================
JOYSTICK
===================================================== */

const joystick=
  document.getElementById(
    "joystick"
  );


const stick=
  document.getElementById(
    "stick"
  );


let joystickPointer=
  null;


function updateJoystick(
clientX,
clientY
){

  const rect=
    joystick.getBoundingClientRect();


  const centerX=
    rect.left+
    rect.width/2;


  const centerY=
    rect.top+
    rect.height/2;


  let dx=
    clientX-
    centerX;


  let dy=
    clientY-
    centerY;


  const maxDistance=
    rect.width*.31;


  const magnitude=
    Math.hypot(
      dx,
      dy
    );


  if(
    magnitude>
    maxDistance
  ){

    dx=
      dx/magnitude*
      maxDistance;


    dy=
      dy/magnitude*
      maxDistance;

  }


  let nx=
    dx/
    maxDistance;


  let ny=
    dy/
    maxDistance;


  if(
    Math.abs(nx)<.09
  ){

    nx=0;

  }


  if(
    Math.abs(ny)<.09
  ){

    ny=0;

  }


  input.x=
    nx;


  input.y=
    ny;


  stick.style.transform=

    `translate(
      calc(-50% + ${dx}px),
      calc(-50% + ${dy}px)
    )`;

}


joystick.addEventListener(

  "pointerdown",

  event=>{

    event.preventDefault();


    joystickPointer=
      event.pointerId;


    joystick.setPointerCapture(
      event.pointerId
    );


    updateJoystick(
      event.clientX,
      event.clientY
    );

  }

);


joystick.addEventListener(

  "pointermove",

  event=>{

    if(
      event.pointerId===
      joystickPointer
    ){

      event.preventDefault();


      updateJoystick(
        event.clientX,
        event.clientY
      );

    }

  }

);


function releaseJoystick(
event
){

  if(

    joystickPointer===null

    ||

    event.pointerId===
    joystickPointer

  ){

    joystickPointer=
      null;


    input.x=0;

    input.y=0;


    stick.style.transform=
      "translate(-50%,-50%)";

  }

}


joystick.addEventListener(
  "pointerup",
  releaseJoystick
);


joystick.addEventListener(
  "pointercancel",
  releaseJoystick
);


/* =====================================================
BUTTONS
===================================================== */

function bindButton(
id,
property
){

  const button=
    document.getElementById(
      id
    );


  button.addEventListener(

    "pointerdown",

    event=>{

      event.preventDefault();

      input[property]=
        true;

    }

  );


  function release(
event
){

    event.preventDefault();

    input[property]=
      false;

  }


  button.addEventListener(
    "pointerup",
    release
  );


  button.addEventListener(
    "pointercancel",
    release
  );


  button.addEventListener(
    "pointerleave",
    release
  );

}

/* =====================================================
ANIMATION
===================================================== */

function changeState(
entity,
state
){

  if(
    entity.state===
    state
  ){

    return;

  }


  entity.state=
    state;


  entity.frame=0;

  entity.frameTimer=0;

}


function updateAnimation(
entity,
animations
){

  const animation=
    animations[
      entity.state
    ];


  if(
    !animation
  ){

    return;

  }


  entity.frameTimer++;


  if(
    entity.frameTimer>=
    animation.speed
  ){

    entity.frameTimer=0;


    entity.frame++;


    if(
      entity.frame>=
      animation.frames
    ){

      if(
        animation.loop
      ){

        entity.frame=0;

      }

      else{

        entity.frame=
          animation.frames-1;

      }

    }

  }

}


/* =====================================================
DRAW SPRITE
===================================================== */

function drawSprite(
image,
entity,
animations,
extraScale=1
){

  if(
    !image.complete ||
    !image.naturalWidth
  ){

    return false;

  }


  const animation=
    animations[
      entity.state
    ]
    ||
    animations.idle;


  const frame=
    Math.min(
      entity.frame,
      animation.frames-1
    );


  const sourceX=
    frame*
    SPRITE_WIDTH;


  const sourceY=
    animation.row*
    SPRITE_HEIGHT;


  const scale=
    depthScale(
      entity.y
    )*
    extraScale;


  const drawWidth=
    SPRITE_WIDTH*
    scale;


  const drawHeight=
    SPRITE_HEIGHT*
    scale;


  const footOffset=
    6*
    scale;


  ctx.save();


  ctx.translate(
    entity.x,
    entity.y+
    footOffset
  );


  if(
    entity.facing<0
  ){

    ctx.scale(
      -1,
      1
    );

  }


  ctx.drawImage(

    image,

    sourceX,
    sourceY,

    SPRITE_WIDTH,
    SPRITE_HEIGHT,

    -drawWidth/2,
    -drawHeight,

    drawWidth,
    drawHeight

  );


  ctx.restore();


  return true;

}


/* =====================================================
COMBAT VALUES
===================================================== */

function attackMultiplier(){

  return(
    1+
    (
      upgrades.power-1
    )*.14
  );

}


function abilityMultiplier(){

  return(
    1+
    (
      upgrades.ability-1
    )*.18
  );

}


function cooldownMultiplier(){

  return Math.max(

    .45,

    1-
    (
      upgrades.speed-1
    )*.075

  );

}


/* =====================================================
VOODOO CLAN SPAWN

Enemies now walk in from
LEFT or RIGHT.
===================================================== */

function createVoodoo(
elite=false
){

  const side=
    Math.random()<.5
    ?
    -1
    :
    1;


  const y=
    random(
      roadTop()+20,
      roadBottom()-15
    );


  return{

    boss:false,

    elite,

    entering:true,


    x:
      side<0
      ?
      -75
      :
      W+75,


    y,


    vx:0,
    vy:0,


    hp:
      elite
      ?
      135
      :
      72,


    maxHp:
      elite
      ?
      135
      :
      72,


    damage:
      elite
      ?
      14
      :
      8,


    speed:
      elite
      ?
      1.6
      :
      random(
        1.25,
        1.48
      ),


    attackCooldown:
      random(
        45,
        75
      ),


    specialCooldown:0,


    stun:0,

    hitTimer:0,


    dead:false,


    facing:
      side<0
      ?
      1
      :
      -1,


    state:
      "walk",


    frame:0,

    frameTimer:0

  };

}


/* =====================================================
BOSSES

Mardi Gras has been rebalanced.
===================================================== */

function createBoss(){

  const index=
    (
      Math.floor(
        wave/5
      )-1
    )%3;


  const names=[

    "MARDI GRAS",

    "ROUXGAROUX",

    "KOOSHMA"

  ];


  const name=
    names[
      index
    ];


  const tier=
    Math.floor(
      (
        wave-5
      )/15
    )+1;


  let hp=
    540;


  let speed=
    1.55;


  let damage=
    14;


  let attackCooldown=
    62;


  let specialCooldown=
    130;


  if(
    name===
    "ROUXGAROUX"
  ){

    hp=850;

    speed=1.4;

    damage=21;

    attackCooldown=58;

    specialCooldown=115;

  }


  if(
    name===
    "KOOSHMA"
  ){

    hp=720;

    speed=1.55;

    damage=17;

    attackCooldown=58;

    specialCooldown=125;

  }


  hp=
    Math.floor(

      hp*

      (
        1+
        (
          tier-1
        )*.42
      )

    );


  return{

    boss:true,

    elite:true,

    entering:true,


    name,

    tier,


    /*
    Boss enters from the right.
    */

    x:
      W+115,


    y:
      roadTop()+
      (
        roadBottom()-
        roadTop()
      )*.48,


    vx:0,
    vy:0,


    hp,

    maxHp:hp,


    speed,

    damage,


    attackCooldown,

    attackCooldownBase:
      attackCooldown,


    specialCooldown,

    specialCooldownBase:
      specialCooldown,


    stun:0,

    hitTimer:0,


    /*
    Extra recovery is used
    after Chosen lands a hit.
    */

    hitRecovery:0,


    dead:false,


    facing:-1,


    state:
      "walk",


    frame:0,

    frameTimer:0

  };

}


/* =====================================================
WAVES
===================================================== */

function isBossWave(){

  return(
    wave%5===0
  );

}


function spawnWave(){

  enemies=[];


  currentBoss=
    null;


  if(
    isBossWave()
  ){

    currentBoss=
      createBoss();


    enemies.push(
      currentBoss
    );


    document.getElementById(
      "enemyText"
    ).textContent=
      "BOSS WAVE";


    showMessage(
      currentBoss.name+
      " APPROACHES"
    );

  }

  else{

    document.getElementById(
      "enemyText"
    ).textContent=
      "VOODOO CLAN";


    const count=
      Math.min(

        3+
        Math.floor(
          wave*.95
        ),

        12

      );


    /*
    Slight spawn staggering so the
    whole wave doesn't enter together.
    */

    for(
      let i=0;
      i<count;
      i++
    ){

      setTimeout(

        ()=>{

          enemies.push(

            createVoodoo(

              wave>=4

              &&

              i%5===0

            )

          );

        },

        i*160

      );

    }


    showMessage(
      "VOODOO CLAN APPROACHING"
    );

  }

}


/* =====================================================
RARER PICKUPS
===================================================== */

function dropPickup(
enemy
){

  const roll=
    Math.random();


  let type=
    null;


  /*
  Bosses still usually reward
  something useful.
  */

  if(
    enemy.boss
  ){

    if(
      roll<.08
    ){

      type=
        "handGrenade";

    }

    else if(
      roll<.22
    ){

      type=
        "kingCake";

    }

    else if(
      roll<.48
    ){

      type=
        "beads";

    }

  }


  /*
  Normal enemies:
  roughly 18% total drop chance.
  */

  else{

    if(
      roll<.008
    ){

      type=
        "handGrenade";

    }

    else if(
      roll<.025
    ){

      type=
        "kingCake";

    }

    else if(
      roll<.05
    ){

      type=
        "crawfish";

    }

    else if(
      roll<.075
    ){

      type=
        "boudin";

    }

    else if(
      roll<.105
    ){

      type=
        "daiquiri";

    }

    else if(
      roll<.14
    ){

      type=
        "beignets";

    }

    else if(
      roll<.18
    ){

      type=
        "beads";

    }

  }


  if(
    !type
  ){

    return;

  }


  pickups.push({

    type,

    x:
      clamp(
        enemy.x,
        40,
        W-40
      ),

    y:
      enemy.y,

    bob:
      random(
        0,
        Math.PI*2
      ),

    life:
      1000

  });

}


/* =====================================================
KILL / REWARD
===================================================== */

function killEnemy(
enemy
){

  if(
    enemy.dead
  ){

    return;

  }


  enemy.dead=
    true;


  dropPickup(
    enemy
  );


  if(
    enemy.boss
  ){

    const baseReward=

      enemy.name===
      "MARDI GRAS"

      ?

      650

      :

      enemy.name===
      "ROUXGAROUX"

      ?

      800

      :

      750;


    const reward=
      Math.floor(

        baseReward*

        (
          1+
          (
            enemy.tier-1
          )*.55
        )

      );


    voltage+=
      reward;


    score+=
      reward*2;


    showMessage(
      enemy.name+
      " DEFEATED!"
    );

  }


  else{

    voltage+=

      enemy.elite
      ?
      60
      :
      25;


    score+=

      enemy.elite
      ?
      220
      :
      100;

  }

}


/* =====================================================
PLAYER ATTACKS / BOSS KNOCKBACK
===================================================== */

function hitEnemies(
range,
damage,
knockback,
electric=false
){

  let hits=
    0;


  enemies.forEach(

    enemy=>{

      if(
        enemy.dead
      ){

        return;

      }


      /*
      Don't hit an enemy that hasn't
      entered the screen yet.
      */

      if(
        enemy.entering
      ){

        return;

      }


      const dx=
        enemy.x-
        player.x;


      const dy=
        enemy.y-
        player.y;


      const horizontal=
        Math.abs(dx);


      const vertical=
        Math.abs(dy);


      if(

        horizontal<
        range

        &&

        vertical<
        range*.42

      ){

        let totalDamage=
          damage*
          attackMultiplier();


        if(
          electric
        ){

          totalDamage*=
            abilityMultiplier();

        }


        enemy.hp-=
          totalDamage;


        enemy.hitTimer=
          8;


        const direction=
          Math.sign(dx)
          ||
          player.facing;


        /*
        NORMAL ENEMIES
        */

        if(
          !enemy.boss
        ){

          enemy.stun=
            electric
            ?
            22
            :
            16;


          enemy.vx+=
            direction*
            knockback;


          enemy.vy+=
            random(-1.8,1.8);

        }


        /*
        BOSSES

        Bigger knockback and stun
        than before.

        This creates an actual
        opening after landing hits.
        */

        else{

          enemy.stun=
            electric
            ?
            18
            :
            12;


          enemy.hitRecovery=
            electric
            ?
            24
            :
            17;


          enemy.attackCooldown=
            Math.max(
              enemy.attackCooldown,
              25
            );


          enemy.vx+=
            direction*
            knockback*
            .62;


          enemy.vy+=
            random(-1.2,1.2);


          /*
          Strong moves push bosses
          farther away.
          */

          if(
            knockback>=15
          ){

            enemy.vx+=
              direction*4;

          }

        }


        effects.push({

          type:
            electric
            ?
            "electricHit"
            :
            "hit",

          x:
            enemy.x,

          y:
            enemy.y-
            45*
            depthScale(
              enemy.y
            ),

          life:
            14

        });


        hits++;


        if(
          enemy.hp<=0
        ){

          killEnemy(
            enemy
          );

        }

      }

    }

  );


  if(
    hits>0
  ){

    combo+=
      hits;


    comboTimer=
      110;


    score+=
      hits*
      combo*
      5;

  }

}


/* =====================================================
COMBOS
===================================================== */

let sequence=[];

let sequenceTimer=0;


function registerAttack(
letter
){

  sequence.push(
    letter
  );


  if(
    sequence.length>3
  ){

    sequence.shift();

  }


  sequenceTimer=
    55;


  const code=
    sequence.join("");


  if(
    code==="AAH"
  ){

    player.electric=
      30;


    hitEnemies(
      125,
      38,
      22,
      true
    );


    showMessage(
      "VOLT RUSH"
    );


    sequence=[];

  }


  else if(
    code==="AHA"
  ){

    player.electric=
      35;


    hitEnemies(
      140,
      44,
      23,
      true
    );


    showMessage(
      "ELECTRIC CROSS"
    );


    sequence=[];

  }


  else if(
    code==="HAH"
  ){

    player.electric=
      42;


    hitEnemies(
      165,
      56,
      30,
      true
    );


    showMessage(
      "TWIN THUNDER"
    );


    sequence=[];

  }

}


/* =====================================================
PLAYER UPDATE
===================================================== */

function updatePlayer(){

  let inputX=
    input.x;


  let inputY=
    input.y;


  const magnitude=
    Math.hypot(
      inputX,
      inputY
    );


  if(
    magnitude>1
  ){

    inputX/=
      magnitude;


    inputY/=
      magnitude;

  }


  player.targetVx=
    inputX*
    player.maxSpeed;


  player.targetVy=
    inputY*
    player.maxSpeed*
    .67;


  if(
    player.actionLocked
  ){

    player.targetVx*=.15;

    player.targetVy*=.15;

  }


  player.vx=
    lerp(
      player.vx,
      player.targetVx,
      player.acceleration
    );


  player.vy=
    lerp(
      player.vy,
      player.targetVy,
      player.acceleration
    );


  if(
    Math.abs(inputX)<.05
  ){

    player.vx*=
      player.friction;

  }


  if(
    Math.abs(inputY)<.05
  ){

    player.vy*=
      player.friction;

  }


  player.x+=
    player.vx;


  player.y+=
    player.vy;


  constrainToRoad(
    player
  );


  if(
    Math.abs(
      player.vx
    )>.15
  ){

    player.facing=
      Math.sign(
        player.vx
      );

  }


  if(
    player.actionTimer>0
  ){

    player.actionTimer--;

  }


  if(

    player.actionTimer<=0

    &&

    player.actionLocked

  ){

    player.actionLocked=
      false;

  }


  if(
    !player.actionLocked
  ){

    const moving=

      Math.abs(
        player.vx
      )>.3

      ||

      Math.abs(
        player.vy
      )>.25;


    changeState(

      player,

      moving
      ?
      "walk"
      :
      "idle"

    );

  }


  /* LIGHT */

  if(

    input.light

    &&

    !lightPressed

    &&

    player.lightCooldown<=0

  ){

    lightPressed=
      true;


    player.actionLocked=
      true;


    player.actionTimer=
      22;


    changeState(
      player,
      "light"
    );


    player.lightCooldown=
      Math.floor(

        21*
        cooldownMultiplier()

      );


    setTimeout(

      ()=>{

        hitEnemies(
          86,
          15,
          9,
          false
        );

      },

      65

    );


    registerAttack(
      "A"
    );

  }


  if(
    !input.light
  ){

    lightPressed=
      false;

  }


  /* HEAVY */

  if(

    input.heavy

    &&

    !heavyPressed

    &&

    player.heavyCooldown<=0

  ){

    heavyPressed=
      true;


    player.actionLocked=
      true;


    player.actionTimer=
      30;


    player.electric=
      18;


    changeState(
      player,
      "heavy"
    );


    player.heavyCooldown=
      Math.floor(

        42*
        cooldownMultiplier()

      );


    setTimeout(

      ()=>{

        hitEnemies(
          105,
          29,
          18,
          true
        );

      },

      90

    );


    registerAttack(
      "H"
    );

  }


  if(
    !input.heavy
  ){

    heavyPressed=
      false;

  }


  /* SPECIAL */

  if(

    input.special

    &&

    !specialPressed

    &&

    player.specialCooldown<=0

    &&

    player.energy>=35

  ){

    specialPressed=
      true;


    player.energy-=35;


    player.actionLocked=
      true;


    player.actionTimer=
      32;


    player.electric=
      50;


    changeState(
      player,
      "special"
    );


    player.specialCooldown=
      Math.max(

        48,

        88-
        upgrades.ability*4

      );


    effects.push({

      type:
        "burst",

      x:
        player.x,

      y:
        player.y-35,

      life:
        35

    });


    setTimeout(

      ()=>{

        hitEnemies(

          170+
          upgrades.ability*7,

          35,

          24,

          true

        );

      },

      90

    );


    showMessage(
      "THUNDER BURST"
    );

  }


  if(
    !input.special
  ){

    specialPressed=
      false;

  }


  /* DASH */

  if(

    input.dash

    &&

    !dashPressed

    &&

    player.dashCooldown<=0

  ){

    dashPressed=
      true;


    player.dashCooldown=
      Math.max(

        26,

        49-
        upgrades.ability*2

      );


    player.invincible=
      22;


    player.electric=
      32;


    let dx=
      inputX;


    let dy=
      inputY;


    if(
      Math.hypot(
        dx,
        dy
      )<.2
    ){

      dx=
        player.facing;

      dy=0;

    }


    player.vx+=

      dx*

      (
        12+
        upgrades.ability*.6
      );


    player.vy+=
      dy*8;


    effects.push({

      type:
        "dash",

      x:
        player.x,

      y:
        player.y,

      life:
        18

    });


    hitEnemies(
      90,
      20,
      16,
      true
    );

  }


  if(
    !input.dash
  ){

    dashPressed=
      false;

  }


  [
    "lightCooldown",
    "heavyCooldown",
    "specialCooldown",
    "dashCooldown",
    "invincible",
    "electric"
  ]
  .forEach(

    key=>{

      if(
        player[key]>0
      ){

        player[key]--;

      }

    }

  );


  player.energy=
    Math.min(

      player.maxEnergy,

      player.energy+
      .15+
      upgrades.ability*.012

    );


  updateAnimation(
    player,
    chosenAnimations
  );

}


/* =====================================================
ENEMY AI
===================================================== */

function updateEnemies(){

  enemies.forEach(

    enemy=>{

      if(
        enemy.dead
      ){

        return;

      }


      if(
        enemy.hitTimer>0
      ){

        enemy.hitTimer--;

      }


      if(
        enemy.attackCooldown>0
      ){

        enemy.attackCooldown--;

      }


      if(
        enemy.specialCooldown>0
      ){

        enemy.specialCooldown--;

      }


      if(
        enemy.hitRecovery>0
      ){

        enemy.hitRecovery--;

      }


      /*
      ENTRY FROM SCREEN SIDES
      */

      if(
        enemy.entering
      ){

        const targetX=

          enemy.x<0

          ?

          65

          :

          W-65;


        const dx=
          targetX-
          enemy.x;


        enemy.facing=
          Math.sign(dx);


        enemy.vx=
          lerp(
            enemy.vx,
            Math.sign(dx)*
            enemy.speed*
            1.45,
            .14
          );


        enemy.x+=
          enemy.vx;


        constrainEnteringEntity(
          enemy
        );


        changeState(
          enemy,
          "walk"
        );


        updateAnimation(
          enemy,
          voodooAnimations
        );


        return;

      }


      /*
      STAGGER / KNOCKBACK
      */

      if(
        enemy.stun>0
      ){

        enemy.stun--;


        enemy.vx*=.88;

        enemy.vy*=.88;


        enemy.x+=
          enemy.vx;


        enemy.y+=
          enemy.vy;


        constrainToRoad(
          enemy
        );


        updateAnimation(
          enemy,
          voodooAnimations
        );


        return;

      }


      const dx=
        player.x-
        enemy.x;


      const dy=
        player.y-
        enemy.y;


      const d=
        Math.hypot(
          dx,
          dy
        );


      enemy.facing=
        Math.sign(dx)
        ||
        enemy.facing;


      let desiredX=
        0;


      let desiredY=
        0;


      /*
      If a boss was just hit,
      don't immediately rush
      Chosen again.
      */

      if(
        enemy.boss &&
        enemy.hitRecovery>0
      ){

        desiredX=
          -Math.sign(dx)*
          enemy.speed*.45;


        desiredY=
          0;

      }


      else{

        if(
          Math.abs(dy)>16
        ){

          desiredY=
            Math.sign(dy)*
            enemy.speed*.55;

        }


        if(
          Math.abs(dx)>62
        ){

          desiredX=
            Math.sign(dx)*
            enemy.speed;

        }

      }


      /*
      Mardi Gras erratic movement
      but less relentless than before.
      */

      if(

        enemy.boss

        &&

        enemy.name===
        "MARDI GRAS"

        &&

        enemy.hitRecovery<=0

        &&

        Math.random()<.022

      ){

        desiredX+=
          random(-3.5,3.5);


        desiredY+=
          random(-2,2);

      }


      /*
      BOSS SPECIAL
      */

      if(

        enemy.boss

        &&

        enemy.specialCooldown<=0

        &&

        enemy.hitRecovery<=0

        &&

        d>90

      ){

        if(
          enemy.name===
          "MARDI GRAS"
        ){

          enemy.vx=
            dx/(d||1)*8;


          enemy.vy=
            dy/(d||1)*4;


          showMessage(
            "PARADE CRASH!"
          );

        }


        else if(
          enemy.name===
          "ROUXGAROUX"
        ){

          enemy.vx=
            dx/(d||1)*9;


          enemy.vy=
            dy/(d||1)*5;


          showMessage(
            "SWAMP LEAP!"
          );

        }


        else{

          enemy.x=
            clamp(

              player.x+
              random(-90,90),

              roadLeftAt(),

              roadRightAt()

            );


          enemy.y=
            clamp(

              player.y+
              random(-35,35),

              roadTop(),

              roadBottom()

            );


          showMessage(
            "NIGHT TERROR!"
          );

        }


        enemy.specialCooldown=
          enemy.specialCooldownBase;

      }


      enemy.vx=
        lerp(
          enemy.vx,
          desiredX,
          .10
        );


      enemy.vy=
        lerp(
          enemy.vy,
          desiredY,
          .10
        );


      /*
      BASIC ATTACK
      */

      if(

        Math.abs(dx)<60

        &&

        Math.abs(dy)<27

        &&

        enemy.attackCooldown<=0

        &&

        enemy.hitRecovery<=0

      ){

        enemy.attackCooldown=

          enemy.boss

          ?

          enemy.attackCooldownBase

          :

          random(
            55,
            80
          );


        changeState(
          enemy,
          "attack"
        );


        enemy.frame=0;


        if(
          player.invincible<=0
        ){

          player.hp-=
            enemy.damage;


          player.invincible=
            22;


          /*
          Boss attacks now push Chosen
          away a little too.
          */

          player.vx+=
            Math.sign(dx)*
            -3.5;


          effects.push({

            type:
              "hit",

            x:
              player.x,

            y:
              player.y-45,

            life:
              14

          });

        }

      }


      else{

        const moving=

          Math.abs(
            enemy.vx
          )>.25

          ||

          Math.abs(
            enemy.vy
          )>.20;


        if(

          enemy.state!==
          "attack"

          ||

          enemy.frame>=7

        ){

          changeState(

            enemy,

            moving
            ?
            "walk"
            :
            "idle"

          );

        }

      }


      enemy.x+=
        enemy.vx;


      enemy.y+=
        enemy.vy;


      constrainToRoad(
        enemy
      );


      updateAnimation(
        enemy,
        voodooAnimations
      );

    }

  );


  enemies=
    enemies.filter(
      enemy=>
      !enemy.dead
    );


  /*
  Important:
  During staggered spawning,
  don't complete the wave before
  every enemy has actually spawned.
  */

  if(

    enemies.length===0

    &&

    !wavePending

  ){

    wavePending=
      true;


    if(
      shouldOpenShop(
        wave
      )
    ){

      setTimeout(
        openShop,
        650
      );

    }


    else{

      setTimeout(

        ()=>{

          wave++;


          wavePending=
            false;


          spawnWave();

        },

        750

      );

    }

  }


  if(
    player.hp<=0
  ){

    resetGame();

  }

}


/* =====================================================
PICKUPS
===================================================== */

function updatePickups(){

  pickups.forEach(

    pickup=>{

      pickup.life--;


      pickup.bob+=
        .055;


      if(
        distance(
          player,
          pickup
        )<42
      ){

        const data=
          pickupTypes[
            pickup.type
          ];


        if(
          data.heal
        ){

          const before=
            player.hp;


          player.hp=
            Math.min(

              player.maxHp,

              player.hp+
              data.heal

            );


          const healed=
            Math.round(
              player.hp-before
            );


          showPickup(

            data.name+
            " +"+
            healed+
            " HP"

          );

        }


        if(
          data.points
        ){

          score+=
            data.points;


          voltage+=
            data.voltage;


          showPickup(

            data.name+
            " +"+
            data.points+
            " PTS"

          );

        }


        pickup.life=
          0;

      }

    }

  );


  pickups=
    pickups.filter(
      pickup=>
      pickup.life>0
    );

}


/* =====================================================
EFFECT UPDATE
===================================================== */

function updateEffects(){

  effects.forEach(
    effect=>
    effect.life--
  );


  effects=
    effects.filter(
      effect=>
      effect.life>0
    );

}


/* =====================================================
SHOP
===================================================== */

function shouldOpenShop(
completedWave
){

  if(
    completedWave<=20
  ){

    return(
      completedWave%5===0
    );

  }


  return(
    completedWave%10===0
  );

}


function upgradeCost(
type
){

  const base=

    type===
    "ability"

    ?

    300

    :

    220;


  return Math.floor(

    base*

    Math.pow(

      1.42,

      upgrades[type]-1

    )

  );

}


function openShop(){

  paused=
    true;


  updateShop();


  document.getElementById(
    "shop"
  ).style.display=
    "flex";

}


function updateShop(){

  document.getElementById(
    "shopVoltage"
  ).textContent=
    voltage;


  document.getElementById(
    "powerLevel"
  ).textContent=
    upgrades.power;


  document.getElementById(
    "speedLevel"
  ).textContent=
    upgrades.speed;


  document.getElementById(
    "abilityLevel"
  ).textContent=
    upgrades.ability;


  [

    [
      "power",
      "powerButton"
    ],

    [
      "speed",
      "speedButton"
    ],

    [
      "ability",
      "abilityButton"
    ]

  ]
  .forEach(

    ([type,id])=>{

      const button=
        document.getElementById(
          id
        );


      const price=
        upgradeCost(
          type
        );


      button.textContent=

        "⚡ "+
        price+
        " VOLTAGE";


      button.disabled=

        voltage<price

        ||

        upgrades[type]>=20;

    }

  );

}


function buyUpgrade(
type
){

  const price=
    upgradeCost(
      type
    );


  if(
    voltage<price
  ){

    return;

  }


  voltage-=
    price;


  upgrades[type]++;


  if(
    type===
    "power"
  ){

    player.maxHp+=
      3;

  }


  if(
    type===
    "ability"
  ){

    player.maxEnergy+=
      4;


    player.energy=
      player.maxEnergy;

  }


  updateShop();

}


document.getElementById(
  "powerButton"
).onclick=

()=>buyUpgrade(
  "power"
);


document.getElementById(
  "speedButton"
).onclick=

()=>buyUpgrade(
  "speed"
);


document.getElementById(
  "abilityButton"
).onclick=

()=>buyUpgrade(
  "ability"
);


document.getElementById(
  "continueButton"
).onclick=

()=>{

  document.getElementById(
    "shop"
  ).style.display=
    "none";


  paused=
    false;


  wave++;


  wavePending=
    false;


  player.hp=
    Math.min(

      player.maxHp,

      player.hp+
      player.maxHp*.25

    );


  player.energy=
    player.maxEnergy;


  spawnWave();

};


/* =====================================================
RESET
===================================================== */

function resetGame(){

  player.hp=
    player.maxHp;


  player.energy=
    player.maxEnergy;


  player.x=
    W*.5;


  player.y=
    H*.72;


  player.vx=0;

  player.vy=0;


  score=0;

  combo=0;

  wave=1;


  pickups=[];

  effects=[];

  enemies=[];


  wavePending=
    false;


  constrainToRoad(
    player
  );


  spawnWave();


  showMessage(
    "CHOSEN RISES"
  );

}


/* =====================================================
HORIZONTAL BOURBON STREET
===================================================== */

function drawStage(){

  ctx.fillStyle=
    "#050912";


  ctx.fillRect(
    0,
    0,
    W,
    H
  );


  /*
  UPPER BUILDING SCENERY
  */

  if(

    images.stage.complete

    &&

    images.stage.naturalWidth

  ){

    const iw=
      images.stage.naturalWidth;


    const ih=
      images.stage.naturalHeight;


    const sourceHeight=
      ih*.69;


    ctx.drawImage(

      images.stage,

      0,
      0,

      iw,
      sourceHeight,

      0,
      0,

      W,
      H*.60

    );

  }


  /*
  SIDEWALK BAND
  */

  const sidewalkTop=
    H*.50;


  const sidewalkBottom=
    roadTop();


  const sidewalkGradient=
    ctx.createLinearGradient(

      0,
      sidewalkTop,

      0,
      sidewalkBottom

    );


  sidewalkGradient.addColorStop(
    0,
    "rgba(25,22,25,.55)"
  );


  sidewalkGradient.addColorStop(
    1,
    "#29252a"
  );


  ctx.fillStyle=
    sidewalkGradient;


  ctx.fillRect(

    0,

    sidewalkTop,

    W,

    sidewalkBottom-
    sidewalkTop

  );


  /*
  Sidewalk tile seams.
  */

  ctx.strokeStyle=
    "rgba(255,255,255,.05)";


  ctx.lineWidth=1;


  for(
    let x=0;
    x<W;
    x+=46
  ){

    ctx.beginPath();


    ctx.moveTo(
      x,
      sidewalkTop
    );


    ctx.lineTo(
      x+5,
      sidewalkBottom
    );


    ctx.stroke();

  }


  /*
  HORIZONTAL CURB
  */

  ctx.strokeStyle=
    "#51494c";


  ctx.lineWidth=5;


  ctx.beginPath();


  ctx.moveTo(
    0,
    roadTop()
  );


  ctx.lineTo(
    W,
    roadTop()
  );


  ctx.stroke();


  ctx.strokeStyle=
    "rgba(255,210,155,.14)";


  ctx.lineWidth=1;


  ctx.beginPath();


  ctx.moveTo(
    0,
    roadTop()+3
  );


  ctx.lineTo(
    W,
    roadTop()+3
  );


  ctx.stroke();


  /*
  HORIZONTAL ROAD
  */

  const road=
    ctx.createLinearGradient(

      0,
      roadTop(),

      0,
      H

    );


  road.addColorStop(
    0,
    "#231f22"
  );


  road.addColorStop(
    .55,
    "#19171a"
  );


  road.addColorStop(
    1,
    "#101015"
  );


  ctx.fillStyle=
    road;


  ctx.fillRect(

    0,

    roadTop(),

    W,

    H-
    roadTop()

  );


  /*
  COBBLE / BRICK ROAD
  */

  let row=
    0;


  for(
    let y=
      roadTop()+8;
    y<H;
    y+=22
  ){

    const depth=

      (
        y-
        roadTop()
      )

      /

      (
        H-
        roadTop()
      );


    const alpha=
      .04+
      depth*.04;


    ctx.strokeStyle=
      `rgba(190,170,160,${alpha})`;


    ctx.lineWidth=1;


    ctx.beginPath();


    ctx.moveTo(
      0,
      y
    );


    ctx.lineTo(
      W,
      y
    );


    ctx.stroke();


    const spacing=
      48+
      depth*20;


    const offset=
      row%2
      ?
      spacing/2
      :
      0;


    for(
      let x=
        -spacing+offset;
      x<W+spacing;
      x+=spacing
    ){

      ctx.strokeStyle=
        `rgba(180,165,155,${alpha*.65})`;


      ctx.beginPath();


      ctx.moveTo(
        x,
        y
      );


      ctx.lineTo(
        x+2,
        y+20
      );


      ctx.stroke();

    }


    row++;

  }


  /*
  WET SHEEN
  */

  const sheen=
    ctx.createLinearGradient(

      0,
      roadTop(),

      W,
      roadBottom()

    );


  sheen.addColorStop(
    0,
    "rgba(70,100,125,.025)"
  );


  sheen.addColorStop(
    .5,
    "rgba(255,255,255,.012)"
  );


  sheen.addColorStop(
    1,
    "rgba(75,95,120,.045)"
  );


  ctx.fillStyle=
    sheen;


  ctx.fillRect(

    0,

    roadTop(),

    W,

    H-roadTop()

  );


  /*
  SHORT NEON REFLECTION PATCHES
  */

  drawStreetReflection(
    W*.12,
    roadTop()+24,
    "#ff3ab7",
    38,
    68
  );


  drawStreetReflection(
    W*.35,
    roadTop()+32,
    "#f0ad4d",
    24,
    54
  );


  drawStreetReflection(
    W*.69,
    roadTop()+25,
    "#398cff",
    34,
    72
  );


  drawStreetReflection(
    W*.86,
    roadTop()+40,
    "#b64bff",
    27,
    58
  );


  /*
  PUDDLES
  */

  drawPuddle(
    W*.20,
    H*.73,
    48,
    11
  );


  drawPuddle(
    W*.47,
    H*.68,
    36,
    8
  );


  drawPuddle(
    W*.72,
    H*.78,
    50,
    11
  );


  /*
  MANHOLE
  */

  ctx.strokeStyle=
    "rgba(5,6,9,.8)";


  ctx.lineWidth=5;


  ctx.beginPath();


  ctx.ellipse(
    W*.59,
    H*.79,
    36,
    13,
    0,
    0,
    Math.PI*2
  );


  ctx.stroke();


  ctx.strokeStyle=
    "rgba(115,105,98,.22)";


  ctx.lineWidth=1;


  ctx.beginPath();


  ctx.ellipse(
    W*.59,
    H*.79,
    31,
    10,
    0,
    0,
    Math.PI*2
  );


  ctx.stroke();


  /*
  RAIN
  */

  const now=
    performance.now();


  ctx.strokeStyle=
    "rgba(175,215,240,.11)";


  ctx.lineWidth=1;


  for(
    let i=0;
    i<42;
    i++
  ){

    const x=
      (
        i*93+
        now*.11
      )%W;


    const y=
      (
        i*61+
        now*.30
      )%H;


    ctx.beginPath();


    ctx.moveTo(
      x,
      y
    );


    ctx.lineTo(
      x-3,
      y+12
    );


    ctx.stroke();

  }

}


/* =====================================================
REFLECTION
===================================================== */

function drawStreetReflection(
x,
y,
color,
width,
height
){

  ctx.save();


  const gradient=
    ctx.createLinearGradient(
      0,
      y,
      0,
      y+height
    );


  gradient.addColorStop(
    0,
    color
  );


  gradient.addColorStop(
    .22,
    color
  );


  gradient.addColorStop(
    .60,
    "rgba(0,0,0,0)"
  );


  gradient.addColorStop(
    1,
    "rgba(0,0,0,0)"
  );


  ctx.globalAlpha=
    .075;


  ctx.fillStyle=
    gradient;


  ctx.beginPath();


  ctx.moveTo(
    x-width*.18,
    y
  );


  ctx.lineTo(
    x+width*.18,
    y
  );


  ctx.lineTo(
    x+width*.38,
    y+height
  );


  ctx.lineTo(
    x-width*.34,
    y+height
  );


  ctx.closePath();


  ctx.fill();


  ctx.restore();

}


/* =====================================================
PUDDLES
===================================================== */

function drawPuddle(
x,
y,
width,
height
){

  ctx.save();


  ctx.fillStyle=
    "rgba(85,105,120,.065)";


  ctx.beginPath();


  ctx.ellipse(
    x,
    y,
    width,
    height,
    -.08,
    0,
    Math.PI*2
  );


  ctx.fill();


  ctx.strokeStyle=
    "rgba(180,205,220,.09)";


  ctx.lineWidth=1;


  ctx.beginPath();


  ctx.ellipse(
    x,
    y,
    width*.88,
    height*.68,
    -.08,
    0,
    Math.PI*2
  );


  ctx.stroke();


  ctx.restore();

}


/* =====================================================
SHADOW
===================================================== */

function drawShadow(
entity,
multiplier=1
){

  const scale=
    depthScale(
      entity.y
    );


  ctx.fillStyle=
    "rgba(0,0,0,.42)";


  ctx.beginPath();


  ctx.ellipse(

    entity.x,

    entity.y+2,

    27*
    scale*
    multiplier,

    8*
    scale,

    0,

    0,

    Math.PI*2

  );


  ctx.fill();

}


/* =====================================================
DRAW PLAYER
===================================================== */

function drawPlayer(){

  drawShadow(
    player,
    1.08
  );


  if(

    player.invincible>0

    &&

    Math.floor(
      player.invincible/3
    )%2

  ){

    ctx.globalAlpha=
      .55;

  }


  drawSprite(

    images.chosen,

    player,

    chosenAnimations,

    1.18

  );


  ctx.globalAlpha=
    1;


  if(
    player.electric>0
  ){

    const scale=
      depthScale(
        player.y
      );


    ctx.save();


    ctx.strokeStyle=
      "#69e7ff";


    ctx.shadowColor=
      "#32c7ff";


    ctx.shadowBlur=
      15;


    ctx.lineWidth=
      2;


    for(
      let i=0;
      i<4;
      i++
    ){

      const radius=
        random(
          28,
          42
        )*
        scale;


      ctx.beginPath();


      ctx.arc(

        player.x+
        random(-10,10),

        player.y-
        48*
        scale+
        random(-8,8),

        radius,

        random(0,2),

        random(3.5,6)

      );


      ctx.stroke();

    }


    ctx.restore();

  }

}


/* =====================================================
DRAW ENEMY
===================================================== */

function drawEnemy(
enemy
){

  const size=

    enemy.boss
    ?
    1.30
    :
    enemy.elite
    ?
    1.08
    :
    1;


  drawShadow(
    enemy,
    size
  );


  if(
    enemy.hitTimer>0
  ){

    ctx.globalAlpha=
      .62;

  }


  drawSprite(

    images.voodoo,

    enemy,

    voodooAnimations,

    size

  );


  ctx.globalAlpha=
    1;


  if(
    !enemy.boss &&
    !enemy.entering
  ){

    const scale=
      depthScale(
        enemy.y
      );


    const width=
      48*
      scale;


    const barY=
      enemy.y-
      112*
      scale;


    ctx.fillStyle=
      "#17171b";


    ctx.fillRect(

      enemy.x-
      width/2,

      barY,

      width,

      5

    );


    ctx.fillStyle=

      enemy.elite

      ?

      "#a546db"

      :

      "#da3041";


    ctx.fillRect(

      enemy.x-
      width/2,

      barY,

      width*
      (
        enemy.hp/
        enemy.maxHp
      ),

      5

    );

  }

}


/* =====================================================
DRAW PICKUPS
===================================================== */

function drawPickups(){

  ctx.textAlign=
    "center";


  pickups.forEach(

    pickup=>{

      const data=
        pickupTypes[
          pickup.type
        ];


      const scale=
        depthScale(
          pickup.y
        );


      const bob=
        Math.sin(
          pickup.bob
        )*5;


      const y=
        pickup.y-
        18-
        bob;


      ctx.save();


      ctx.shadowColor=
        data.color;


      ctx.shadowBlur=
        16;


      ctx.font=
        `bold ${26*scale}px Arial`;


      ctx.fillStyle=
        "white";


      ctx.fillText(
        data.emoji,
        pickup.x,
        y
      );


      ctx.shadowBlur=
        0;


      ctx.font=
        `bold ${8*scale}px Arial`;


      ctx.fillText(

        data.name,

        pickup.x,

        y+
        17*
        scale

      );


      ctx.restore();

    }

  );

}


/* =====================================================
DRAW EFFECTS
===================================================== */

function drawEffects(){

  effects.forEach(

    effect=>{

      ctx.save();


      ctx.globalAlpha=
        Math.max(
          0,
          effect.life/35
        );


      if(
        effect.type===
        "burst"
      ){

        ctx.strokeStyle=
          "#69e7ff";


        ctx.shadowColor=
          "#39c9ff";


        ctx.shadowBlur=
          18;


        ctx.lineWidth=
          4;


        ctx.beginPath();


        ctx.arc(

          effect.x,

          effect.y,

          82-
          effect.life,

          0,

          Math.PI*2

        );


        ctx.stroke();

      }


      else if(
        effect.type===
        "dash"
      ){

        ctx.strokeStyle=
          "#58ddff";


        ctx.shadowColor=
          "#31c7ff";


        ctx.shadowBlur=
          12;


        ctx.lineWidth=
          5;


        ctx.beginPath();


        ctx.moveTo(
          effect.x-
          player.facing*65,
          effect.y-35
        );


        ctx.lineTo(
          effect.x,
          effect.y-35
        );


        ctx.stroke();

      }


      else{

        ctx.fillStyle=

          effect.type===
          "electricHit"

          ?

          "#73ecff"

          :

          "#ff5a4f";


        ctx.fillRect(
          effect.x-5,
          effect.y-5,
          10,
          10
        );

      }


      ctx.restore();

    }

  );

}


/* =====================================================
HUD UPDATE
===================================================== */

function updateHud(){

  document.getElementById(
    "hpText"
  ).textContent=

    Math.max(
      0,
      Math.ceil(
        player.hp
      )
    )

    +

    " / "

    +

    player.maxHp;


  document.getElementById(
    "energyText"
  ).textContent=

    Math.floor(
      player.energy
    )

    +

    " / "

    +

    player.maxEnergy;


  document.getElementById(
    "hpFill"
  ).style.width=

    Math.max(

      0,

      player.hp/
      player.maxHp*
      100

    )

    +

    "%";


  document.getElementById(
    "energyFill"
  ).style.width=

    player.energy/
    player.maxEnergy*
    100

    +

    "%";


  document.getElementById(
    "xpFill"
  ).style.width=

    xp/
    xpNeeded*
    100

    +

    "%";


  document.getElementById(
    "levelText"
  ).textContent=
    level;


  document.getElementById(
    "waveText"
  ).textContent=
    wave;


  document.getElementById(
    "voltageText"
  ).textContent=
    voltage;


  document.getElementById(
    "scoreText"
  ).textContent=
    score;


  document.getElementById(
    "comboText"
  ).textContent=
    combo;


  const bossHud=
    document.getElementById(
      "bossHud"
    );


  if(

    currentBoss

    &&

    !currentBoss.dead

  ){

    bossHud.style.display=
      "block";


    document.getElementById(
      "bossName"
    ).textContent=

      currentBoss.name

      +

      " — TIER "

      +

      currentBoss.tier;


    document.getElementById(
      "bossBar"
    ).style.width=

      Math.max(

        0,

        currentBoss.hp/
        currentBoss.maxHp*
        100

      )

      +

      "%";

  }


  else{

    bossHud.style.display=
      "none";

  }

}


/* =====================================================
UPDATE
===================================================== */

function update(){

  if(
    paused
  ){

    return;

  }


  updatePlayer();


  updateEnemies();


  updatePickups();


  updateEffects();


  if(
    comboTimer>0
  ){

    comboTimer--;

  }

  else{

    combo=0;

  }


  if(
    sequenceTimer>0
  ){

    sequenceTimer--;

  }

  else{

    sequence=[];

  }


  if(
    messageTimer>0
  ){

    messageTimer--;

  }

  else{

    document.getElementById(
      "message"
    ).style.opacity=
      0;

  }


  if(
    pickupTimer>0
  ){

    pickupTimer--;

  }

  else{

    document.getElementById(
      "pickupMessage"
    ).style.opacity=
      0;

  }

}


/* =====================================================
DRAW
===================================================== */

function draw(){

  drawStage();


  const actors=[


    ...enemies.map(

      enemy=>({

        y:
          enemy.y,

        draw:
          ()=>drawEnemy(
            enemy
          )

      })

    ),


    {

      y:
        player.y,

      draw:
        drawPlayer

    }


  ];


  actors.sort(

    (a,b)=>

    a.y-b.y

  );


  actors.forEach(

    actor=>
    actor.draw()

  );


  drawPickups();


  drawEffects();


  updateHud();

}


/* =====================================================
LOOP
===================================================== */

function gameLoop(){

  update();


  draw();


  requestAnimationFrame(
    gameLoop
  );

}


/* =====================================================
START
===================================================== */

player.x=
  W*.5;


player.y=
  H*.72;


constrainToRoad(
  player
);


spawnWave();


gameLoop();


})();

</script>
