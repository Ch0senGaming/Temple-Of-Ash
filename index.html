<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="
    width=device-width,
    initial-scale=1,
    maximum-scale=1,
    minimum-scale=1,
    user-scalable=no,
    viewport-fit=cover
  "
>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Temple of Ash</title>

<style>

*{
  box-sizing:border-box;
  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
}

html,
body{

  margin:0;

  width:100%;
  height:100%;

  overflow:hidden;

  position:fixed;

  inset:0;

  background:#02040a;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  touch-action:none;

  overscroll-behavior:none;

}

canvas{

  position:fixed;

  inset:0;

  width:100vw;
  height:100dvh;

  display:block;

  image-rendering:pixelated;

  touch-action:none;

}


/* ==================================================
HUD
================================================== */

#hud{

  position:fixed;

  inset:0;

  pointer-events:none;

  z-index:10;

}

#topHud{

  position:absolute;

  top:max(
    8px,
    env(safe-area-inset-top)
  );

  left:8px;
  right:8px;

  display:flex;

  justify-content:
    space-between;

  align-items:
    flex-start;

  gap:7px;

}

.panel{

  background:
    rgba(
      2,
      5,
      11,
      .84
    );

  border:
    1px solid
    rgba(
      255,
      255,
      255,
      .18
    );

  border-radius:
    11px;

  padding:
    8px 10px;

  box-shadow:
    0 5px 18px
    rgba(
      0,
      0,
      0,
      .55
    );

  backdrop-filter:
    blur(5px);

  color:white;

}

#playerPanel{

  width:min(
    44vw,
    310px
  );

}

#centerPanel{

  text-align:center;

  min-width:
    108px;

}

#scorePanel{

  text-align:right;

  min-width:
    106px;

}

.playerName{

  font-size:
    17px;

  font-weight:
    1000;

  font-style:
    italic;

  letter-spacing:
    1px;

}

.statRow{

  display:flex;

  justify-content:
    space-between;

  font-size:
    10px;

  margin-top:
    4px;

  opacity:.84;

}

.bar{

  height:8px;

  border-radius:
    12px;

  overflow:hidden;

  background:
    #252b35;

  margin-top:
    2px;

}

.fill{

  height:100%;

}

#hpFill{

  background:
    linear-gradient(
      90deg,
      #aa1421,
      #ff5343
    );

}

#energyFill{

  background:
    linear-gradient(
      90deg,
      #1068d8,
      #6cecff
    );

}

#xpFill{

  background:
    linear-gradient(
      90deg,
      #6931d8,
      #bf76ff
    );

}


/* ==================================================
MESSAGES
================================================== */

#message{

  position:absolute;

  top:18%;

  left:50%;

  transform:
    translateX(-50%);

  width:90%;

  text-align:center;

  color:white;

  font-size:
    clamp(
      22px,
      5vw,
      45px
    );

  font-weight:
    1000;

  font-style:
    italic;

  text-shadow:
    0 4px 5px #000,
    0 0 18px #34c8ff;

  opacity:0;

}

#pickupMessage{

  position:absolute;

  top:32%;

  left:50%;

  transform:
    translateX(-50%);

  color:white;

  font-weight:
    1000;

  font-size:
    15px;

  text-shadow:
    0 2px 5px #000;

  opacity:0;

}


/* ==================================================
BOSS HUD
================================================== */

#bossHud{

  position:absolute;

  top:max(
    108px,
    calc(
      env(safe-area-inset-top)
      + 102px
    )
  );

  left:50%;

  transform:
    translateX(-50%);

  width:min(
    70vw,
    620px
  );

  display:none;

  text-align:center;

  color:white;

}

#bossName{

  font-weight:
    1000;

  letter-spacing:
    2px;

}

#bossBarOuter{

  margin-top:4px;

  height:14px;

  border-radius:
    14px;

  overflow:hidden;

  background:
    #170b11;

  border:
    2px solid
    rgba(
      255,
      255,
      255,
      .24
    );

}

#bossBar{

  height:100%;

  width:100%;

  background:
    linear-gradient(
      90deg,
      #941536,
      #ff4549
    );

}


/* ==================================================
CONTROLS
================================================== */

#controls{

  position:fixed;

  inset:0;

  pointer-events:none;

  z-index:20;

}

#joystick{

  position:absolute;

  left:max(
    18px,
    env(safe-area-inset-left)
  );

  bottom:max(
    23px,
    env(safe-area-inset-bottom)
  );

  width:140px;
  height:140px;

  border-radius:
    50%;

  background:
    rgba(
      3,
      7,
      14,
      .58
    );

  border:
    2px solid
    rgba(
      255,
      255,
      255,
      .25
    );

  box-shadow:
    inset

    rgba(
      0,
      0,
      0,
      .65

  pointer-events:auto;

  touch-action:none;

}

#stick{

  position:absolute;

  left:50%;
  top:50%;

  width:61px;
  height:61px;

  transform:
    translate(

      -50%
    );

  border-radius:
    50%;

  background:
    rgba(
      221,
      229,
      239,
      .78

  border:
    2px solid
    rgba(
      255,
      255,
      255,
      .55
    );

  pointer-events:none;

}

#buttons{

  position:absolute;

  right:max(
    15px,

  );

  bottom:max(
    22px,
    env(safe-area-inset-bottom)
  );

  width:187px;

  pointer-events:auto;

}

.gameButton{

  position:absolute;

  width:70px;
  height:70px;

  border-radius:
    50%;

  border:
    2px solid
    rgba(
      255,
      255,
      255,
      .25
    );

  background:
    rgba(
      5,
      10,
      17,

    );

  font-weight:
    1000;

  font-size:
    21px;

  color:white;

  touch-action:none;

}

.gameButton small{

  display:block;

  font-size:8px;

  opacity:.82;

}

#lightBtn{

  color:
    #62bcff;

}

#heavyBtn{

  left:65px;
  top:0;

  color:
    #ffd65c;

}

#specialBtn{

  left:65px;
  top:115px;

  color:
    #65e7ff;

}

#dashBtn{

  left:125px;
  top:58px;

  color:

}


/* ==================================================
SHOP
================================================== */

#shop{

  position:fixed;

  inset:0;

  z-index:40;

  display:none;

  justify-content:
    center;

  align-items:
    center;

  background:
    rgba(
      0,
      0,

    blur(4px);

#shopCard{

    92vw,

      205,
      255,

  border-radius:
    17px;

  color:white;

    pan-y;

}

.shopTitle{

  text-align:center;

  font-size:
    24px;

  font-weight:
    1000;

  color:

}

.shopCurrency{

  text-align:center;

  color:
    #ffd95c;

  font-weight:
    1000;

  margin:

}

.shopGrid{

  display:grid;

  grid-template-columns:
    repeat(

  gap:10px;

}

.upgrade{

  text-align:center;

  border:

    rgba(
      255,

      255,

  border-radius:
    11px;

  background:

  padding:11px;

}

.upgrade p{

  min-height:

  font-size:
    10px;

  opacity:.72;

}

.upgrade button,
#continueButton{

  width:100%;

  padding:
    10px;

  border:0;

  border-radius:
    9px;

  color:white;

  background:
    #173651;

  font-weight:
    1000;

}

#continueButton{

  margin-top:14px;

  background:
    #167bd6;

}

@media(
  max-width:620px
){

  .shopGrid{

    grid-template-columns:
      1fr;

  }

  #buttons{

    transform:
      scale(.88);

    transform-origin:
      bottom right;

  }

}

</style>

</head>

<script>

"use strict";


/* ==================================================
MOBILE SCREEN LOCK
================================================== */

document.addEventListener(

  "touchmove",

  event=>{

    if(
      !event.target.closest(
        "#shopCard"
      )
    ){

      event.preventDefault();

    }

  },

  {
    passive:false
  }

);


[
  "gesturestart",
  "gesturechange",
  "gestureend"
]
.forEach(

  eventName=>{

    document.addEventListener(

      eventName,

      event=>{

        event.preventDefault();

      }

    );

  }

);


document.addEventListener(

  "contextmenu",

  event=>{

    event.preventDefault();

  }

);


/* ==================================================
GAME
================================================== */

(()=>{


const canvas=
  document.getElementById(
    "game"
  );


const ctx=
  canvas.getContext(
    "2d"
  );


ctx.imageSmoothingEnabled=
  false;


let W=0;

let H=0;

let DPR=1;


/* ==================================================
RESIZE
================================================== */

function resize(){

  DPR=
    Math.min(
      window.devicePixelRatio || 1,
      2
    );


  W=
    window.innerWidth;


  H=
    window.innerHeight;


  canvas.width=
    Math.floor(
      W*DPR
    );


  canvas.height=
    Math.floor(
      H*DPR
    );


  ctx.setTransform(
    DPR,
    0,
    0,
    DPR,
    0,
    0
  );


  ctx.imageSmoothingEnabled=
    false;

}


resize();


window.addEventListener(
  "resize",
  resize
);


/* ==================================================
HELPERS
================================================== */

const clamp=
(value,min,max)=>

Math.max(
  min,
  Math.min(
    max,
    value
  )
);


const random=
(min,max)=>

min+
Math.random()*
(max-min);


const distance=
(a,b)=>

Math.hypot(
  a.x-b.x,
  a.y-b.y
);


function lerp(
a,
b,
amount
){

  return(
    a+
    (
      b-a
    )*
    amount
  );

}


/* ==================================================
ASSETS
================================================== */

const images={

  stage:
    new Image(),

  chosen:
    new Image(),

  voodoo:
    new Image()

};


images.stage.src=
  "assets/bourbon_stage.jpg";


images.chosen.src=
  "assets/chosen_atlas.png";


images.voodoo.src=
  "assets/voodoo_atlas.png";


/* ==================================================
CORRECT SPRITE GRID

The atlases are:

1280px wide
8 columns

1280 / 8 = 160

Each frame:
160 x 128
================================================== */

const SPRITE_WIDTH=
  160;


const SPRITE_HEIGHT=
  128;


const SPRITE_COLUMNS=
  8;


/* ==================================================
ANIMATION DEFINITIONS
================================================== */

const chosenAnimations={

  idle:{

    row:0,

    frames:8,

    speed:11,

    loop:true

  },


  walk:{

    row:1,

    frames:8,

    speed:6,

    loop:true

  },


  light:{

    row:2,

    frames:8,

    speed:3,

    loop:false

  },


  heavy:{

    row:3,

    frames:8,

    speed:4,

    loop:false

  },


  special:{

    row:3,

    frames:8,

    speed:3,

    loop:false

  }

};


const voodooAnimations={

  idle:{

    row:0,

    frames:8,

    speed:10,

    loop:true

  },


  walk:{

    row:1,

    frames:8,

    speed:7,

    loop:true

  },


  attack:{

    row:2,

    frames:8,

    speed:4,

    loop:false

  }

};


/* ==================================================
GAME STATE
================================================== */

let wave=1;

let score=0;

let voltage=0;

let level=1;

let xp=0;

let xpNeeded=150;

let combo=0;

let comboTimer=0;

let messageTimer=0;

let pickupTimer=0;

let paused=false;

let wavePending=false;

let currentBoss=null;

let enemies=[];

let pickups=[];

let effects=[];


/* ==================================================
PLAYABLE ROAD

This is the key change.

Characters can ONLY stand on
the road portion of the artwork.
================================================== */

function roadTop(){

  return(
    H*.565
  );

}


function roadBottom(){

  return(
    H*.855
  );

}


/*
The road gets wider as you
move toward the camera.
*/

function roadLeftAt(y){

  const t=
    clamp(

      (
        y-
        roadTop()
      )

      /

      (
        roadBottom()-
        roadTop()
      ),

      0,
      1

    );


  return(
    lerp(
      W*.27,
      W*.035,
      t
    )
  );

}


function roadRightAt(y){

  const t=
    clamp(

      (
        y-
        roadTop()
      )

      /

      (
        roadBottom()-
        roadTop()
      ),

      0,
      1

    );


  return(
    lerp(
      W*.73,
      W*.965,
      t
    )
  );

}


function constrainToRoad(
entity
){

  entity.y=
    clamp(
      entity.y,
      roadTop(),
      roadBottom()
    );


  const left=
    roadLeftAt(
      entity.y
    );


  const right=
    roadRightAt(
      entity.y
    );


  entity.x=
    clamp(
      entity.x,
      left,
      right
    );

}


/* ==================================================
DEPTH

Characters grow as they
move toward the camera.
================================================== */

function depthScale(y){

  const t=
    clamp(

      (
        y-
        roadTop()
      )

      /

      (
        roadBottom()-
        roadTop()
      ),

      0,
      1

    );


  return(
    .66+
    t*.40
  );

}


/* ==================================================
PLAYER
================================================== */

const player={

UPGRADES

const upgrades={

INPUT

const input={

/* ==================================================
PICKUPS
================================================== */

const pickupTypes={

  handGrenade:{

      "HAND GRENADE",

    color:
      "#71ff4d"

  },


  kingCake:{

    name:

  },


  crawfish:{

    name:

    heal:45,

  },


  boudin:{

    name:
      "BOUDIN",

  },


  daiquiri:{

  beignets:{

/* ==================================================
MESSAGES
================================================== */

function showMessage(
text
){

  const element=
    document.getElementById(

    );


  element.textContent=

  element.style.opacity=

text

/* ==================================================
JOYSTICK
================================================== */

const joystick=
  document.getElementById(
    "joystick"
  );


const stick=
  document.getElementById(
    "stick"
  );


let joystickPointer=
  null;


function updateJoystick(
clientX,
clientY
){

  const rect=
    joystick.getBoundingClientRect();


  const centerX=
    rect.left+
    rect.width/2;


  const centerY=
    rect.top+
    rect.height/2;


  let dx=
    clientX-
    centerX;


  let dy=
    clientY-
    centerY;


  const maxDistance=
    rect.width*.31;


  const magnitude=
    Math.hypot(
      dx,
      dy
    );


  if(
    magnitude>
    maxDistance
  ){

    dx=
      dx/
      magnitude*
      maxDistance;


    dy=
      dy/
      magnitude*
      maxDistance;

  }


  let normalizedX=
    dx/
    maxDistance;


  let normalizedY=
    dy/
    maxDistance;


  /*
  joystick dead zone
  */

  if(
    Math.abs(
      normalizedX
    )<.09
  ){

    normalizedX=0;

  }


  if(
    Math.abs(
      normalizedY
    )<.09
  ){

    normalizedY=0;

  }


  input.x=
    normalizedX;


  input.y=
    normalizedY;


  stick.style.transform=

    `translate(
      calc(-50% + ${dx}px),
      calc(-50% + ${dy}px)
    )`;

}


joystick.addEventListener(

  "pointerdown",

  event=>{

    event.preventDefault();


    joystickPointer=
      event.pointerId;


    joystick.setPointerCapture(
      event.pointerId
    );


    updateJoystick(
      event.clientX,
      event.clientY
    );

  }

);


joystick.addEventListener(

  "pointermove",

  event=>{

    if(
      event.pointerId===
      joystickPointer
    ){

      event.preventDefault();


      updateJoystick(
        event.clientX,
        event.clientY
      );

    }

  }

);


function releaseJoystick(
event
){

  if(

    joystickPointer===null

    ||

    event.pointerId===
    joystickPointer

  ){

    joystickPointer=
      null;


    input.x=0;

    input.y=0;


    stick.style.transform=
      "translate(-50%,-50%)";

  }

}


joystick.addEventListener(
  "pointerup",

);


joystick.addEventListener(

);

/* ==================================================
ANIMATION
================================================== */

function changeState(
entity,
newState
){

  if(
    entity.state===
    newState
  ){

    return;

  }


  entity.state=
    newState;


  entity.frame=0;

  entity.frameTimer=0;

}


function updateAnimation(
entity,
animations
){

  const animation=
    animations[
      entity.state
    ];


  if(!animation){

    return;

  }


  entity.frameTimer++;


  if(
    entity.frameTimer>=
    animation.speed
  ){

    entity.frameTimer=0;


    entity.frame++;


    if(
      entity.frame>=
      animation.frames
    ){

      if(
        animation.loop
      ){

        entity.frame=0;

      }

      else{

        entity.frame=
          animation.frames-1;

      }

    }

  }

}


/* ==================================================
SPRITE DRAWING

Feet are anchored at entity.y.

This stops the floating effect.
================================================== */

function drawSprite(
image,
entity,
animations,
extraScale=1
){

  if(
    !image.complete
    ||
    !image.naturalWidth
  ){

    return false;

  }


  const animation=
    animations[
      entity.state
    ]
    ||
    animations.idle;


  const frame=
    Math.min(
      entity.frame,
      animation.frames-1
    );


  const sourceX=
    frame*
    SPRITE_WIDTH;


  const sourceY=
    animation.row*
    SPRITE_HEIGHT;


  const perspective=
    depthScale(
      entity.y
    );


  const scale=
    perspective*
    extraScale;


  const drawWidth=
    SPRITE_WIDTH*
    scale;


  const drawHeight=
    SPRITE_HEIGHT*
    scale;


  /*
  Our source characters' feet
  sit slightly above bottom edge.
  */

  const footOffset=
    6*
    scale;


  ctx.save();


  ctx.translate(
    entity.x,
    entity.y+
    footOffset
  );


  if(
    entity.facing<0
  ){

    ctx.scale(
      -1,
      1
    );

  }


  ctx.drawImage(

    image,

    sourceX,
    sourceY,

    SPRITE_WIDTH,
    SPRITE_HEIGHT,

    -drawWidth/2,

    -drawHeight,

    drawWidth,
    drawHeight

  );


  ctx.restore();


  return true;

}


/* ==================================================
PLAYER COMBAT VALUES
================================================== */

function attackMultiplier(){

  return(
    1+
    (
      upgrades.power-1
    )*.14
  );

}


function abilityMultiplier(){

  return(
    1+
    (
      upgrades.ability-1
    )*.18
  );

}


function cooldownMultiplier(){

  return Math.max(

    .45,

    1-
    (
      upgrades.speed-1
    )*.075

  );

}

function createBoss(){

  const bossNumber=
    (
      Math.floor(
        wave/5
      )-1
    )%3;


  const bossNames=[

    "MARDI GRAS",

    "ROUXGAROUX",

    "KOOSHMA"

  ];


  const name=
    bossNames[
      bossNumber
    ];


  const tier=
    Math.floor(
      (
        wave-5
      )/15
    )+1;


  let hp=
    720;


  let speed=
    1.8;


  let damage=
    18;


  if(
    name===
    "ROUXGAROUX"
  ){

    hp=980;

    speed=1.45;

    damage=24;

  }


  if(
    name===
    "KOOSHMA"
  ){

    hp=820;

    speed=1.6;

    damage=19;

  }


  hp=
    Math.floor(

      hp*

      (
        1+
        (
          tier-1
        )*.5
      )

    );


  return{

    boss:true,

    elite:true,


    name,

    tier,


    x:
      W*.67,


    y:
      roadTop()+
      (
        roadBottom()-
        roadTop()
      )*.45,


    vx:0,

    vy:0,


    hp,

    maxHp:hp,


    speed,

    damage,


    attackCooldown:
      45,


    specialCooldown:
      90,


    stun:0,

    hitTimer:0,

    dead:false,


    facing:-1,


    state:
      "idle",


    frame:0,

    frameTimer:0

  };

}

}

/* ==================================================
ATTACK ENEMIES
================================================== */

function hitEnemies(
range,
damage,
knockback,
electric=false
){

  let hits=
    0;


  enemies.forEach(

    enemy=>{

      if(
        enemy.dead
      ){

        return;

      }


      const dx=
        enemy.x-
        player.x;


      const dy=
        enemy.y-
        player.y;


      /*
      Beat-em-up combat favors
      lane alignment.
      */

      const horizontal=
        Math.abs(dx);


      const vertical=
        Math.abs(dy);


      if(

        horizontal<
        range

        &&

        vertical<
        range*.42

      ){

        let totalDamage=
          damage*
          attackMultiplier();


        if(
          electric
        ){

          totalDamage*=
            abilityMultiplier();

        }


        enemy.hp-=
          totalDamage;


        enemy.hitTimer=
          8;


        enemy.stun=
          enemy.boss
          ?
          7
          :
          16;


        const direction=
          Math.sign(dx)
          ||
          player.facing;


        enemy.vx+=
          direction*
          knockback*
          (
            enemy.boss
            ?
            .28
            :
            1
          );


        effects.push({

          type:
            electric
            ?
            "electricHit"
            :
            "hit",

          x:
            enemy.x,

          y:
            enemy.y-
            45*
            depthScale(
              enemy.y
            ),

          life:
            14

        });


        hits++;


        if(
          enemy.hp<=0
        ){

          killEnemy(
            enemy
          );

        }

      }

    }

  );


  if(
    hits>0
  ){

    combo+=
      hits;


    comboTimer=
      110;


    score+=
      hits*
      combo*
      5;

  }

}

/* ==================================================
PLAYER UPDATE
================================================== */

function updatePlayer(){

  /*
  Convert joystick input to
  a target velocity.
  */

  let inputX=
    input.x;


  let inputY=
    input.y;


  const magnitude=
    Math.hypot(
      inputX,
      inputY
    );


  if(
    magnitude>1
  ){

    inputX/=
      magnitude;


    inputY/=
      magnitude;

  }


  /*
  Forward/back movement
  is intentionally slower.
  */

  player.targetVx=
    inputX*
    player.maxSpeed;


  player.targetVy=
    inputY*
    player.maxSpeed*
    .67;


  if(
    player.actionLocked
  ){

    player.targetVx*=.15;

    player.targetVy*=.15;

  }


  /*
  Smooth acceleration.
  This replaces snap movement.
  */

  player.vx=
    lerp(

      player.vx,

      player.targetVx,

      player.acceleration

    );


  player.vy=
    lerp(

      player.vy,

      player.targetVy,

      player.acceleration

    );


  if(
    Math.abs(inputX)<.05
  ){

    player.vx*=
      player.friction;

  }


  if(
    Math.abs(inputY)<.05
  ){

    player.vy*=
      player.friction;

  }


  player.x+=
    player.vx;


  player.y+=
    player.vy;


  constrainToRoad(
    player
  );


  if(
    Math.abs(
      player.vx
    )>.15
  ){

    player.facing=
      Math.sign(
        player.vx
      );

  }


  /*
  Action recovery
  */

  if(
    player.actionTimer>0
  ){

    player.actionTimer--;

  }


  if(
    player.actionTimer<=0
    &&
    player.actionLocked
  ){

    player.actionLocked=
      false;

  }


  if(
    !player.actionLocked
  ){

    const moving=

      Math.abs(
        player.vx
      )>.3

      ||

      Math.abs(
        player.vy
      )>.25;


    changeState(

      player,

      moving
      ?
      "walk"
      :
      "idle"

    );

  }


  /* LIGHT */

  if(

    input.light

    &&

    !lightPressed

    &&

    player.lightCooldown<=0

  ){

    lightPressed=
      true;


    player.actionLocked=
      true;


    player.actionTimer=
      22;


    changeState(
      player,
      "light"
    );


    player.lightCooldown=
      Math.floor(

        21*
        cooldownMultiplier()

      );


    /*
    Damage occurs closer to
    the swing's impact frame.
    */

    setTimeout(

      ()=>{

        hitEnemies(
          86,
          15,
          8,
          false
        );

      },

      65

    );


    registerAttack(
      "A"
    );

  }


  if(
    !input.light
  ){

    lightPressed=
      false;

  }


  /* HEAVY */

  if(

    input.heavy

    &&

    !heavyPressed

    &&

    player.heavyCooldown<=0

  ){

    heavyPressed=
      true;


    player.actionLocked=
      true;


    player.actionTimer=
      30;


    player.electric=
      18;


    changeState(
      player,
      "heavy"
    );


    player.heavyCooldown=
      Math.floor(

        42*
        cooldownMultiplier()

      );


    setTimeout(

      ()=>{

        hitEnemies(
          105,
          29,
          15,
          true
        );

      },

      90

    );


    registerAttack(
      "H"
    );

  }


  if(
    !input.heavy
  ){

    heavyPressed=
      false;

  }


  /* SPECIAL */

  if(

    input.special

    &&

    !specialPressed

    &&

    player.specialCooldown<=0

    &&

    player.energy>=35

  ){

    specialPressed=
      true;


    player.energy-=35;


    player.actionLocked=
      true;


    player.actionTimer=
      32;


    player.electric=
      50;


    changeState(
      player,
      "special"
    );


    player.specialCooldown=
      Math.max(

        48,

        88-
        upgrades.ability*4

      );


    effects.push({

      type:
        "burst",

      x:
        player.x,

      y:
        player.y-35,

      life:
        35

    });


    setTimeout(

      ()=>{

        hitEnemies(

          170+
          upgrades.ability*7,

          35,

          20,

          true

        );

      },

      90

    );


    showMessage(
      "THUNDER BURST"
    );

  }


  if(
    !input.special
  ){

    specialPressed=
      false;

  }


  /* DASH */

  if(

    input.dash

    &&

    !dashPressed

    &&

    player.dashCooldown<=0

  ){

    dashPressed=
      true;


    player.dashCooldown=
      Math.max(

        26,

        49-
        upgrades.ability*2

      );


    player.invincible=
      22;


    player.electric=
      32;


    let dx=
      inputX;


    let dy=
      inputY;


    if(
      Math.hypot(
        dx,
        dy
      )<.2
    ){

      dx=
        player.facing;


      dy=0;

    }


    player.vx+=
      dx*
      (
        12+
        upgrades.ability*.6
      );


    player.vy+=
      dy*8;


    effects.push({

      type:
        "dash",

      x:
        player.x,

      y:
        player.y,

      life:
        18

    });


    hitEnemies(
      90,
      20,
      13,
      true
    );

  }


  if(
    !input.dash
  ){

    dashPressed=
      false;

  }


  [
    "lightCooldown",
    "heavyCooldown",
    "specialCooldown",
    "dashCooldown",
    "invincible",
    "electric"
  ]
  .forEach(

    key=>{

      if(
        player[key]>0
      ){

        player[key]--;

      }

    }

  );


  player.energy=
    Math.min(

      player.maxEnergy,

      player.energy+
      .15+
      upgrades.ability*.012

    );


  updateAnimation(
    player,
    chosenAnimations
  );

}


/* ==================================================
ENEMY AI
================================================== */

function updateEnemies(){

  enemies.forEach(

    enemy=>{

      if(
        enemy.dead
      ){

        return;

      }


      if(
        enemy.hitTimer>0
      ){

        enemy.hitTimer--;

      }


      if(
        enemy.attackCooldown>0
      ){

        enemy.attackCooldown--;

      }


      if(
        enemy.specialCooldown>0
      ){

        enemy.specialCooldown--;

      }


      if(
        enemy.stun>0
      ){

        enemy.stun--;


        enemy.vx*=.84;

        enemy.vy*=.84;


        enemy.x+=
          enemy.vx;


        enemy.y+=
          enemy.vy;


        constrainToRoad(
          enemy
        );


        updateAnimation(
          enemy,
          voodooAnimations
        );


        return;

      }


      const dx=
        player.x-
        enemy.x;


      const dy=
        player.y-
        enemy.y;


      const d=
        Math.hypot(
          dx,
          dy
        );


      enemy.facing=
        Math.sign(dx)
        ||
        enemy.facing;


      /*
      Smooth lane movement.
      */

      let desiredX=
        0;


      let desiredY=
        0;


      if(
        Math.abs(dy)>16
      ){

        desiredY=
          Math.sign(dy)*
          enemy.speed*.55;

      }


      if(
        Math.abs(dx)>58
      ){

        desiredX=
          Math.sign(dx)*
          enemy.speed;

      }


      /*
      Mardi Gras = erratic.
      */

      if(

        enemy.boss

        &&

        enemy.name===
        "MARDI GRAS"

        &&

        Math.random()<.035

      ){

        desiredX+=
          random(-5,5);


        desiredY+=
          random(-2.5,2.5);

      }


      /*
      Boss specials
      */

      if(

        enemy.boss

        &&

        enemy.specialCooldown<=0

      ){

        if(
          enemy.name===
          "MARDI GRAS"
        ){

          enemy.vx=
            dx/(d||1)*10;


          enemy.vy=
            dy/(d||1)*6;


          showMessage(
            "PARADE CRASH!"
          );

        }


        else if(
          enemy.name===
          "ROUXGAROUX"
        ){

          enemy.vx=
            dx/(d||1)*9;


          enemy.vy=
            dy/(d||1)*5;


          showMessage(
            "SWAMP LEAP!"
          );

        }


        else{

          enemy.x=
            clamp(

              player.x+
              random(-90,90),

              roadLeftAt(
                player.y
              ),

              roadRightAt(
                player.y
              )

            );


          enemy.y=
            clamp(

              player.y+
              random(-35,35),

              roadTop(),

              roadBottom()

            );


          showMessage(
            "NIGHT TERROR!"
          );

        }


        enemy.specialCooldown=
          95;

      }


      enemy.vx=
        lerp(
          enemy.vx,
          desiredX,
          .10
        );


      enemy.vy=
        lerp(
          enemy.vy,
          desiredY,
          .10
        );


      /*
      Attack only when both
      horizontal AND lane distance
      line up.
      */

      if(

        Math.abs(dx)<63

        &&

        Math.abs(dy)<28

        &&

        enemy.attackCooldown<=0

      ){

        enemy.attackCooldown=

          enemy.boss
          ?
          42
          :
          random(
            50,
            75
          );


        changeState(
          enemy,
          "attack"
        );


        enemy.frame=0;


        if(
          player.invincible<=0
        ){

          player.hp-=
            enemy.damage;


          player.invincible=
            22;


          effects.push({

            type:
              "hit",

            x:
              player.x,

            y:
              player.y-45,

            life:
              14

          });

        }

      }

      else{

        const moving=

          Math.abs(
            enemy.vx
          )>.25

          ||

          Math.abs(
            enemy.vy
          )>.20;


        if(
          enemy.state!==
          "attack"
          ||
          enemy.frame>=7
        ){

          changeState(

            enemy,

            moving
            ?
            "walk"
            :
            "idle"

          );

        }

      }


      enemy.x+=
        enemy.vx;


      enemy.y+=
        enemy.vy;


      constrainToRoad(
        enemy
      );


      updateAnimation(
        enemy,
        voodooAnimations
      );

    }

  );


  enemies=
    enemies.filter(
      enemy=>
      !enemy.dead
    );


  if(

    enemies.length===0

    &&

    !wavePending

  ){

    wavePending=
      true;


    if(
      shouldOpenShop(
        wave
      )
    ){

      setTimeout(
        openShop,
        650
      );

    }

    else{

      setTimeout(

        ()=>{

          wave++;


          wavePending=
            false;


          spawnWave();

        },

        750

      );

    }

  }


  if(
    player.hp<=0
  ){

    resetGame();

  }

}


/* ==================================================
PICKUPS
================================================== */

function updatePickups(){

  pickups.forEach(

    pickup=>{

      pickup.life--;


      pickup.bob+=
        .055;


      if(
        distance(
          player,
          pickup
        )<42
      ){

        const data=
          pickupTypes[
            pickup.type
          ];


        if(
          data.heal
        ){

          const before=
            player.hp;


          player.hp=
            Math.min(

              player.maxHp,

              player.hp+
              data.heal

            );


          const healed=
            Math.round(
              player.hp-before
            );


          showPickup(

            data.name+
            " +"+
            healed+
            " HP"

          );

        }


        if(
          data.points
        ){

          score+=
            data.points;


          voltage+=
            data.voltage;


          showPickup(

            data.name+
            " +"+
            data.points+
            " PTS"

          );

        }


        pickup.life=
          0;

      }

    }

  );


  pickups=
    pickups.filter(
      pickup=>
      pickup.life>0
    );

}


/* ==================================================
EFFECTS
================================================== */

function updateEffects(){

  effects.forEach(

    effect=>{

      effect.life--;

    }

  );


  effects=
    effects.filter(
      effect=>
      effect.life>0
    );

}


/* ==================================================
SHOP
================================================== */

function shouldOpenShop(
completedWave
){

  if(
    completedWave<=20
  ){

    return(
      completedWave%5===0
    );

  }


  return(
    completedWave%10===0
  );

}


function upgradeCost(
type
){

  const base=

    type===
    "ability"

    ?

    300

    :

    220;


  return Math.floor(

    base*

    Math.pow(

      1.42,

      upgrades[type]-1

    )

  );

}


function openShop(){

  paused=
    true;


  updateShop();


  document.getElementById(
    "shop"
  ).style.display=
    "flex";

}


function updateShop(){

  document.getElementById(
    "shopVoltage"
  ).textContent=
    voltage;


  document.getElementById(
    "powerLevel"
  ).textContent=
    upgrades.power;


  document.getElementById(
    "speedLevel"
  ).textContent=
    upgrades.speed;


  document.getElementById(
    "abilityLevel"
  ).textContent=
    upgrades.ability;


  [

    [
      "power",
      "powerButton"
    ],

    [
      "speed",
      "speedButton"
    ],

    [
      "ability",
      "abilityButton"
    ]

  ]
  .forEach(

    ([type,id])=>{

      const button=
        document.getElementById(
          id
        );


      const cost=
        upgradeCost(
          type
        );


      button.textContent=

        "⚡ "+
        cost+
        " VOLTAGE";


      button.disabled=

        voltage<cost

        ||

        upgrades[type]>=20;

    }

  );

}


function buyUpgrade(
type
){

  const cost=
    upgradeCost(
      type
    );


  if(
    voltage<cost
  ){

    return;

  }


  voltage-=
    cost;


  upgrades[type]++;


  if(
    type===
    "power"
  ){

    player.maxHp+=
      3;

  }


  if(
    type===
    "ability"
  ){

    player.maxEnergy+=
      4;


    player.energy=
      player.maxEnergy;

  }


  updateShop();

}


document.getElementById(
  "powerButton"
).onclick=

()=>buyUpgrade(
  "power"
);


document.getElementById(
  "speedButton"
).onclick=

()=>buyUpgrade(
  "speed"
);


document.getElementById(
  "abilityButton"
).onclick=

()=>buyUpgrade(
  "ability"
);


document.getElementById(
  "continueButton"
).onclick=

()=>{

  document.getElementById(
    "shop"
  ).style.display=
    "none";


  paused=
    false;


  wave++;


  wavePending=
    false;


  player.hp=
    Math.min(

      player.maxHp,

      player.hp+
      player.maxHp*.25

    );


  player.energy=
    player.maxEnergy;


  spawnWave();

};


/* ==================================================
RESET
================================================== */

function resetGame(){

  player.hp=
    player.maxHp;


  player.energy=
    player.maxEnergy;


  player.x=
    W*.5;


  player.y=
    roadBottom()-
    60;


  player.vx=0;

  player.vy=0;


  score=0;

  combo=0;

  wave=1;


  pickups=[];

  effects=[];


  wavePending=
    false;


  constrainToRoad(
    player
  );


  spawnWave();


  showMessage(
    "CHOSEN RISES"
  );

}


/* ==================================================
DRAW BACKGROUND

Instead of stretching the whole
picture, we build:

1. upper Bourbon Street scenery
2. enlarged pavement fighting layer

This makes the road a real stage.
================================================== */

function drawStage(){

  if(

    !images.stage.complete

    ||

    !images.stage.naturalWidth

  ){

    ctx.fillStyle=
      "#06101c";


    ctx.fillRect(
      0,
      0,
      W,
      H
    );


    return;

  }


  const imageWidth=
    images.stage.naturalWidth;


  const imageHeight=
    images.stage.naturalHeight;


  /*
  ------------------------------------------------
  BUILDINGS / BACKGROUND
  ------------------------------------------------
  */

  ctx.drawImage(

    images.stage,

    0,
    0,

    imageWidth,
    610,

    0,
    0,

    W,
    H*.64

  );


  /*
  ------------------------------------------------
  PLAYABLE ROAD

  Use the actual bottom pavement
  from the original art and enlarge
  it vertically.
  ------------------------------------------------
  */

  ctx.drawImage(

    images.stage,

    0,
    555,

    imageWidth,
    imageHeight-555,

    0,
    H*.52,

    W,
    H*.48

  );


  /*
  Blend the seam.
  */

  const seam=
    ctx.createLinearGradient(

      0,
      H*.49,

      0,
      H*.60

    );


  seam.addColorStop(
    0,
    "rgba(3,4,8,0)"
  );


  seam.addColorStop(
    .5,
    "rgba(3,4,8,.06)"
  );


  seam.addColorStop(
    1,
    "rgba(3,4,8,0)"
  );


  ctx.fillStyle=
    seam;


  ctx.fillRect(
    0,
    H*.48,
    W,
    H*.14
  );


  /*
  A subtle playable-floor tint.
  */

  ctx.fillStyle=
    "rgba(5,8,15,.08)";


  ctx.beginPath();


  ctx.moveTo(
    roadLeftAt(
      roadTop()
    ),
    roadTop()
  );


  ctx.lineTo(
    roadRightAt(
      roadTop()
    ),
    roadTop()
  );


  ctx.lineTo(
    roadRightAt(
      roadBottom()
    ),
    roadBottom()
  );


  ctx.lineTo(
    roadLeftAt(
      roadBottom()
    ),
    roadBottom()
  );


  ctx.closePath();


  ctx.fill();


  /*
  Rain.
  */

  const now=
    performance.now();


  ctx.strokeStyle=
    "rgba(165,210,240,.14)";


  ctx.lineWidth=1;


  for(
    let i=0;
    i<45;
    i++
  ){

    const x=
      (
        i*91+
        now*.12
      )%W;


    const y=
      (
        i*53+
        now*.34
      )%H;


    ctx.beginPath();


    ctx.moveTo(
      x,
      y
    );


    ctx.lineTo(
      x-3,
      y+13
    );


    ctx.stroke();

  }

}


/* ==================================================
GROUND SHADOW
================================================== */

function drawShadow(
entity,
sizeMultiplier=1
){

  const scale=
    depthScale(
      entity.y
    );


  ctx.save();


  ctx.fillStyle=
    "rgba(0,0,0,.42)";


  ctx.beginPath();


  ctx.ellipse(

    entity.x,

    entity.y+2,

    27*
    scale*
    sizeMultiplier,

    8*
    scale,

    0,

    0,

    Math.PI*2

  );


  ctx.fill();


  ctx.restore();

}


/* ==================================================
DRAW PLAYER
================================================== */

function drawPlayer(){

  drawShadow(
    player,
    1.08
  );


  /*
  Flash when hit.
  */

  if(

    player.invincible>0

    &&

    Math.floor(
      player.invincible/3
    )%2

  ){

    ctx.globalAlpha=
      .55;

  }


  drawSprite(

    images.chosen,

    player,

    chosenAnimations,

    1.18

  );


  ctx.globalAlpha=
    1;


  if(
    player.electric>0
  ){

    const scale=
      depthScale(
        player.y
      );


    ctx.save();


    ctx.strokeStyle=
      "#69e7ff";


    ctx.shadowColor=
      "#32c7ff";


    ctx.shadowBlur=
      15;


    ctx.lineWidth=
      2;


    for(
      let i=0;
      i<4;
      i++
    ){

      const radius=
        random(
          28,
          42
        )*
        scale;


      ctx.beginPath();


      ctx.arc(

        player.x+
        random(-10,10),

        player.y-
        48*
        scale+
        random(-8,8),

        radius,

        random(0,2),

        random(3.5,6)

      );


      ctx.stroke();

    }


    ctx.restore();

  }

}


/* ==================================================
DRAW ENEMY
================================================== */

function drawEnemy(
enemy
){

  const bossScale=

    enemy.boss
    ?
    1.32

    :

    enemy.elite
    ?
    1.08

    :

    1;


  drawShadow(
    enemy,
    bossScale
  );


  if(
    enemy.hitTimer>0
  ){

    ctx.globalAlpha=
      .62;

  }


  drawSprite(

    images.voodoo,

    enemy,

    voodooAnimations,

    bossScale

  );


  ctx.globalAlpha=
    1;


  if(
    !enemy.boss
  ){

    const scale=
      depthScale(
        enemy.y
      );


    const width=
      48*
      scale;


    const y=
      enemy.y-
      112*
      scale;


    ctx.fillStyle=
      "#17171b";


    ctx.fillRect(

      enemy.x-
      width/2,

      y,

      width,

      5

    );


    ctx.fillStyle=

      enemy.elite
      ?
      "#a546db"
      :
      "#da3041";


    ctx.fillRect(

      enemy.x-
      width/2,

      y,

      width*
      (
        enemy.hp/
        enemy.maxHp
      ),

      5

    );

  }

}


/* ==================================================
DRAW PICKUPS
================================================== */

function drawPickups(){

  ctx.textAlign=
    "center";


  pickups.forEach(

    pickup=>{

      const data=
        pickupTypes[
          pickup.type
        ];


      const scale=
        depthScale(
          pickup.y
        );


      const bob=
        Math.sin(
          pickup.bob
        )*5;


      const y=
        pickup.y-
        18-
        bob;


      ctx.save();


      ctx.shadowColor=
        data.color;


      ctx.shadowBlur=
        16;


      ctx.font=
        `bold ${26*scale}px Arial`;


      ctx.fillStyle=
        "white";


      ctx.fillText(
        data.emoji,
        pickup.x,
        y
      );


      ctx.shadowBlur=
        0;


      ctx.font=
        `bold ${8*scale}px Arial`;


      ctx.fillStyle=
        "white";


      ctx.fillText(

        data.name,

        pickup.x,

        y+
        17*
        scale

      );


      ctx.restore();

    }

  );

}


/* ==================================================
DRAW EFFECTS
================================================== */

function drawEffects(){

  effects.forEach(

    effect=>{

      ctx.save();


      const alpha=
        Math.max(
          0,
          effect.life/35
        );


      ctx.globalAlpha=
        alpha;


      if(
        effect.type===
        "burst"
      ){

        ctx.strokeStyle=
          "#69e7ff";


        ctx.shadowColor=
          "#39c9ff";


        ctx.shadowBlur=
          18;


        ctx.lineWidth=
          4;


        const radius=
          82-
          effect.life;


        ctx.beginPath();


        ctx.arc(
          effect.x,
          effect.y,
          radius,
          0,
          Math.PI*2
        );


        ctx.stroke();

      }


      else if(
        effect.type===
        "dash"
      ){

        ctx.strokeStyle=
          "#58ddff";


        ctx.shadowColor=
          "#31c7ff";


        ctx.shadowBlur=
          12;


        ctx.lineWidth=
          5;


        ctx.beginPath();


        ctx.moveTo(
          effect.x-
          player.facing*65,
          effect.y-35
        );


        ctx.lineTo(
          effect.x,
          effect.y-35
        );


        ctx.stroke();

      }


      else{

        ctx.fillStyle=

          effect.type===
          "electricHit"

          ?

          "#73ecff"

          :

          "#ff5a4f";


        ctx.fillRect(
          effect.x-5,
          effect.y-5,
          10,
          10
        );

      }


      ctx.restore();

    }

  );

}


/* ==================================================
HUD UPDATE
================================================== */

function updateHud(){

  document.getElementById(
    "hpText"
  ).textContent=

    Math.max(
      0,
      Math.ceil(
        player.hp
      )
    )

    +

    " / "

    +

    player.maxHp;


  document.getElementById(
    "energyText"
  ).textContent=

    Math.floor(
      player.energy
    )

    +

    " / "

    +

    player.maxEnergy;


  document.getElementById(
    "hpFill"
  ).style.width=

    Math.max(

      0,

      player.hp/
      player.maxHp*
      100

    )

    +

    "%";


  document.getElementById(
    "energyFill"
  ).style.width=

    player.energy/
    player.maxEnergy*
    100

    +

    "%";


  document.getElementById(
    "xpFill"
  ).style.width=

    xp/
    xpNeeded*
    100

    +

    "%";


  document.getElementById(
    "levelText"
  ).textContent=
    level;


  document.getElementById(
    "waveText"
  ).textContent=
    wave;


  document.getElementById(
    "voltageText"
  ).textContent=
    voltage;


  document.getElementById(
    "scoreText"
  ).textContent=
    score;


  document.getElementById(
    "comboText"
  ).textContent=
    combo;


  const bossHud=
    document.getElementById(
      "bossHud"
    );


  if(

    currentBoss

    &&

    !currentBoss.dead

  ){

    bossHud.style.display=
      "block";


    document.getElementById(
      "bossName"
    ).textContent=

      currentBoss.name

      +

      " — TIER "

      +

      currentBoss.tier;


    document.getElementById(
      "bossBar"
    ).style.width=

      Math.max(

        0,

        currentBoss.hp/
        currentBoss.maxHp*
        100

      )

      +

      "%";

  }

  else{

    bossHud.style.display=
      "none";

  }

}


/* ==================================================
UPDATE
================================================== */

function update(){

  if(
    paused
  ){

    return;

  }


  updatePlayer();


  updateEnemies();


  updatePickups();


  updateEffects();


  if(
    comboTimer>0
  ){

    comboTimer--;

  }

  else{

    combo=0;

  }


  if(
    sequenceTimer>0
  ){

    sequenceTimer--;

  }

  else{

    sequence=[];

  }


  if(
    messageTimer>0
  ){

    messageTimer--;

  }

  else{

    document.getElementById(
      "message"
    ).style.opacity=
      0;

  }


  if(
    pickupTimer>0
  ){

    pickupTimer--;

  }

  else{

    document.getElementById(
      "pickupMessage"
    ).style.opacity=
      0;

  }

}


/* ==================================================
DRAW

Everything is sorted by FEET position.
This creates Streets-of-Rage depth.
================================================== */

function draw(){

  drawStage();


  const actors=[


    ...enemies.map(

      enemy=>({

        y:
          enemy.y,

        draw:
          ()=>drawEnemy(
            enemy
          )

      })

    ),


    {

      y:
        player.y,

      draw:
        drawPlayer

    }


  ];


  actors.sort(

    (a,b)=>

    a.y-b.y

  );


  actors.forEach(

    actor=>{

      actor.draw();

    }

  );


  drawPickups();


  drawEffects();


  updateHud();

}


/* ==================================================
GAME LOOP
================================================== */

function gameLoop(){

  update();


  draw();


  requestAnimationFrame(
    gameLoop
  );

}


/* ==================================================
START
================================================== */

player.x=
  W*.5;


player.y=
  roadBottom()-
  65;


constrainToRoad(
  player
);


spawnWave();


gameLoop();


})();

</script>
