<!DOCTYPE html>
<html lang="en">
<head>

  initial-scale=1,
  maximum-scale=1,
  minimum-scale=1,
  user-scalable=no,
  viewport-fit=cover"
/>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Temple of Ash — Bourbon Street</title>

<style>

*{
  box-sizing:border-box;
  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  position:fixed;
  inset:0;
  background:#02050a;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  touch-action:none;
  overscroll-behavior:none;
}

canvas{
  position:fixed;
  inset:0;
  width:100vw;
  height:100dvh;
  display:block;
  image-rendering:pixelated;
  touch-action:none;
}

#hud{
  position:fixed;
  inset:0;
  z-index:5;
  pointer-events:none;
}

.top{
  position:absolute;
  top:max(8px,env(safe-area-inset-top));
  left:8px;
  right:8px;
  display:flex;
  gap:8px;
  justify-content:space-between;
}

.panel{
  background:rgba(2,6,12,.8);
  border:1px solid rgba(255,255,255,.18);
  border-radius:10px;
  padding:8px 10px;
  box-shadow:0 4px 20px rgba(0,0,0,.6);
}

.playerPanel{
  width:min(44vw,300px);
}

.center{
  text-align:center;
  min-width:110px;
}

.right{
  text-align:right;
  min-width:105px;
}

.name{
  font-weight:1000;
  font-style:italic;
  letter-spacing:1px;
}

.row{
  display:flex;
  justify-content:space-between;
  font-size:10px;
  opacity:.85;
  margin-top:4px;
}

.bar{
  height:8px;
  border-radius:12px;
  overflow:hidden;
  background:#262c35;
  margin-top:2px;
}

.fill{
  height:100%;
}

#hpFill{
  background:linear-gradient(90deg,#b51922,#ff5545);
}

#enFill{
  background:linear-gradient(90deg,#1269dc,#6be9ff);
}

#xpFill{
  background:linear-gradient(90deg,#7136db,#c47cff);
}

#message{
  position:absolute;
  top:18%;
  left:50%;
  transform:translateX(-50%);
  width:92%;
  text-align:center;
  font-size:clamp(22px,5vw,45px);
  font-weight:1000;
  font-style:italic;
  text-shadow:
    0 4px 4px #000,
    0 0 16px #35c8ff;
  opacity:0;
}

#bossHud{
  position:absolute;
  top:max(
    110px,
    calc(env(safe-area-inset-top) + 104px)
  );
  left:50%;
  transform:translateX(-50%);
  width:min(72vw,620px);
  display:none;
  text-align:center;
}

#bossName{
  font-weight:1000;
  letter-spacing:2px;
}

#bossOuter{

  border:2px solid rgba(255,255,255,.24);
  border-radius:12px;

  overflow:hidden;
  margin-top:4px;
}

#bossFill{

}

#pickupNotice{
  position:absolute;
  left:50%;

  transform:translateX(-50%);
  font-weight:900;
  text-shadow:0 2px 4px #000;
  opacity:0;
}

#controls{
  position:fixed;
  inset:0;
  z-index:10;
  pointer-events:none;
}

#joystick{
  position:absolute;
  left:max(18px,env(safe-area-inset-left));
  bottom:max(24px,env(safe-area-inset-bottom));

  height:138px;

  border:2px solid rgba(255,255,255,.26);
  background:rgba(5,8,13,.6);

}

#stick{

  top:50%;

  height:60px;
  border-radius:50%;
  transform:translate(-50%,-50%);
  background:rgba(223,232,240,.8);
  border:2px solid rgba(255,255,255,.5);

}

#buttons{
  position:absolute;
  right:max(16px,env(safe-area-inset-right));
  bottom:max(22px,env(safe-area-inset-bottom));
  width:186px;
  height:186px;
  pointer-events:auto;
}

.btn{
  position:absolute;
  width:70px;
  height:70px;
  border-radius:50%;
  border:2px solid rgba(255,255,255,.26);
  background:rgba(7,11,18,.88);

  font-size:21px;

}

.btn small{
  display:block;
  font-size:8px;
  opacity:.8;
}

.a{
  left:0;
  top:58px;
  color:#62bdff;
}

.h{
  left:65px;

  color:#ffd65a;
}

.s{
  left:65px;
  top:115px;
  color:#69e5ff;
}

.d{
  left:125px;
  top:58px;

}

#shop{
  position:fixed;
  inset:0;
  z-index:30;
  display:none;
  align-items:center;
  justify-content:center;

}

#shopCard{
  width:min(92vw,680px);
  max-height:82dvh;

  touch-action:pan-y;

}

.shopTitle{

.currency{

.grid{

.up p{

.up button,
#continue{

}

}

@media(max-width:620px){

  .grid{
    grid-template-columns:1fr;
  }

  #buttons{
    transform:scale(.88);
    transform-origin:bottom right;
  }

  .playerPanel{
    width:42vw;
  }
}

</style>
</head>

<script>

"use strict";

/* ========================================
MOBILE SCREEN LOCK
======================================== */

document.addEventListener(
  "touchmove",
  e=>{

    if(
      !e.target.closest(
        "#shopCard"
      )
    ){
      e.preventDefault();
    }

  },
  {
    passive:false
  }
);

[
  "gesturestart",
  "gesturechange",
  "gestureend"
]
.forEach(
  name=>
  document.addEventListener(
    name,
    e=>e.preventDefault()
  )
);

document.addEventListener(
  "contextmenu",
  e=>e.preventDefault()
);


/* ========================================
GAME
======================================== */

(()=>{

const canvas=
  document.getElementById(
    "game"
  );

const ctx=
  canvas.getContext(
    "2d"
  );

ctx.imageSmoothingEnabled=false;

let W=0;
let H=0;
let DPR=1;


/* ========================================
RESIZE
======================================== */

function resize(){

  DPR=
    Math.min(
      devicePixelRatio || 1,
      2
    );

  W=
    innerWidth;

  H=
    innerHeight;

  canvas.width=
    Math.floor(
      W*DPR
    );

  canvas.height=
    Math.floor(
      H*DPR
    );

  ctx.setTransform(
    DPR,
    0,
    0,
    DPR,
    0,
    0
  );

  ctx.imageSmoothingEnabled=false;

}

resize();

addEventListener(
  "resize",
  resize
);


/* ========================================
HELPERS
======================================== */

const clamp=
(v,a,b)=>
Math.max(
  a,
  Math.min(b,v)
);

const rand=
(a,b)=>
a+
Math.random()*
(b-a);

const distance=
(a,b)=>
Math.hypot(
  a.x-b.x,
  a.y-b.y
);


/* ========================================
IMAGE ASSETS
======================================== */

const imgs={

  chosen:
    new Image(),

  voodoo:
    new Image(),

  stage:
    new Image()

};


imgs.chosen.src=
  "assets/chosen_atlas.png";

imgs.voodoo.src=
  "assets/voodoo_atlas.png";

imgs.stage.src=
  "assets/bourbon_stage.jpg";


/* ========================================
SPRITE ATLAS SETTINGS
======================================== */

const chosenFrame={
  width:128,
  height:128
};

const voodooFrame={
  width:128,
  height:128
};


const rows={

  chosen:{

    idle:0,

    walk:1,

    light:2,

    heavy:3,

    special:4,

    hurt:5

  },

  voodoo:{

    idle:0,

    walk:1,

    attack:2

  }

};


/* ========================================
GAME STATE
======================================== */

let wave=1;

let score=0;

let voltage=0;

let level=1;

let xp=0;

let xpNeed=150;

let combo=0;

let comboTimer=0;

let paused=false;

let pending=false;

let currentBoss=null;

let messageTimer=0;

let noticeTimer=0;

let enemies=[];

let pickups=[];

let fx=[];


/* ========================================
PLAYER
======================================== */

const player={

  x:0,

  y:0,

  hp:120,

  maxHp:120,

  energy:100,

  maxEnergy:100,

  speed:4.1,

  facing:1,

  state:"idle",

  frame:0,

  animTimer:0,

  stateTimer:0,

  lightCd:0,

  heavyCd:0,

  specialCd:0,

  dashCd:0,

  inv:0,

  electric:0

};


/* ========================================
UPGRADES
======================================== */

const upgrades={

  power:1,

  speed:1,

  ability:1

};


/* ========================================
INPUT
======================================== */

const input={

  x:0,

  y:0,

  light:false,

  heavy:false,

  special:false,

  dash:false

};


let lightPressed=false;

let heavyPressed=false;

let specialPressed=false;

let dashPressed=false;


/* ========================================
PICKUPS
======================================== */

const itemDefs={

  grenade:{

    label:
      "HAND GRENADE",

    heal:100,

    glyph:"🧪",

    rare:true

  },

  kingcake:{

    label:
      "KING CAKE",

    heal:60,

    glyph:"🍰"

  },

  crawfish:{

    label:
      "CRAWFISH",

    heal:45,

    glyph:"🦞"

  },

  boudin:{

    label:
      "BOUDIN",

    heal:40,

    glyph:"🌭"

  },

  daiquiri:{

    label:
      "DAIQUIRI",

    heal:30,

    glyph:"🥤"

  },

  beignets:{

    label:
      "BEIGNETS",

    heal:25,

    glyph:"🍩"

  },

  beads:{

    label:
      "BEADS",

    points:250,

    glyph:"📿"

  }

};


/* ========================================
MESSAGES
======================================== */

function say(text){

  const el=
    document.getElementById(
      "message"
    );

  el.textContent=
    text;

  el.style.opacity=
    1;

  messageTimer=
    80;

}


function notice(text){

  const el=
    document.getElementById(
      "pickupNotice"
    );

  el.textContent=
    text;

  el.style.opacity=
    1;

  noticeTimer=
    80;

}


/* ========================================
JOYSTICK
======================================== */

const joystick=
  document.getElementById(
    "joystick"
  );

const stick=
  document.getElementById(
    "stick"
  );

let joyPointer=null;


function moveStick(
clientX,
clientY
){

  const rect=
    joystick
    .getBoundingClientRect();

  const cx=
    rect.left+
    rect.width/2;

  const cy=
    rect.top+
    rect.height/2;

  let dx=
    clientX-cx;

  let dy=
    clientY-cy;

  const max=
    rect.width*.31;

  const magnitude=
    Math.hypot(
      dx,
      dy
    );

  if(
    magnitude>max
  ){

    dx=
      dx/magnitude*
      max;

    dy=
      dy/magnitude*
      max;

  }

  input.x=
    dx/max;

  input.y=
    dy/max;

  stick.style.transform=
    `translate(
      calc(-50% + ${dx}px),
      calc(-50% + ${dy}px)
    )`;

}


joystick.addEventListener(
  "pointerdown",
  e=>{

    e.preventDefault();

    joyPointer=
      e.pointerId;

    joystick
      .setPointerCapture(
        e.pointerId
      );

    moveStick(
      e.clientX,
      e.clientY
    );

  }
);


joystick.addEventListener(
  "pointermove",
  e=>{

    if(
      e.pointerId===
      joyPointer
    ){

      e.preventDefault();

      moveStick(
        e.clientX,
        e.clientY
      );

    }

  }
);


function releaseStick(e){

  if(
    joyPointer===null ||
    e.pointerId===
    joyPointer
  ){

    joyPointer=null;

    input.x=0;

    input.y=0;

    stick.style.transform=
      "translate(-50%,-50%)";

  }

}


joystick.addEventListener(
  "pointerup",
  releaseStick
);

joystick.addEventListener(
  "pointercancel",
  releaseStick
);


/* ========================================
BUTTONS
======================================== */

function bindButton(
id,
key
){

  const button=
    document.getElementById(
      id
    );

  button.addEventListener(
    "pointerdown",
    e=>{

      e.preventDefault();

      input[key]=true;

    }
  );

  const up=
    e=>{

      e.preventDefault();

      input[key]=false;

    };

  button.addEventListener(
    "pointerup",
    up
  );

  button.addEventListener(
    "pointercancel",
    up
  );

  button.addEventListener(
    "pointerleave",
    up
  );

}


bindButton(
  "lightBtn",
  "light"
);

bindButton(
  "heavyBtn",
  "heavy"
);

bindButton(
  "specialBtn",
  "special"
);

bindButton(
  "dashBtn",
  "dash"
);


/* ========================================
ANIMATION
======================================== */

function setState(
state,
timer=0
){

  if(
    player.state!==state
  ){

    player.state=
      state;

    player.frame=
      0;

    player.animTimer=
      0;

  }

  player.stateTimer=
    timer;

}


function updateAnim(
entity,
speed
){

  entity.animTimer++;

  if(
    entity.animTimer>=speed
  ){

    entity.animTimer=
      0;

    entity.frame=
      (
        entity.frame+1
      )%8;

  }

}


/* ========================================
DRAW SPRITE FRAME
======================================== */

function drawFrame(
img,
row,
frame,
x,
y,
scale=1,
flip=false
){

  if(
    !img.complete ||
    !img.naturalWidth
  ){
    return false;
  }

  const frameWidth=
    128;

  const frameHeight=
    128;

  const cols=
    Math.floor(
      img.naturalWidth/
      frameWidth
    );

  const sx=
    (
      frame%
      cols
    )*
    frameWidth;

  const sy=
    row*
    frameHeight;

  ctx.save();

  ctx.translate(
    x,
    y
  );

  if(flip){

    ctx.scale(
      -1,
      1
    );

  }

  const drawW=
    frameWidth*
    scale;

  const drawH=
    frameHeight*
    scale;

  ctx.drawImage(

    img,

    sx,
    sy,

    frameWidth,
    frameHeight,

    -drawW/2,
    -drawH,

    drawW,
    drawH

  );

  ctx.restore();

  return true;

}


/* ========================================
DEPTH
======================================== */

function depth(y){

  const top=
    H*.46;

  const bottom=
    H*.84;

  const t=
    clamp(
      (
        y-top
      )/
      (
        bottom-top
      ),
      0,
      1
    );

  return(
    .72+
    t*.36
  );

}


/* ========================================
ENEMIES
======================================== */

function createEnemy(
elite=false
){

  const enemy={

    boss:false,

    elite,

    x:
      rand(
        W*.1,
        W*.9
      ),

    y:
      rand(
        H*.5,
        H*.81
      ),

    hp:
      elite
      ?
      130
      :
      70,

    maxHp:
      elite
      ?
      130
      :
      70,

    damage:
      elite
      ?
      14
      :
      8,

    speed:
      elite
      ?
      1.35
      :
      rand(
        1.05,
        1.5
      ),

    vx:0,

    vy:0,

    attackCd:
      rand(
        20,
        60
      ),

    specialCd:0,

    stun:0,

    hit:0,

    dead:false,

    facing:-1,

    state:"idle",

    frame:0,

    animTimer:0

  };

  return enemy;

}


/* ========================================
BOSSES
======================================== */

function createBoss(){

  const index=
    (
      Math.floor(
        wave/5
      )-1
    )%3;

  const tier=
    Math.floor(
      (
        wave-5
      )/15
    )+1;

  const names=[
    "MARDI GRAS",
    "ROUXGAROUX",
    "KOOSHMA"
  ];

  const name=
    names[index];

  let hp=
    700;

  let damage=
    18;

  let speed=
    1.8;

  if(
    name===
    "ROUXGAROUX"
  ){

    hp=950;

    damage=24;

    speed=1.35;

  }

  if(
    name===
    "KOOSHMA"
  ){

    hp=800;

    damage=18;

    speed=1.55;

  }

  hp=
    Math.floor(
      hp*
      (
        1+
        (
          tier-1
        )*.5
      )
    );

  const boss={

    boss:true,

    name,

    tier,

    elite:false,

    x:
      W*.78,

    y:
      H*.63,

    hp,

    maxHp:hp,

    damage,

    speed,

    vx:0,

    vy:0,

    attackCd:40,

    specialCd:90,

    stun:0,

    hit:0,

    dead:false,

    facing:-1,

    state:"idle",

    frame:0,

    animTimer:0

  };

  return boss;

}


/* ========================================
WAVES
======================================== */

function bossWave(){

  return(
    wave%5===0
  );

}


function spawnWave(){

  enemies=[];

  currentBoss=null;

  if(
    bossWave()
  ){

    currentBoss=
      createBoss();

    enemies.push(
      currentBoss
    );

    document.getElementById(
      "enemyLabel"
    ).textContent=
      "BOSS WAVE";

    say(
      currentBoss.name
    );

  }

  else{

    document.getElementById(
      "enemyLabel"
    ).textContent=
      "VOODOO CLAN";

    const count=
      Math.min(
        4+
        Math.floor(
          wave*1.15
        ),
        14
      );

    for(
      let i=0;
      i<count;
      i++
    ){

      enemies.push(
        createEnemy(
          wave>=4 &&
          i%5===0
        )
      );

    }

  }

}

    }

    ){

    }

    ){

function killEnemy(
enemy
){

    return;

  enemy.dead=
    true;

  dropPickup(
    enemy
  );

  if(
    enemy.boss
  ){

      Math.floor(
        (

          "MARDI GRAS"
          ?
          650
          :
          enemy.name===

          ?
          800
          :

        (
          1+
          (
            enemy.tier-1
          )*.55
        )
      );

      bossReward;

    score+=
      bossReward*2;

      enemy.name+
      " DEFEATED!"
    );

      :

      enemy.elite
      ?
      220
      :
      100;

  }

/* ========================================
COMBAT
======================================== */

function attackMul(){

  return(
    1+
    (
      upgrades.power-1
    )*.14
  );

}


function abilityMul(){

  return(
    1+
    (
      upgrades.ability-1
    )*.18
  );

}


function cdMul(){

  return Math.max(
    .45,
    1-
    (
      upgrades.speed-1
    )*.075
  );

}


function hitEnemies(
range,
damage,
knockback,
electric=false
){

  let hits=0;

  enemies.forEach(
    enemy=>{

      if(enemy.dead)
        return;

      const d=
        distance(
          player,
          enemy
        );

      const lane=
        Math.abs(
          player.y-
          enemy.y
        );

      if(
        d<
        range &&
        lane<
        range*.55
      ){

        let total=
          damage*
          attackMul();

        if(electric){

          total*=
            abilityMul();

        }

        enemy.hp-=
          total;

        enemy.hit=
          6;

        enemy.stun=
          enemy.boss
          ?
          6
          :
          14;

        const dx=
          (
            enemy.x-
            player.x
          )/
          (d||1);

        const dy=
          (
            enemy.y-
            player.y
          )/
          (d||1);

        const resistance=
          enemy.boss
          ?
          .25
          :
          1;

        enemy.vx+=
          dx*
          knockback*
          resistance;

        enemy.vy+=
          dy*
          knockback*
          .35*
          resistance;

        fx.push({

          x:enemy.x,

          y:enemy.y-45,

          life:12,

          type:
            electric
            ?
            "spark"
            :
            "hit"

        });

        hits++;

        if(
          enemy.hp<=0
        ){

          killEnemy(
            enemy
          );

        }

      }

    }
  );

  if(hits){

    combo+=hits;

    comboTimer=
      100;

    score+=
      hits*
      combo*
      5;

  }

}

/* ========================================
PLAYER UPDATE
======================================== */

function updatePlayer(){

  let dx=
    input.x;

  let dy=
    input.y;

  let magnitude=
    Math.hypot(
      dx,
      dy
    );

  if(
    magnitude>1
  ){

    dx/=
      magnitude;

    dy/=
      magnitude;

  }

  if(
    player.stateTimer>0
  ){

    player.stateTimer--;

  }

  const attackLocked=
    player.stateTimer>0 &&
    (
      player.state===
      "light" ||
      player.state===
      "heavy"
    );

  if(!attackLocked){

    player.x+=
      dx*
      player.speed;

    player.y+=
      dy*
      player.speed*
      .72;

    player.x=
      clamp(
        player.x,
        35,
        W-35
      );

    player.y=
      clamp(
        player.y,
        H*.46,
        H*.84
      );

    if(
      Math.abs(dx)>.08
    ){

      player.facing=
        Math.sign(dx);

    }

    if(
      player.stateTimer<=0
    ){

      setState(
        Math.hypot(
          dx,
          dy
        )>.08
        ?
        "walk"
        :
        "idle"
      );

    }

  }


  /* LIGHT ATTACK */

  if(
    input.light &&
    !lightPressed &&
    player.lightCd<=0
  ){

    lightPressed=
      true;

    setState(
      "light",
      14
    );

    player.lightCd=
      Math.floor(
        18*
        cdMul()
      );

    hitEnemies(
      78,
      15,
      7
    );

    registerCombo(
      "A"
    );

  }

  if(!input.light){

    lightPressed=
      false;

  }


  /* HEAVY */

  if(
    input.heavy &&
    !heavyPressed &&
    player.heavyCd<=0
  ){

    heavyPressed=
      true;

    setState(
      "heavy",
      20
    );

    player.heavyCd=
      Math.floor(
        38*
        cdMul()
      );

    player.electric=
      12;

    hitEnemies(
      96,
      28,
      14,
      true
    );

    registerCombo(
      "H"
    );

  }

  if(!input.heavy){

    heavyPressed=
      false;

  }


  /* SPECIAL */

  if(
    input.special &&
    !specialPressed &&
    player.specialCd<=0 &&
    player.energy>=35
  ){

    specialPressed=
      true;

    player.energy-=35;

    player.specialCd=
      Math.max(
        45,
        82-
        upgrades.ability*4
      );

    player.electric=
      35;

    setState(
      "special",
      24
    );

    hitEnemies(
      165,
      34,
      20,
      true
    );

    fx.push({

      x:
        player.x,

      y:
        player.y-35,

      life:35,

      type:"burst"

    });

    say(
      "THUNDER BURST"
    );

  }

  if(!input.special){

    specialPressed=
      false;

  }


  /* LIGHTNING DASH */

  if(
    input.dash &&
    !dashPressed &&
    player.dashCd<=0
  ){

    dashPressed=
      true;

    player.dashCd=
      Math.max(
        24,
        46-
        upgrades.ability*2
      );

    player.inv=
      20;

    player.electric=
      22;

    let mx=dx;

    let my=dy;

    if(
      Math.hypot(
        mx,
        my
      )<.2
    ){

      mx=
        player.facing;

      my=
        0;

    }

    player.x=
      clamp(
        player.x+
        mx*
        (
          90+
          upgrades.ability*7
        ),
        35,
        W-35
      );

    player.y=
      clamp(
        player.y+
        my*70,
        H*.46,
        H*.84
      );

    hitEnemies(
      82,
      18,
      12,
      true
    );

    say(
      "LIGHTNING DASH"
    );

  }

  if(!input.dash){

    dashPressed=
      false;

  }


  [
    "lightCd",
    "heavyCd",
    "specialCd",
    "dashCd",
    "inv",
    "electric"
  ]
  .forEach(
    key=>{

      if(
        player[key]>0
      ){

        player[key]--;

      }

    }
  );


  player.energy=
    Math.min(
      player.maxEnergy,

      player.energy+
      .15+
      upgrades.ability*.012
    );


  updateAnim(

    player,

    player.state===
    "walk"
    ?
    6
    :
    player.state===
    "idle"
    ?
    10
    :
    4

  );

}


/* ========================================
ENEMY AI
======================================== */

function updateEnemies(){

  for(
    const enemy
    of enemies
  ){

    if(enemy.dead)
      continue;

    if(
      enemy.hit>0
    ){

      enemy.hit--;

    }

    if(
      enemy.stun>0
    ){

      enemy.stun--;

      enemy.vx*=.86;

      enemy.vy*=.86;

      enemy.x+=
        enemy.vx;

      enemy.y+=
        enemy.vy;

      continue;

    }

    if(
      enemy.attackCd>0
    ){
      enemy.attackCd--;
    }

    if(
      enemy.specialCd>0
    ){
      enemy.specialCd--;
    }


    const dx=
      player.x-
      enemy.x;

    const dy=
      player.y-
      enemy.y;

    const d=
      Math.hypot(
        dx,
        dy
      );


    enemy.facing=
      Math.sign(dx) ||
      enemy.facing;


    if(enemy.boss){

      if(
        enemy.name===
        "MARDI GRAS" &&
        Math.random()<.05
      ){

        enemy.vx+=
          rand(-6,6);

        enemy.vy+=
          rand(-3,3);

      }


      if(
        enemy.specialCd<=0
      ){

        if(
          enemy.name===
          "MARDI GRAS"
        ){

          enemy.vx=
            dx/(d||1)*13;

          enemy.vy=
            dy/(d||1)*7;

          say(
            "PARADE CRASH!"
          );

        }

        else if(
          enemy.name===
          "ROUXGAROUX"
        ){

          enemy.vx=
            dx/(d||1)*11;

          enemy.vy=
            dy/(d||1)*6;

          say(
            "SWAMP LEAP!"
          );

        }

        else{

          enemy.x=
            clamp(
              player.x+
              rand(-100,100),
              35,
              W-35
            );

          enemy.y=
            clamp(
              player.y+
              rand(-35,35),
              H*.46,
              H*.84
            );

          say(
            "NIGHT TERROR!"
          );

        }

        enemy.specialCd=
          90;

      }

      else{

        enemy.vx+=
          dx/(d||1)*
          enemy.speed*.2;

        enemy.vy+=
          dy/(d||1)*
          enemy.speed*.12;

      }

    }

    else{

      if(
        Math.abs(dy)>16
      ){

        enemy.vy+=
          Math.sign(dy)*
          enemy.speed*.15;

      }

      if(
        d>58
      ){

        enemy.vx+=
          dx/(d||1)*
          enemy.speed*.2;

      }

    }


    if(
      d<62 &&
      Math.abs(dy)<32 &&
      enemy.attackCd<=0 &&
      player.inv<=0
    ){

      enemy.attackCd=
        enemy.boss
        ?
        40
        :
        rand(
          48,
          72
        );

      player.hp-=
        enemy.damage;

      player.inv=
        22;

      fx.push({

        x:
          player.x,

        y:
          player.y-45,

        life:12,

        type:"hit"

      });

      enemy.state=
        "attack";

    }

    else{

      enemy.state=
        d>70
        ?
        "walk"
        :
        "idle";

    }


    enemy.vx*=.86;

    enemy.vy*=.86;

    enemy.x+=
      enemy.vx;

    enemy.y+=
      enemy.vy;

    enemy.x=
      clamp(
        enemy.x,
        20,
        W-20
      );

    enemy.y=
      clamp(
        enemy.y,
        H*.46,
        H*.84
      );


    updateAnim(

      enemy,

      enemy.state===
      "walk"
      ?
      7
      :
      enemy.state===
      "attack"
      ?
      5
      :
      10

    );

  }


  enemies=
    enemies.filter(
      enemy=>
      !enemy.dead
    );


  if(
    !enemies.length &&
    !pending
  ){

    pending=
      true;

    if(
      shouldShop(
        wave
      )
    ){

      setTimeout(
        openShop,
        600
      );

    }

    else{

      setTimeout(
        ()=>{

          wave++;

          pending=
            false;

          spawnWave();

        },
        700
      );

    }

  }


  if(
    player.hp<=0
  ){

    player.hp=
      player.maxHp;

    player.energy=
      player.maxEnergy;

    score=0;

    combo=0;

    wave=1;

    pickups=[];

    pending=false;

    say(
      "CHOSEN RISES"
    );

    spawnWave();

  }

}


/* ========================================
PICKUPS
======================================== */

function updatePickups(){

  for(
    const pickup
    of pickups
  ){

    pickup.life--;

    pickup.bob+=
      .05;

    if(
      distance(
        player,
        pickup
      )<45
    ){

      const data=
        itemDefs[
          pickup.key
        ];


      if(
        data.heal
      ){

        const before=
          player.hp;

        player.hp=
          Math.min(
            player.maxHp,
            player.hp+
            data.heal
          );

        notice(
          data.label+
          " +"+
          Math.round(
            player.hp-before
          )+
          " HP"
        );

      }


      if(
        data.points
      ){

        score+=
          data.points;

        voltage+=1;

        notice(
          data.label+
          " +"+
          data.points+
          " PTS"
        );

      }


      pickup.life=
        0;

    }

  }


  pickups=
    pickups.filter(
      pickup=>
      pickup.life>0
    );

}

FX

/* ========================================
UPGRADE SHOP
======================================== */

function shouldShop(
number
){

  return(
    number<=20
    ?
    number%5===0
    :
    number%10===0
  );

}


function cost(
type
){

  return Math.floor(

    (
      type===
      "ability"
      ?
      300
      :
      220
    )

    *

    Math.pow(
      1.42,
      upgrades[type]-1
    )

  );

}


function openShop(){

  paused=true;

  updateShop();

  document.getElementById(
    "shop"
  ).style.display=
    "flex";

}


function updateShop(){

  document.getElementById(
    "shopVolt"
  ).textContent=
    voltage;

  document.getElementById(
    "pLv"
  ).textContent=
    upgrades.power;

  document.getElementById(
    "spLv"
  ).textContent=
    upgrades.speed;

  document.getElementById(
    "abLv"
  ).textContent=
    upgrades.ability;


  [
    [
      "power",
      "pBtn"
    ],

    [
      "speed",
      "spBtn"
    ],

    [
      "ability",
      "abBtn"
    ]
  ]
  .forEach(
    ([type,id])=>{

      const button=
        document.getElementById(
          id
        );

      const price=
        cost(type);

      button.textContent=
        "⚡ "+
        price+
        " VOLTAGE";

      button.disabled=
        voltage<price ||
        upgrades[type]>=20;

    }
  );

}


function buy(
type
){

  const price=
    cost(type);

  if(
    voltage<price
  ){
    return;
  }

  voltage-=
    price;

  upgrades[type]++;


  if(
    type===
    "power"
  ){

    player.maxHp+=
      3;

  }


  if(
    type===
    "ability"
  ){

    player.maxEnergy+=
      4;

    player.energy=
      player.maxEnergy;

  }


  updateShop();

}


document.getElementById(
  "pBtn"
).onclick=
()=>buy(

);

document.getElementById(
  "spBtn"
).onclick=
()=>buy(
  "speed"
);

document.getElementById(
  "abBtn"
).onclick=
()=>buy(

);

    );

};


/* ========================================
DRAW STAGE
======================================== */

function drawStage(){

  if(
    imgs.stage.complete &&
    imgs.stage.naturalWidth
  ){

    const imageRatio=
      imgs.stage.naturalWidth/
      imgs.stage.naturalHeight;

    const canvasRatio=
      W/H;

    let sx=0;
    let sy=0;

    let sw=
      imgs.stage.naturalWidth;

    let sh=
      imgs.stage.naturalHeight;


    if(
      imageRatio>
      canvasRatio
    ){

      sw=
        sh*
        canvasRatio;

      sx=
        (
          imgs.stage.naturalWidth-
          sw
        )/2;

    }

    else{

      sh=
        sw/
        canvasRatio;

      sy=
        (
          imgs.stage.naturalHeight-
          sh
        )/2;

    }


    ctx.drawImage(

      imgs.stage,

      sx,
      sy,

      sw,
      sh,

      0,
      0,

      W,
      H

    );

  }

  else{

    ctx.fillStyle=
      "#07111d";

    ctx.fillRect(
      0,
      0,
      W,
      H
    );

  }


  ctx.fillStyle=
    "rgba(3,6,12,.12)";

  ctx.fillRect(
    0,
    0,
    W,
    H
  );


  /* rain */

  for(
    let i=0;
    i<38;
    i++
  ){

    const x=
      (
        i*83+
        performance.now()*.11
      )%W;

    const y=
      (
        i*47+
        performance.now()*.32
      )%H;

    ctx.strokeStyle=
      "rgba(160,210,240,.13)";

    ctx.beginPath();

    ctx.moveTo(
      x,
      y
    );

    ctx.lineTo(
      x-3,
      y+13
    );

    ctx.stroke();

  }

}


/* ========================================
DRAW CHOSEN
======================================== */

function drawPlayer(){

  const scale=
    depth(
      player.y
    );

  const flip=
    player.facing<0;


  ctx.fillStyle=
    "rgba(0,0,0,.42)";

  ctx.beginPath();

  ctx.ellipse(
    player.x,
    player.y+3,
    28*scale,
    9*scale,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();


  let row=
    rows.chosen[
      player.state
    ] ??
    rows.chosen.idle;


  const drewSprite=
    drawFrame(

      imgs.chosen,

      row,

      player.frame,

      player.x,

      player.y,

      scale*1.18,

      flip

    );


  if(
    !drewSprite
  ){

    ctx.fillStyle=
      "#126fd4";

    ctx.fillRect(
      player.x-20,
      player.y-70,
      40,
      68
    );

  }


  if(
    player.electric>0
  ){

    ctx.strokeStyle=
      "#65e7ff";

    ctx.shadowColor=
      "#33c7ff";

    ctx.shadowBlur=
      12;

    ctx.beginPath();

    ctx.arc(
      player.x,
      player.y-45,
      35*scale,
      0,
      Math.PI*2
    );

    ctx.stroke();

    ctx.shadowBlur=
      0;

  }

}


/* ========================================
DRAW ENEMIES
======================================== */

function drawEnemy(
enemy
){

  const scale=
    depth(
      enemy.y
    )*
    (
      enemy.boss
      ?
      1.28
      :
      enemy.elite
      ?
      1.08
      :
      1
    );


  const flip=
    enemy.facing<0;


  ctx.fillStyle=
    "rgba(0,0,0,.38)";

  ctx.beginPath();

  ctx.ellipse(
    enemy.x,
    enemy.y+3,
    25*scale,
    8*scale,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();


  const row=
    rows.voodoo[
      enemy.state
    ] ?? 0;


  drawFrame(

    imgs.voodoo,

    row,

    enemy.frame,

    enemy.x,

    enemy.y,

    scale,

    flip

  );


  if(!enemy.boss){

    const barWidth=
      46*
      scale;

    ctx.fillStyle=
      "#17171b";

    ctx.fillRect(

      enemy.x-
      barWidth/2,

      enemy.y-
      100*
      scale,

      barWidth,

      5

    );


    ctx.fillStyle=
      enemy.elite
      ?
      "#9d49d8"
      :
      "#da3040";


    ctx.fillRect(

      enemy.x-
      barWidth/2,

      enemy.y-
      100*
      scale,

      barWidth*
      (
        enemy.hp/
        enemy.maxHp
      ),

      5

    );

  }

}


/* ========================================
DRAW PICKUPS
======================================== */

function drawPickups(){

  ctx.textAlign=
    "center";

  ctx.font=
    "bold 24px Arial";


  for(
    const pickup
    of pickups
  ){

    const data=
      itemDefs[
        pickup.key
      ];

    const y=
      pickup.y-
      18-
      Math.sin(
        pickup.bob
      )*5;


    ctx.save();


    ctx.shadowBlur=
      14;


    ctx.shadowColor=
      pickup.key===
      "grenade"
      ?
      "#6cff47"
      :
      pickup.key===
      "beads"
      ?
      "#c34dff"
      :
      "#ffd65c";


    ctx.fillStyle=
      "#fff";


    ctx.fillText(
      data.glyph,
      pickup.x,
      y
    );


    ctx.font=
      "bold 9px Arial";


    ctx.fillStyle=
      "#fff";


    ctx.fillText(
      data.label,
      pickup.x,
      y+17
    );


    ctx.restore();


    ctx.font=
      "bold 24px Arial";

  }

}


/* ========================================
DRAW EFFECTS
======================================== */

function drawFx(){

  for(
    const effect
    of fx
  ){

    ctx.save();

    ctx.globalAlpha=
      effect.life/35;


    if(
      effect.type===
      "burst"
    ){

      ctx.strokeStyle=
        "#66e7ff";

      ctx.shadowColor=
        "#38c7ff";

      ctx.shadowBlur=
        18;

      ctx.lineWidth=
        4;

      ctx.beginPath();

      ctx.arc(

        effect.x,

        effect.y,

        60-
        effect.life*.5,

        0,

        Math.PI*2

      );

      ctx.stroke();

    }

    else{

      ctx.fillStyle=
        effect.type===
        "spark"
        ?
        "#72eaff"
        :
        "#ff5a50";

      ctx.fillRect(
        effect.x-4,
        effect.y-4,
        8,
        8
      );

    }


    ctx.restore();

  }

}


/* ========================================
HUD UPDATE
======================================== */

function hud(){

  document.getElementById(
    "hpText"
  ).textContent=
    Math.max(
      0,
      Math.ceil(
        player.hp
      )
    )+
    " / "+
    player.maxHp;


  document.getElementById(
    "enText"
  ).textContent=
    Math.floor(
      player.energy
    )+
    " / "+
    player.maxEnergy;


  document.getElementById(
    "hpFill"
  ).style.width=
    Math.max(
      0,
      player.hp/
      player.maxHp*
      100
    )+"%";


  document.getElementById(
    "enFill"
  ).style.width=
    player.energy/
    player.maxEnergy*
    100+
    "%";


  document.getElementById(
    "xpFill"
  ).style.width=
    xp/
    xpNeed*
    100+
    "%";


  document.getElementById(
    "lvText"
  ).textContent=
    level;


  document.getElementById(
    "waveText"
  ).textContent=
    wave;


  document.getElementById(
    "voltText"
  ).textContent=
    voltage;


  document.getElementById(
    "scoreText"
  ).textContent=
    score;


  document.getElementById(
    "comboText"
  ).textContent=
    combo;


  const bossHud=
    document.getElementById(
      "bossHud"
    );


  if(
    currentBoss &&
    !currentBoss.dead
  ){

    bossHud.style.display=
      "block";


    document.getElementById(
      "bossName"
    ).textContent=
      currentBoss.name+
      " — TIER "+
      currentBoss.tier;


    document.getElementById(
      "bossFill"
    ).style.width=
      Math.max(
        0,
        currentBoss.hp/
        currentBoss.maxHp*
        100
      )+
      "%";

  }

  else{

    bossHud.style.display=
      "none";

  }

}


/* ========================================
MAIN UPDATE
======================================== */

function update(){

  if(paused)
    return;


  updatePlayer();

  updateEnemies();

  updatePickups();

  updateFx();


  if(
    comboTimer>0
  ){

    comboTimer--;

  }

  else{

    combo=0;

  }


  if(
    comboSequenceTimer>0
  ){

    comboSequenceTimer--;

  }

  else{

    comboSequence=[];

  }


  if(
    messageTimer>0
  ){

    messageTimer--;

  }

  else{

    document.getElementById(
      "message"
    ).style.opacity=
      0;

  }


  if(
    noticeTimer>0
  ){

    noticeTimer--;

  }

  else{

    document.getElementById(
      "pickupNotice"
    ).style.opacity=
      0;

  }

}


/* ========================================
MAIN DRAW
======================================== */

function draw(){

  drawStage();


  const actors=[

    ...enemies.map(
      enemy=>({

        y:
          enemy.y,

        fn:
          ()=>drawEnemy(
            enemy
          )

      })
    ),

    {

      y:
        player.y,

      fn:
        drawPlayer

    }

  ]
  .sort(
    (a,b)=>
    a.y-b.y
  );


  actors.forEach(
    actor=>
    actor.fn()
  );


  drawPickups();

  drawFx();

  hud();

}


/* ========================================
LOOP
======================================== */

function loop(){

  update();

  draw();

  requestAnimationFrame(
    loop
  );

}


/* ========================================
START
======================================== */

player.x=
  W*.5;

player.y=
  H*.69;

spawnWave();

loop();

})();

</script>
