function resetRun(){

  gameIsOver=false;
  paused=false;
  pauseOpen=false;

  bossIntroActive=false;
  bossIntroBoss=null;
  bossIntroTimer=0;

  respawning=false;
  respawnTimer=0;

  tripleSurgeActive=false;

  lives=3;

  wave=1;

  score=0;

  voltage=0;

  runVoltageEarned=0;

  combo=0;
  comboTimer=0;

  kills=0;

  wavePending=false;
  pendingSpawns=0;

  enemies=[];
  pickups=[];
  effects=[];

  hitStopFrames=0;

  cameraShake=0;
  cameraShakeStrength=0;

  comboSequence=[];
  comboSequenceTimer=0;

  comboFlowTimer=0;

  nextHeartbeat=0;

  resetUpgrades();

  player.maxHp=100;
  player.hp=100;

  player.maxEnergy=100;
  player.energy=100;

  player.x=W*.5;
  player.y=H*.72;

  player.vx=0;
  player.vy=0;

  player.previousX=
    player.x;

  player.previousY=
    player.y;

  player.walkDistance=0;

  player.invincible=90;

  player.electric=0;
  player.electricLevel=1;

  player.actionLocked=false;
  player.actionTimer=0;

  player.lightCooldown=0;
  player.heavyCooldown=0;
  player.specialCooldown=0;
  player.dashCooldown=0;

  changeState(
    player,
    "idle"
  );

  constrainToRoad(player);

  clearInput();

  musicTrack.currentTime=0;

  if(
    !document.hidden &&
    !quickMuted &&
    !musicMuted
  ){
    startRealMusic();
  }

  refreshMusicVolume(true);

  spawnWave();

  showMessage(
    "⚡ CHOSEN: POWER SURGE ⚡"
  );

}

/* =====================================================
STAGE
===================================================== */

function drawStage(){

  ctx.fillStyle=
    "#050912";

  ctx.fillRect(
    0,
    0,
    W,
    H
  );

  if(
    images.stage.complete &&
    images.stage.naturalWidth
  ){

    const iw=
      images.stage.naturalWidth;

    const ih=
      images.stage.naturalHeight;

    const sourceHeight=
      ih*.69;

    ctx.drawImage(
      images.stage,
      0,
      0,
      iw,
      sourceHeight,
      0,
      0,
      W,
      H*.60
    );

  }

  const sidewalkTop=
    H*.50;

  const sidewalkBottom=
    roadTop();

  const sidewalkGradient=
    ctx.createLinearGradient(
      0,
      sidewalkTop,
      0,
      sidewalkBottom
    );

  sidewalkGradient.addColorStop(
    0,
    "rgba(25,22,25,.55)"
  );

  sidewalkGradient.addColorStop(
    1,
    "#29252a"
  );

  ctx.fillStyle=
    sidewalkGradient;

  ctx.fillRect(
    0,
    sidewalkTop,
    W,
    sidewalkBottom-
    sidewalkTop
  );

  ctx.strokeStyle=
    "rgba(255,255,255,.05)";

  ctx.lineWidth=1;

  for(
    let x=0;
    x<W;
    x+=46
  ){

    ctx.beginPath();

    ctx.moveTo(
      x,
      sidewalkTop
    );

    ctx.lineTo(
      x+5,
      sidewalkBottom
    );

    ctx.stroke();

  }

  ctx.strokeStyle=
    "#51494c";

  ctx.lineWidth=5;

  ctx.beginPath();

  ctx.moveTo(
    0,
    roadTop()
  );

  ctx.lineTo(
    W,
    roadTop()
  );

  ctx.stroke();

  const road=
    ctx.createLinearGradient(
      0,
      roadTop(),
      0,
      H
    );

  road.addColorStop(
    0,
    "#231f22"
  );

  road.addColorStop(
    .55,
    "#19171a"
  );

  road.addColorStop(
    1,
    "#101015"
  );

  ctx.fillStyle=road;

  ctx.fillRect(
    0,
    roadTop(),
    W,
    H-roadTop()
  );

  let row=0;

  for(
    let y=
      roadTop()+8;
    y<H;
    y+=22
  ){

    const depth=
      (
        y-roadTop()
      )/
      (
        H-roadTop()
      );

    const alpha=
      .04+
      depth*.04;

    ctx.strokeStyle=
      `rgba(190,170,160,${alpha})`;

    ctx.beginPath();

    ctx.moveTo(0,y);
    ctx.lineTo(W,y);

    ctx.stroke();

    const spacing=
      48+
      depth*20;

    const offset=
      row%2
        ? spacing/2
        : 0;

    for(
      let x=
        -spacing+offset;
      x<W+spacing;
      x+=spacing
    ){

      ctx.strokeStyle=
        `rgba(180,165,155,${alpha*.65})`;

      ctx.beginPath();

      ctx.moveTo(x,y);

      ctx.lineTo(
        x+2,
        y+20
      );

      ctx.stroke();

    }

    row++;

  }

  const sheen=
    ctx.createLinearGradient(
      0,
      roadTop(),
      W,
      roadBottom()
    );

  sheen.addColorStop(
    0,
    "rgba(70,100,125,.025)"
  );

  sheen.addColorStop(
    .5,
    "rgba(255,255,255,.012)"
  );

  sheen.addColorStop(
    1,
    "rgba(75,95,120,.045)"
  );

  ctx.fillStyle=sheen;

  ctx.fillRect(
    0,
    roadTop(),
    W,
    H-roadTop()
  );

  drawStreetReflection(
    W*.12,
    roadTop()+24,
    "#ff3ab7",
    38,
    68
  );

  drawStreetReflection(
    W*.35,
    roadTop()+32,
    "#f0ad4d",
    24,
    54
  );

  drawStreetReflection(
    W*.69,
    roadTop()+25,
    "#398cff",
    34,
    72
  );

  drawStreetReflection(
    W*.86,
    roadTop()+40,
    "#b64bff",
    27,
    58
  );

  drawPuddle(
    W*.20,
    H*.73,
    48,
    11
  );

  drawPuddle(
    W*.47,
    H*.68,
    36,
    8
  );

  drawPuddle(
    W*.72,
    H*.78,
    50,
    11
  );

  ctx.strokeStyle=
    "rgba(5,6,9,.8)";

  ctx.lineWidth=5;

  ctx.beginPath();

  ctx.ellipse(
    W*.59,
    H*.79,
    36,
    13,
    0,
    0,
    Math.PI*2
  );

  ctx.stroke();

  const now=
    performance.now();

  ctx.strokeStyle=
    "rgba(175,215,240,.11)";

  ctx.lineWidth=1;

  for(
    let i=0;
    i<42;
    i++
  ){

    const x=
      (
        i*93+
        now*.11
      )%W;

    const y=
      (
        i*61+
        now*.30
      )%H;

    ctx.beginPath();

    ctx.moveTo(x,y);

    ctx.lineTo(
      x-3,
      y+12
    );

    ctx.stroke();

  }

}

function drawStreetReflection(
x,
y,
color,
width,
height
){

  ctx.save();

  const gradient=
    ctx.createLinearGradient(
      0,
      y,
      0,
      y+height
    );

  gradient.addColorStop(
    0,
    color
  );

  gradient.addColorStop(
    .22,
    color
  );

  gradient.addColorStop(
    .60,
    "rgba(0,0,0,0)"
  );

  gradient.addColorStop(
    1,
    "rgba(0,0,0,0)"
  );

  ctx.globalAlpha=.075;

  ctx.fillStyle=gradient;

  ctx.beginPath();

  ctx.moveTo(
    x-width*.18,
    y
  );

  ctx.lineTo(
    x+width*.18,
    y
  );

  ctx.lineTo(
    x+width*.38,
    y+height
  );

  ctx.lineTo(
    x-width*.34,
    y+height
  );

  ctx.closePath();

  ctx.fill();

  ctx.restore();

}

function drawPuddle(
x,
y,
width,
height
){

  ctx.save();

  ctx.fillStyle=
    "rgba(85,105,120,.065)";

  ctx.beginPath();

  ctx.ellipse(
    x,
    y,
    width,
    height,
    -.08,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.strokeStyle=
    "rgba(180,205,220,.09)";

  ctx.lineWidth=1;

  ctx.beginPath();

  ctx.ellipse(
    x,
    y,
    width*.88,
    height*.68,
    -.08,
    0,
    Math.PI*2
  );

  ctx.stroke();

  ctx.restore();

}

/* =====================================================
CHARACTERS
===================================================== */

function drawShadow(
entity,
multiplier=1
){

  const scale=
    depthScale(entity.y);

  const compression=
    entity.state==="walk"
      ?
      .94+
      Math.abs(
        Math.sin(
          entity.frame/
          8*
          Math.PI*
          2
        )
      )*.06
      :
      1;

  ctx.fillStyle=
    "rgba(0,0,0,.42)";

  ctx.beginPath();

  ctx.ellipse(
    entity.x,
    entity.y+2,
    27*
    scale*
    multiplier*
    compression,
    8*
    scale,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();

}

function drawPlayer(){

  if(
    respawning &&
    respawnTimer>25
  ){
    return;
  }

  drawShadow(
    player,
    1.08
  );

  if(
    player.invincible>0 &&
    Math.floor(
      player.invincible/4
    )%2
  ){
    ctx.globalAlpha=.45;
  }

  drawSprite(
    images.chosen,
    player,
    chosenAnimations,
    1.18
  );

  ctx.globalAlpha=1;

  if(player.electric>0){

    const scale=
      depthScale(player.y);

    const color=
      abilityColor(
        player.electricLevel
      );

    ctx.save();

    ctx.strokeStyle=
      color.main;

    ctx.shadowColor=
      color.glow;

    ctx.shadowBlur=
      12+
      player.electricLevel*2;

    ctx.lineWidth=
      1.5+
      player.electricLevel*.25;

    for(
      let i=0;
      i<4;
      i++
    ){

      const radius=
        random(
          28,
          42
        )*
        scale;

      ctx.beginPath();

      ctx.arc(
        player.x+
        random(-10,10),
        player.y-
        48*
        scale+
        random(-8,8),
        radius,
        random(0,2),
        random(3.5,6)
      );

      ctx.stroke();

    }

    if(player.electricLevel===7){

      ctx.strokeStyle=
        color.core;

      ctx.lineWidth=1.5;

      ctx.beginPath();

      ctx.arc(
        player.x,
        player.y-
        48*
        scale,
        32*
        scale,
        0,
        Math.PI*2
      );

      ctx.stroke();

    }

    ctx.restore();

  }

}

function drawEnemy(enemy){

  let size=
    enemy.boss
      ? 1.30
      :
      enemy.elite
        ? 1.08
        : 1;

  /*
  Mardi Gras is deliberately a little taller
  than a normal enemy but still agile-looking.
  */

  if(
    enemy.boss &&
    enemy.name==="MARDI GRAS"
  ){
    size=1.42;
  }

  drawShadow(
    enemy,
    size
  );

  if(enemy.hitTimer>0){
    ctx.globalAlpha=.62;
  }

  if(
    enemy.boss &&
    enemy.name===
    "MARDI GRAS"
  ){

    drawMardiSprite(
      enemy,
      size
    );

  }else{

    drawSprite(
      images.voodoo,
      enemy,
      voodooAnimations,
      size
    );

  }

  ctx.globalAlpha=1;

  if(
    !enemy.boss &&
    !enemy.entering
  ){

    const scale=
      depthScale(enemy.y);

    const width=
      48*
      scale;

    const barY=
      enemy.y-
      112*
      scale;

    ctx.fillStyle=
      "#17171b";

    ctx.fillRect(
      enemy.x-
      width/2,
      barY,
      width,
      5
    );

    ctx.fillStyle=
      enemy.elite
        ? "#a546db"
        : "#da3041";

    ctx.fillRect(
      enemy.x-
      width/2,
      barY,
      width*
      (
        enemy.hp/
        enemy.maxHp
      ),
      5
    );

  }

}

/* =====================================================
PICKUPS
===================================================== */

function drawPickups(){

  ctx.textAlign="center";

  pickups.forEach(
    pickup=>{

      const data=
        pickupTypes[
          pickup.type
        ];

      const scale=
        depthScale(pickup.y);

      const bob=
        Math.sin(
          pickup.bob
        )*5;

      const y=
        pickup.y-
        18-
        bob;

      ctx.save();

      ctx.shadowColor=
        data.color;

      ctx.shadowBlur=16;

      ctx.font=
        `bold ${26*scale}px Arial`;

      ctx.fillStyle="white";

      ctx.fillText(
        data.emoji,
        pickup.x,
        y
      );

      ctx.shadowBlur=0;

      ctx.font=
        `bold ${8*scale}px Arial`;

      ctx.fillText(
        data.name,
        pickup.x,
        y+
        17*
        scale
      );

      ctx.restore();

    }
  );

}

/* =====================================================
EFFECT DRAWING
===================================================== */

function drawEffects(){

  effects.forEach(
    effect=>{

      ctx.save();

      const ratio=
        effect.life/
        (
          effect.maxLife||
          effect.life
        );

      const progress=
        1-ratio;

      ctx.globalAlpha=
        Math.max(
          0,
          ratio
        );

      const lvl=
        effect.level||1;

      const colors=
        abilityColor(lvl);

      if(
        effect.type===
        "mardiConfetti"
      ){

        ctx.translate(
          effect.x,
          effect.y
        );

        ctx.rotate(
          effect.rotation||0
        );

        ctx.fillStyle=
          effect.color||
          "#f5c842";

        ctx.fillRect(
          -effect.size/2,
          -effect.size,
          effect.size,
          effect.size*2
        );

      }

      else if(
        effect.type===
        "mardiSpinRing"
      ){

        const radius=
          36+
          progress*70;

        ctx.strokeStyle=
          "#8c42d1";

        ctx.shadowColor=
          "#e1b84b";

        ctx.shadowBlur=16;

        ctx.lineWidth=5;

        ctx.beginPath();

        ctx.ellipse(
          effect.x,
          effect.y,
          radius,
          radius*.36,
          0,
          0,
          Math.PI*2
        );

        ctx.stroke();

        ctx.strokeStyle=
          "#2bc66a";

        ctx.lineWidth=2;

        ctx.beginPath();

        ctx.ellipse(
          effect.x,
          effect.y,
          radius*.76,
          radius*.27,
          0,
          0,
          Math.PI*2
        );

        ctx.stroke();

      }

      else if(
        effect.type==="footstep"
      ){

        ctx.strokeStyle=
          "rgba(155,205,235,.45)";

        ctx.lineWidth=1;

        ctx.beginPath();

        ctx.ellipse(
          effect.x,
          effect.y,
          effect.size*
          (
            1-
            ratio*.25
          ),
          effect.size*.25,
          0,
          0,
          Math.PI*2
        );

        ctx.stroke();

      }

      else if(
        effect.type==="basicSlash"
      ){

        ctx.strokeStyle=
          "#e6f3ff";

        ctx.shadowColor=
          "#5aaeff";

        ctx.shadowBlur=8;

        ctx.lineWidth=3;

        ctx.beginPath();

        ctx.arc(
          effect.x,
          effect.y,
          42+
          progress*8,
          -.9,
          .9
        );

        ctx.stroke();

      }

      else if(
        effect.type==="heavySlash"
      ){

        ctx.strokeStyle=
          "#71dcff";

        ctx.shadowColor=
          "#1eafff";

        ctx.shadowBlur=14;

        ctx.lineWidth=5;

        ctx.beginPath();

        ctx.arc(
          effect.x,
          effect.y,
          50+
          progress*13,
          -1.05,
          .9
        );

        ctx.stroke();

      }

      else if(
        effect.type==="teleportBurst"
      ){

        ctx.strokeStyle=
          colors.main;

        ctx.shadowColor=
          colors.glow;

        ctx.shadowBlur=28;

        ctx.lineWidth=4;

        ctx.beginPath();

        ctx.arc(
          effect.x,
          effect.y,
          10+
          progress*45,
          0,
          Math.PI*2
        );

        ctx.stroke();

        ctx.strokeStyle=
          colors.core;

        ctx.lineWidth=2;

        ctx.beginPath();

        ctx.arc(
          effect.x,
          effect.y,
          5+
          progress*30,
          0,
          Math.PI*2
        );

        ctx.stroke();

      }

      else if(
        effect.type==="tripleSlash"
      ){

        const size=
          55+
          progress*30;

        ctx.strokeStyle=
          colors.core;

        ctx.shadowColor=
          colors.glow;

        ctx.shadowBlur=30;

        ctx.lineWidth=7;

        ctx.beginPath();

        ctx.moveTo(
          effect.x-size,
          effect.y-
          size*.55
        );

        ctx.lineTo(
          effect.x+size,
          effect.y+
          size*.55
        );

        ctx.stroke();

      }

      else if(
        effect.type==="skyStrike"
      ){

        ctx.shadowColor=
          "#003cff";

        ctx.shadowBlur=32;

        ctx.strokeStyle=
          "#f2f7ff";

        ctx.lineWidth=7;

        ctx.beginPath();

        ctx.moveTo(
          effect.x+
          random(-12,12),
          0
        );

        const segments=7;

        for(
          let i=1;
          i<segments;
          i++
        ){

          ctx.lineTo(
            effect.x+
            random(-18,18),
            lerp(
              0,
              effect.y,
              i/segments
            )
          );

        }

        ctx.lineTo(
          effect.x,
          effect.y
        );

        ctx.stroke();

        ctx.strokeStyle=
          "#286dff";

        ctx.lineWidth=14;

        ctx.globalAlpha=.32;

        ctx.stroke();

        ctx.globalAlpha=.72;

        ctx.lineWidth=5;

        ctx.beginPath();

        ctx.ellipse(
          effect.x,
          effect.y,
          20+
          progress*95,
          7+
          progress*26,
          0,
          0,
          Math.PI*2
        );

        ctx.stroke();

      }

      else if(
        effect.type==="burst"
      ){

        const radius=
          35+
          progress*
          (
            75+
            lvl*18
          );

        ctx.strokeStyle=
          colors.main;

        ctx.shadowColor=
          colors.glow;

        ctx.shadowBlur=
          12+
          lvl*4;

        ctx.lineWidth=
          2+
          lvl*.7;

        ctx.beginPath();

        ctx.arc(
          effect.x,
          effect.y,
          radius,
          0,
          Math.PI*2
        );

        ctx.stroke();

        if(lvl>=2){

          ctx.globalAlpha*=.6;

          ctx.beginPath();

          ctx.arc(
            effect.x,
            effect.y,
            radius*.72,
            0,
            Math.PI*2
          );

          ctx.stroke();

        }

      }

      else if(
        effect.type==="arc"
      ){

        ctx.strokeStyle=
          lvl===7
            ? colors.core
            : colors.main;

        ctx.shadowColor=
          colors.glow;

        ctx.shadowBlur=
          8+
          lvl*3;

        ctx.lineWidth=
          1.5+
          lvl*.4;

        ctx.beginPath();

        ctx.moveTo(
          effect.x1,
          effect.y1
        );

        const pieces=6;

        for(
          let i=1;
          i<pieces;
          i++
        ){

          const t=
            i/pieces;

          ctx.lineTo(
            lerp(
              effect.x1,
              effect.x2,
              t
            )+
            random(-7,7),
            lerp(
              effect.y1,
              effect.y2,
              t
            )+
            random(-6,6)
          );

        }

        ctx.lineTo(
          effect.x2,
          effect.y2
        );

        ctx.stroke();

      }

      else if(
        effect.type==="dash"
      ){

        ctx.strokeStyle=
          colors.main;

        ctx.shadowColor=
          colors.glow;

        ctx.shadowBlur=
          10+
          lvl*4;

        ctx.lineWidth=
          3+
          lvl;

        ctx.beginPath();

        ctx.moveTo(
          effect.x-
          effect.facing*
          (
            45+
            lvl*12
          ),
          effect.y-35
        );

        ctx.lineTo(
          effect.x+
          effect.facing*18,
          effect.y-35
        );

        ctx.stroke();

      }

      else if(
        effect.type==="afterimage"
      ){

        ctx.strokeStyle=
          colors.main;

        ctx.shadowColor=
          colors.glow;

        ctx.shadowBlur=
          4+
          lvl*2;

        ctx.lineWidth=
          4+
          lvl*.5;

        ctx.beginPath();

        ctx.moveTo(
          effect.x-18,
          effect.y-35
        );

        ctx.lineTo(
          effect.x+18,
          effect.y-35
        );

        ctx.stroke();

      }

      else if(
        effect.type==="swordWave"
      ){

        ctx.strokeStyle=
          colors.main;

        ctx.shadowColor=
          colors.glow;

        ctx.shadowBlur=
          12+
          lvl*5;

        ctx.lineWidth=
          3+
          lvl*.8;

        ctx.beginPath();

        ctx.arc(
          effect.x+
          effect.facing*24,
          effect.y,
          effect.length,
          -.95,
          .78
        );

        ctx.stroke();

        if(lvl>=6){

          ctx.strokeStyle=
            colors.core;

          ctx.lineWidth=
            1.8+
            lvl*.18;

          ctx.beginPath();

          ctx.arc(
            effect.x+
            effect.facing*24,
            effect.y,
            effect.length*.82,
            -.95,
            .78
          );

          ctx.stroke();

        }

      }

      else if(
        effect.type==="afterWave"
      ){

        ctx.strokeStyle=
          lvl===7
            ? colors.core
            : colors.main;

        ctx.shadowColor=
          colors.glow;

        ctx.shadowBlur=
          10+
          lvl*3;

        ctx.lineWidth=
          2+
          lvl*.35;

        ctx.beginPath();

        ctx.arc(
          effect.x,
          effect.y,
          effect.size||
          (
            62+
            lvl*6
          ),
          -.9,
          .8
        );

        ctx.stroke();

      }

      else if(
        effect.type==="cross"
      ){

        const size=
          effect.size||
          (
            38+
            lvl*10
          );

        ctx.strokeStyle=
          colors.main;

        ctx.shadowColor=
          colors.glow;

        ctx.shadowBlur=
          12+
          lvl*5;

        ctx.lineWidth=
          3+
          lvl*.75;

        ctx.beginPath();

        ctx.moveTo(
          effect.x-size,
          effect.y-size
        );

        ctx.lineTo(
          effect.x+size,
          effect.y+size
        );

        ctx.moveTo(
          effect.x+size,
          effect.y-size
        );

        ctx.lineTo(
          effect.x-size,
          effect.y+size
        );

        ctx.stroke();

      }

      else if(
        effect.type==="crossRing"
      ){

        ctx.strokeStyle=
          colors.main;

        ctx.shadowColor=
          colors.glow;

        ctx.shadowBlur=
          16+
          lvl*4;

        ctx.lineWidth=
          2+
          lvl*.45;

        ctx.beginPath();

        ctx.ellipse(
          effect.x,
          effect.y,
          effect.radius*
          (
            .35+
            progress*.75
          ),
          effect.radius*
          (
            .18+
            progress*.40
          ),
          0,
          0,
          Math.PI*2
        );

        ctx.stroke();

      }

      else if(
        effect.type==="twin"
      ){

        const radius=
          effect.radius||
          (
            45+
            lvl*13
          );

        ctx.strokeStyle=
          colors.main;

        ctx.shadowColor=
          colors.glow;

        ctx.shadowBlur=
          14+
          lvl*5;

        ctx.lineWidth=
          3+
          lvl*.85;

        ctx.beginPath();

        ctx.arc(
          effect.x,
          effect.y,
          radius,
          Math.PI*.20,
          Math.PI*1.15
        );

        ctx.stroke();

        ctx.beginPath();

        ctx.arc(
          effect.x,
          effect.y,
          radius*.82,
          Math.PI*1.1,
          Math.PI*1.95
        );

        ctx.stroke();

      }

      else if(
        effect.type==="shockFloor"
      ){

        ctx.strokeStyle=
          colors.main;

        ctx.shadowColor=
          colors.glow;

        ctx.shadowBlur=
          18+
          lvl*4;

        ctx.lineWidth=
          3+
          lvl*.5;

        ctx.beginPath();

        ctx.ellipse(
          effect.x,
          effect.y,
          effect.radius*
          progress,
          effect.radius*
          .28*
          progress,
          0,
          0,
          Math.PI*2
        );

        ctx.stroke();

      }

      else{

        ctx.fillStyle=
          effect.type==="electricHit"
            ? colors.main
            : "#ff5a4f";

        ctx.shadowColor=
          effect.type==="electricHit"
            ? colors.glow
            : "#ff2929";

        ctx.shadowBlur=
          effect.type==="electricHit"
            ?
            6+
            lvl*2
            :
            5;

        ctx.fillRect(
          effect.x-5,
          effect.y-5,
          10,
          10
        );

      }

      ctx.restore();

    }
  );

}

/* =====================================================
CINEMATIC OVERLAY
===================================================== */

function drawBossIntroOverlay(){

  if(
    !bossIntroActive ||
    !bossIntroBoss
  ){
    return;
  }

  const progress=
    1-
    bossIntroTimer/
    BOSS_INTRO_LENGTH;

  ctx.save();

  /*
  Subtle letterbox bars.
  */

  ctx.fillStyle=
    "rgba(0,0,0,.82)";

  ctx.fillRect(
    0,
    0,
    W,
    Math.min(
      50,
      H*.06
    )
  );

  ctx.fillRect(
    0,
    H-
    Math.min(
      50,
      H*.06
    ),
    W,
    Math.min(
      50,
      H*.06
    )
  );

  /*
  Reveal name during second half.
  */

  if(progress>.42){

    const alpha=
      clamp(
        (
          progress-.42
        )/.16,
        0,
        1
      );

    ctx.globalAlpha=
      alpha;

    ctx.textAlign=
      "center";

    ctx.shadowColor=
      "#7b39c8";

    ctx.shadowBlur=18;

    ctx.fillStyle=
      "#f5c842";

    ctx.font=
      `900 ${Math.max(
        24,
        Math.min(
          42,
          W*.085
        )
      )}px Arial`;

    ctx.fillText(
      "MARDI GRAS",
      W*.5,
      H*.36
    );

    ctx.shadowBlur=8;

    ctx.fillStyle=
      "#ffffff";

    ctx.font=
      `900 ${Math.max(
        10,
        Math.min(
          16,
          W*.03
        )
      )}px Arial`;

    ctx.fillText(
      "THE REVELER",
      W*.5,
      H*.36+24
    );

  }

  ctx.restore();

}

/* =====================================================
BOSS HUD
===================================================== */

function updateBossHud(){

  const bosses=
    getLivingBosses();

  const bossHud=
    document.getElementById(
      "bossHud"
    );

  const row2=
    document.getElementById(
      "bossRow2"
    );

  positionBossHud();

  /*
  Hide health bar during cinematic reveal.
  */

  if(
    bosses.length===0 ||
    bossIntroActive
  ){

    bossHud.style.display=
      "none";

    row2.style.display=
      "none";

    return;

  }

  bossHud.style.display=
    "block";

  const boss1=
    bosses[0];

  document.getElementById(
    "bossName1"
  ).textContent=
    boss1.name+
    " — TIER "+
    boss1.tier;

  document.getElementById(
    "bossBar1"
  ).style.width=
    Math.max(
      0,
      boss1.hp/
      boss1.maxHp*
      100
    )+
    "%";

  if(bosses.length>1){

    const boss2=
      bosses[1];

    row2.style.display=
      "block";

    document.getElementById(
      "bossName2"
    ).textContent=
      boss2.name+
      " — TIER "+
      boss2.tier;

    document.getElementById(
      "bossBar2"
    ).style.width=
      Math.max(
        0,
        boss2.hp/
        boss2.maxHp*
        100
      )+
      "%";

  }else{

    row2.style.display=
      "none";

  }

}

    wave;

  document.getElementById(
    "voltageText"
  ).textContent=
    voltage.toLocaleString();

  document.getElementById(
    "scoreText"
  ).textContent=
    score.toLocaleString();

  document.getElementById(
    "comboText"
  ).textContent=
    combo;

  document.getElementById(
    "livesDisplay"
  ).textContent=
    Array(
      Math.max(
        0,
        lives
      )
    )
    .fill("♥")
    .join(" ");

  updateDangerMode();

  updateBossHud();

}

/* =====================================================
UPDATE
===================================================== */

function update(){

  if(
    gameIsOver ||
    paused
  ){
    return;
  }

  /*
  Boss cinematic gets its own update path.
  Normal combat remains frozen.
  */

  if(bossIntroActive){

    updateBossIntro();

    updateEffects();

    if(messageTimer>0){
      messageTimer--;
    }else{
      document.getElementById(
        "message"
      ).style.opacity=0;
    }

    return;

  }

  if(hitStopFrames>0){

    hitStopFrames--;

    return;

  }

  if(cameraShake>0){

    cameraShake--;

    cameraShakeStrength*=.88;

  }else{

    cameraShakeStrength=0;

  }

  if(comboSequenceTimer>0){

    comboSequenceTimer--;

  }else{

    comboSequence=[];

  }

  updateRespawn();

  updatePlayer();

  updateEnemies();

  updatePickups();

  updateEffects();

  if(comboTimer>0){

    comboTimer--;

  }else{

    combo=0;

  }

  if(messageTimer>0){

    messageTimer--;

  }else{

    document.getElementById(
      "message"
    ).style.opacity=0;

  }

  if(pickupTimer>0){

    pickupTimer--;

  }else{

    document.getElementById(
      "pickupMessage"
    ).style.opacity=0;

  }

}

/* =====================================================
DRAW
===================================================== */

function draw(){

  ctx.save();

  if(cameraShakeStrength>0){

    ctx.translate(
      random(
        -cameraShakeStrength,
        cameraShakeStrength
      ),
      random(
        -cameraShakeStrength*.55,
        cameraShakeStrength*.55
      )
    );

  }

  drawStage();

  const actors=[

    ...enemies.map(
      enemy=>({

        y:enemy.y,

        draw:
          ()=>drawEnemy(enemy)

      })
    ),

    {

      y:player.y,

      draw:
        drawPlayer

    }

  ];

  actors.sort(
    (a,b)=>
    a.y-b.y
  );

  actors.forEach(
    actor=>
    actor.draw()
  );

  drawPickups();

  drawEffects();

  ctx.restore();

  drawBossIntroOverlay();

  updateHud();

}

/* =====================================================
GAME LOOP
===================================================== */

function gameLoop(){

  update();

  draw();

  requestAnimationFrame(
    gameLoop
  );

}

/* =====================================================
START
===================================================== */

player.x=W*.5;
player.y=H*.72;

player.previousX=
  player.x;

player.previousY=
  player.y;

constrainToRoad(player);

positionBossHud();

spawnWave();

showMessage(
  "⚡ CHOSEN: POWER SURGE ⚡"
);

gameLoop();

})();
</script>
